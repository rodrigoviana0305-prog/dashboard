}
function renderNotifPanel(){
  const items = notifItems();
  let html = '<div class="notif-panel">';
  if(!items.length){
    html += '<div class="notif-empty">Nenhuma notificação de agenda.</div>';
  } else {
    items.sort((a,b)=> (a.date+(a.startTime||'')).localeCompare(b.date+(b.startTime||'')));
    items.forEach(s=>{
      const title = scheduleDisplayTitle(s);
      const isUpcoming = s._notifKind==='upcoming';
      const start = (!s.allDay && s.startTime) ? new Date(s.date+'T'+s.startTime+':00') : null;
      const mins = start ? Math.max(0, Math.floor((start.getTime()-Date.now())/60000)) : null;
      const head = isUpcoming ? '⏰ Próxima agenda em '+(mins===0 ? 'menos de 1 minuto' : mins+' min') : '⚠️ Agenda pendente de confirmação';
      html += '<div class="notif-item">'
        + '<div style="font-weight:800;font-size:13px;">'+head+'</div>'
        + '<div style="font-weight:700;font-size:13px;margin-top:3px;">'+esc(title)+'</div>'
        + '<div style="font-size:11.5px;color:var(--ink-soft);margin:2px 0 6px;">'+scheduleDateText(s)+' '+(s.allDay?'(dia todo)':s.startTime+'–'+s.endTime)+' · Você</div>'
        + (isUpcoming
          ? '<div style="font-size:11.5px;color:var(--brand);font-weight:700;">Sua próxima agenda começa em até 30 minutos.</div>'
          : '<div class="row-actions"><button class="btn btn-sm btn-primary" data-action="open-modal" data-modal="confirm-complete" data-id="'+s.id+'">Confirmar</button><button class="btn btn-sm btn-ghost" data-action="mark-not-done" data-id="'+s.id+'">Não realizada</button></div>')
        + '</div>';
    });
  }
  html += '</div>';
  return html;
}

/* ============================= VIEW ROUTER ============================= */
function renderView(){
  if(!state.analysts.length && ui.view!=='settings' && ui.view!=='clients'){
    return '<div class="empty-state"><h3>Comece cadastrando um analista</h3>'
      + '<p>Cada analista tem seu próprio quadro, no estilo Trello, com os clientes em implantação sob sua responsabilidade.</p>'
      + '<button class="btn btn-primary" data-action="open-modal" data-modal="analyst-new">+ Cadastrar analista</button></div>';
  }
  switch(ui.view){
    case 'dashboard': return renderDashboardView();
    case 'board': return renderBoardView();
    case 'calendar': return renderCalendarView();
    case 'reports': return renderReportsView();
    case 'clients': return renderClientsView();
    case 'settings': return renderSettingsView();
    default: return '';
  }
}

/* ============================= DASHBOARD (TELA INICIAL) ============================= */
function renderDashboardView(){
  const today = todayISO();
  const monthRange = currentMonthRange();
  const periodDays = ui.dashboardPeriod==='7' ? 7 : (ui.dashboardPeriod==='90' ? 90 : (ui.dashboardPeriod==='custom' ? 30 : 30));
  const periodStart = addDaysISO(today, -(periodDays-1));
  const periodEnd = today;
  const selectedAnalyst = ui.dashboardAnalyst!=='all' ? getAnalyst(ui.dashboardAnalyst) : null;
  const selectedSegment = ui.dashboardSegment!=='all' ? ui.dashboardSegment : null;
  const selectedCity = ui.dashboardCity!=='all' ? ui.dashboardCity : null;
  const dashboardClients = state.clients.filter(c =>
    (!selectedSegment || String(c.segment||'').trim()===selectedSegment) &&
    (!selectedCity || String(c.city||'').trim()===selectedCity)
  );
  /* Base dos relatórios de clientes.
     Clientes por segmento e Clientes por cidade usam dashboardClients sem filtro
     de analista. Os demais relatórios usam dashboardReportClients. */
  const dashboardClientIds = new Set(dashboardClients.map(c=>c.id));
  const dashboardCardsAll = state.cards.filter(c=>{
    if(!dashboardClientIds.has(c.clientId)) return false;
    if(selectedAnalyst){
      const b=getBoard(c.boardId);
      if(!b || b.analystId!==selectedAnalyst.id) return false;
    }
    return true;
  });
  const dashboardReportClientIds = new Set(dashboardCardsAll.map(c=>c.clientId));
  const dashboardReportClients = selectedAnalyst
    ? dashboardClients.filter(c=>dashboardReportClientIds.has(c.id))
    : dashboardClients.slice();
  const activeCards = dashboardCardsAll.filter(c=>ui.dashboardStatus==='concluidos' ? c.isConcluded : (ui.dashboardStatus==='todos' ? true : !c.isConcluded));
  const dashboardSchedules = state.schedules.filter(s=>{
    if(s.clientId && !dashboardClientIds.has(s.clientId)) return false;
    if(selectedAnalyst && !scheduleAnalystIds(s).includes(selectedAnalyst.id)) return false;
    return dateInRange(s.date, periodStart, periodEnd) || (s.allDay && s.endDate && s.endDate>=periodStart && s.date<=periodEnd);
  });
  const totalBalance = dashboardCardsAll.reduce((s,c)=> s + cardBalanceHours(c), 0);
  const pendConf = dashboardSchedules.filter(s=>scheduleIsDue(s)).length;
  const isMobile = (typeof window!=='undefined' && window.innerWidth<=820);

  let html = '<div class="dash-header"><h2>Painel Geral</h2><p class="hint" style="margin:2px 0 0;">Visão geral do Implanta, atualizada em '+fmtDateBR(today)+'.</p></div>';

  /* ---- Filtros globais do Painel Geral ---- */
  html += '<div class="dash-filter-card">'
    + '<div class="dash-filter-head"><div><div class="dash-filter-title">🔎 Filtros do Painel Geral</div>'
    + '<div class="dash-filter-summary">Os indicadores e análises abaixo consideram os filtros selecionados.</div></div>'
    + '<button type="button" class="btn btn-sm btn-ghost" data-action="dashboard-clear-filters">Limpar filtros</button></div>';
  html += '<div class="dash-filter-grid">';
  html += '<div class="field"><label>Período</label><select id="dash-period-filter" data-action="dashboard-filter"><option value="7" '+(ui.dashboardPeriod==='7'?'selected':'')+'>Últimos 7 dias</option><option value="30" '+(ui.dashboardPeriod==='30'?'selected':'')+'>Últimos 30 dias</option><option value="90" '+(ui.dashboardPeriod==='90'?'selected':'')+'>Últimos 90 dias</option></select></div>';
  html += '<div class="field"><label>Analista</label><select id="dash-analyst-filter" data-action="dashboard-filter"><option value="all">Todos</option>';
  state.analysts.filter(a=>!a.inactive).forEach(a=> html += '<option value="'+esc(a.id)+'" '+(ui.dashboardAnalyst===a.id?'selected':'')+'>'+esc(a.name)+'</option>');
  html += '</select></div>';
  const segmentOptions=[...new Set(state.clients.map(c=>String(c.segment||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  html += '<div class="field"><label>Segmento</label><select id="dash-segment-filter" data-action="dashboard-filter"><option value="all">Todos</option>';
  segmentOptions.forEach(v=> html += '<option value="'+esc(v)+'" '+(ui.dashboardSegment===v?'selected':'')+'>'+esc(v)+'</option>');
  html += '</select></div>';
  const cityOptions=[...new Set(state.clients.map(c=>String(c.city||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  html += '<div class="field"><label>Cidade</label><select id="dash-city-filter" data-action="dashboard-filter"><option value="all">Todas</option>';
  cityOptions.forEach(v=> html += '<option value="'+esc(v)+'" '+(ui.dashboardCity===v?'selected':'')+'>'+esc(v)+'</option>');
  html += '</select></div>';
  html += '<div class="field"><label>Status dos projetos</label><select id="dash-status-filter" data-action="dashboard-filter"><option value="ativos" '+(ui.dashboardStatus==='ativos'?'selected':'')+'>Ativos</option><option value="todos" '+(ui.dashboardStatus==='todos'?'selected':'')+'>Todos</option><option value="concluidos" '+(ui.dashboardStatus==='concluidos'?'selected':'')+'>Concluídos</option></select></div>';
  html += '<div class="field"><label>Base filtrada</label><div style="height:36px;display:flex;align-items:center;font-size:12px;font-weight:800;color:var(--brand-dark);">'+dashboardReportClients.length+' cliente(s)</div></div>';
  html += '</div></div>';

  html += '<!--TOPDASH-->';

  html += '<div class="kpi-grid" style="margin-bottom:22px;">';
  html += kpiCard('📁','Projetos em andamento', activeCards.length, dashboardReportClients.length+' cliente(s) no filtro', 'var(--brand)');
  html += kpiCard('👤','Analistas ativos', state.analysts.filter(a=>!a.inactive).length, state.analysts.length+' no total', 'var(--brand)');
  html += kpiCard('⏳','Saldo total disponível', minToHM(totalBalance*60), totalBalance<0?'atenção: saldo negativo':'dentro do contratado', totalBalance<0?'var(--danger)':'var(--ok)');
  html += kpiCard('🔔','Confirmações pendentes', pendConf, pendConf?'requer atenção':'tudo em dia', pendConf?'var(--danger)':'var(--ok)');
  html += '</div>';

  /* ---- Distribuição de clientes por segmento e cidade ---- */
  const clientTotal = dashboardClients.length;
  const countClientField = (field) => {
    const counts = {};
    dashboardClients.forEach(c=>{
      const raw = String(c[field] || '').trim();
      const label = raw || (field==='segment' ? 'Sem segmento' : 'Sem cidade');
      counts[label] = (counts[label] || 0) + 1;
    });
    return Object.entries(counts).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0], 'pt-BR'));
  };

  const renderClientDistribution = (title, desc, icon, entries) => {
    let out = '<div class="report-section dash-card client-distribution-card">'
      + '<div class="report-section-head"><div class="report-section-icon" style="background:var(--brand-soft);color:var(--brand);">'+icon+'</div>'
      + '<div style="flex:1;"><h2 class="report-section-title">'+title+'</h2>'
      + '<p class="report-section-desc">'+desc+'</p></div></div>';
    out += '<div class="client-distribution-total"><strong>'+clientTotal+'</strong> cliente(s) na base'
      + (entries.length ? ' · '+entries.length+' grupo(s)' : '') + '</div>';
    if(!entries.length){
      out += '<div class="report-empty">Nenhum cliente cadastrado.</div>';
    } else {
      const maxCount = Math.max(1, ...entries.map(e=>e[1]));
      out += '<div class="client-dist-list">';
      entries.forEach(([label,count])=>{
        const pct = clientTotal ? (count/clientTotal)*100 : 0;
        const width = Math.round((count/maxCount)*100);
        const clickAttr = (label!=='Sem segmento' && label!=='Sem cidade')
          ? ' data-action="dashboard-set-filter" data-filter="'+(title.includes('segmento')?'segment':'city')+'" data-value="'+esc(label)+'" title="Clique para filtrar por '+esc(label)+'"'
          : '';
        out += '<div class="client-dist-row"'+clickAttr+' style="'+(clickAttr?'cursor:pointer;':'')+'">'
          + '<div class="client-dist-label"><span class="client-dist-dot"></span><span title="'+esc(label)+'">'+esc(label)+'</span></div>'
          + '<div class="client-dist-track"><div class="client-dist-fill" style="width:'+width+'%;"></div></div>'
          + '<div class="client-dist-value"><strong>'+count+'</strong><small>('+pct.toFixed(1)+'%)</small></div>'
          + '</div>';
      });
      out += '</div>';
    }
    return out + '</div>';
  };

  const clientsBySegment = countClientField('segment');
  const clientsByCity = countClientField('city');

  /* ---- Alertas e pontos de atenção ---- */
  const overdue = dashboardSchedules.filter(s=>scheduleIsDue(s));
  const negativeClients = activeCards.map(c=>({c,client:getClient(c.clientId),bal:cardBalanceHours(c)})).filter(x=>x.client && x.bal<0);
  const lastByClient = {};
  dashboardReportClients.forEach(c=>{
    const scheds = state.schedules.filter(s=>s.clientId===c.id && s.status!=='nao_realizada' && (!selectedAnalyst || scheduleAnalystIds(s).includes(selectedAnalyst.id)));
    lastByClient[c.id] = scheds.reduce((max,s)=> !max || s.date>max ? s.date : max, '');
  });
  const staleClients = dashboardReportClients.map(c=>({client:c,last:lastByClient[c.id]})).filter(x=>!x.last || x.last < addDaysISO(today,-15)).sort((a,b)=>(a.last||'').localeCompare(b.last||''));
  const alertClientCount = new Set(overdue.map(s=>s.clientId).filter(Boolean)).size;
  html += '<div class="dash-alert-grid">';
  const alertCards = [
    {icon:'⚠️',num:overdue.length,label:'Pendências vencidas',items:overdue.slice(0,3).map(s=>({name:s.title||'Agenda sem título',sub:fmtDateBR(s.date)})),tone:'var(--danger)'},
    {icon:'💸',num:negativeClients.length,label:'Projetos com saldo negativo',items:negativeClients.slice(0,3).map(x=>({name:x.client.name,sub:minToHM(x.bal*60)})),tone:'var(--danger)'},
    {icon:'📞',num:staleClients.length,label:'Clientes sem atividade recente',items:staleClients.slice(0,3).map(x=>({name:x.client.name,sub:x.last?'Última: '+fmtDateBR(x.last):'Sem atividade'})),tone:'var(--gold)'}
  ];
  alertCards.forEach(ac=>{
    html += '<div class="dash-alert-card"><div class="dash-alert-top"><div class="dash-alert-icon">'+ac.icon+'</div><div><div class="dash-alert-number" style="color:'+ac.tone+';">'+ac.num+'</div><div class="dash-alert-label">'+ac.label+'</div></div></div>';
    if(ac.items.length){ html += '<div class="dash-alert-list">'; ac.items.forEach(it=> html += '<div class="dash-alert-item"><strong>'+esc(it.name)+'</strong><span>'+esc(it.sub)+'</span></div>'); html += '</div>'; }
    else html += '<div class="dash-section-note">Nenhum item identificado com os filtros atuais.</div>';
    html += '</div>';
  });
  html += '</div>';

  /* ---- Visão executiva da carteira e utilização ---- */
  const filteredAnalysts = state.analysts.filter(a=>!a.inactive && (!selectedAnalyst || a.id===selectedAnalyst.id));
  const analystWork = filteredAnalysts.map(a=>{
    const scheds=dashboardSchedules.filter(s=>s.status==='concluida' && scheduleAnalystIds(s).includes(a.id));
    const mins=scheds.reduce((sum,s)=>sum+scheduleMinutesPerAnalyst(s),0);
    const board=boardOfAnalyst(a.id);
    const cards=dashboardCardsAll.filter(c=>{ const b=getBoard(c.boardId); return !c.isConcluded && b && b.analystId===a.id; });
    return {a,mins,cards:cards.length};
  }).sort((a,b)=>b.mins-a.mins);
  const totalWorked=analystWork.reduce((s,x)=>s+x.mins,0);
  const totalContract=activeCards.reduce((s,c)=>s+(c.contractedHours||0)*60,0);
  const totalUsed=activeCards.reduce((s,c)=>s+cardUsedMinutes(c),0);
  const utilization=totalContract ? Math.round((totalUsed/totalContract)*100) : 0;
  html += '<div class="report-section dash-card-full">'
    + '<div class="report-section-head"><div class="report-section-icon" style="background:#EDE7F6;color:#7B4B94;">📊</div>'
    + '<div style="flex:1;"><h2 class="report-section-title">Visão executiva da carteira</h2>'
    + '<p class="report-section-desc">Distribuição de clientes, projetos e horas dentro dos filtros selecionados.</p></div></div>';
  html += '<div class="dash-trend-grid">'
    + '<div class="dash-trend-item"><span class="dash-trend-label">Clientes na carteira</span><div class="dash-trend-value">'+dashboardReportClients.length+'</div><div class="dash-trend-sub">'+(segmentOptions.length)+' segmentos na base</div></div>'
    + '<div class="dash-trend-item"><span class="dash-trend-label">Projetos ativos</span><div class="dash-trend-value">'+activeCards.length+'</div><div class="dash-trend-sub">'+dashboardCardsAll.filter(c=>c.isConcluded).length+' concluído(s) no filtro</div></div>'
    + '<div class="dash-trend-item"><span class="dash-trend-label">Horas realizadas</span><div class="dash-trend-value">'+minToHM(totalWorked)+'</div><div class="dash-trend-sub">agendas concluídas no período</div></div>'
    + '<div class="dash-trend-item"><span class="dash-trend-label">Utilização contratada</span><div class="dash-trend-value">'+utilization+'%</div><div class="dash-trend-sub">'+minToHM(totalUsed)+' usadas de '+minToHM(totalContract)+'</div></div>'
    + '</div>';
  if(analystWork.length){
    html += '<div style="overflow:auto;margin-top:14px;"><table class="dash-insight-table"><thead><tr><th>Analista</th><th class="num">Clientes / projetos</th><th class="num">Horas no período</th><th class="num">Utilização da carteira</th></tr></thead><tbody>';
    analystWork.forEach(x=>{
      const analystClients=new Set(dashboardCardsAll.filter(c=>{const b=getBoard(c.boardId);return b&&b.analystId===x.a.id;}).map(c=>c.clientId)).size;
      const anContract=activeCards.filter(c=>{const b=getBoard(c.boardId);return b&&b.analystId===x.a.id;}).reduce((s,c)=>s+(c.contractedHours||0)*60,0);
      const anUsed=activeCards.filter(c=>{const b=getBoard(c.boardId);return b&&b.analystId===x.a.id;}).reduce((s,c)=>s+cardUsedMinutes(c),0);
      const anPct=anContract?Math.round(anUsed/anContract*100):0;
      html += '<tr data-action="dashboard-set-filter" data-filter="analyst" data-value="'+esc(x.a.id)+'" class="dash-attention-row"><td><strong>'+esc(x.a.name)+'</strong></td><td class="num">'+analystClients+' / '+x.cards+'</td><td class="num">'+minToHM(x.mins)+'</td><td class="num"><span class="dash-mini-badge" style="background:'+(anPct>=90?'var(--danger-soft)':(anPct>=70?'var(--gold-soft)':'var(--ok-soft)'))+';color:'+(anPct>=90?'var(--danger)':(anPct>=70?'var(--gold)':'var(--ok)'))+';">'+anPct+'%</span></td></tr>';
    });
    html += '</tbody></table></div>';
  } else html += '<div class="report-empty">Nenhum analista corresponde aos filtros atuais.</div>';
  html += '</div>';

  /* ---- Histórico e tendência do período ---- */
  const prevStart=addDaysISO(periodStart,-periodDays), prevEnd=addDaysISO(periodStart,-1);
  const currentDone=dashboardSchedules.filter(s=>s.status==='concluida').reduce((sum,s)=>sum+scheduleMinutesPerAnalyst(s),0);
  const prevDone=state.schedules.filter(s=>{
    if(s.status!=='concluida') return false;
    if(s.clientId && !dashboardClientIds.has(s.clientId)) return false;
    if(selectedAnalyst && !scheduleAnalystIds(s).includes(selectedAnalyst.id)) return false;
    return dateInRange(s.date,prevStart,prevEnd);
  }).reduce((sum,s)=>sum+scheduleMinutesPerAnalyst(s),0);
  const currentCompleted=dashboardSchedules.filter(s=>s.status==='concluida').length;
  const prevCompleted=state.schedules.filter(s=>s.status==='concluida' && (!s.clientId || dashboardClientIds.has(s.clientId)) && (!selectedAnalyst || scheduleAnalystIds(s).includes(selectedAnalyst.id)) && dateInRange(s.date,prevStart,prevEnd)).length;
  const deltaHours=prevDone?Math.round(((currentDone-prevDone)/prevDone)*100):null;
  const deltaAgenda=prevCompleted?Math.round(((currentCompleted-prevCompleted)/prevCompleted)*100):null;
  html += '<div class="report-section dash-card-full"><div class="report-section-head"><div class="report-section-icon" style="background:#E7F5EE;color:var(--ok);">📈</div><div style="flex:1;"><h2 class="report-section-title">Evolução do período</h2><p class="report-section-desc">Comparação com o período imediatamente anterior de mesma duração.</p></div></div>'
    + '<div class="dash-trend-grid">'
    + '<div class="dash-trend-item"><span class="dash-trend-label">Horas atuais</span><div class="dash-trend-value">'+minToHM(currentDone)+'</div><div class="dash-trend-sub">'+(deltaHours===null?'sem base anterior':(deltaHours>=0?'▲ ':'▼ ')+Math.abs(deltaHours)+'% vs. anterior')+'</div></div>'
    + '<div class="dash-trend-item"><span class="dash-trend-label">Agendas concluídas</span><div class="dash-trend-value">'+currentCompleted+'</div><div class="dash-trend-sub">'+(deltaAgenda===null?'sem base anterior':(deltaAgenda>=0?'▲ ':'▼ ')+Math.abs(deltaAgenda)+'% vs. anterior')+'</div></div>'
    + '<div class="dash-trend-item"><span class="dash-trend-label">Pendências vencidas</span><div class="dash-trend-value">'+overdue.length+'</div><div class="dash-trend-sub">dentro do período filtrado</div></div>'
    + '<div class="dash-trend-item"><span class="dash-trend-label">Clientes sem contato</span><div class="dash-trend-value">'+staleClients.length+'</div><div class="dash-trend-sub">mais de 15 dias ou sem atividade</div></div>'
    + '</div></div>';

  const __preTop = html; html = '';

  /* ---- Projetos em andamento ---- */
  html += '<div class="report-section dash-card-full">'
    + '<div class="report-section-head"><div class="report-section-icon" style="background:var(--brand-soft);color:var(--brand);">📁</div>'
    + '<div style="flex:1;"><h2 class="report-section-title">Projetos em andamento</h2>'
    + '<p class="report-section-desc">Cards ainda não concluídos, ordenados por uso do saldo contratado.</p></div></div>';
  if(!activeCards.length){
    html += '<div class="report-empty">Nenhum projeto em andamento no momento.</div>';
  } else {
    const projRows = activeCards.map(c=>{
      const client = getClient(c.clientId);
      const board = getBoard(c.boardId);
      const analyst = board ? getAnalyst(board.analystId) : null;
      const used = cardUsedMinutes(c)/60;
      const pct = c.contractedHours ? Math.min(100, Math.max(0,(used/c.contractedHours)*100)) : 0;
      const bal = cardBalanceHours(c);
      return {client, analyst, pct, bal, typeInfo: cardTypeInfo(client)};
    }).sort((a,b)=> b.pct-a.pct);
    if(isMobile){
      html += '<div class="dash-project-cards">';
      projRows.slice(0,8).forEach(r=>{
        const barClass = r.pct>=90?'danger':(r.pct>=70?'warn':'');
        html += '<div class="dash-project-card">'
          + '<div class="dash-project-top"><strong>'+esc(r.client?r.client.name:'—')+'</strong>'
          + '<span class="badge" style="background:'+r.typeInfo.badgeBg+';color:'+r.typeInfo.badgeColor+';font-size:8.5px;">'+esc(r.typeInfo.label)+'</span></div>'
          + '<div class="dash-project-analyst">'+esc(r.analyst?r.analyst.name:'Sem analista')+'</div>'
          + '<div class="progress-bar-outer" style="margin:7px 0 5px;"><div class="progress-bar-inner '+barClass+'" style="width:'+r.pct+'%;"></div></div>'
          + '<div class="dash-project-bottom"><span>'+r.pct.toFixed(0)+'% usado</span>'
          + '<span style="color:'+(r.bal<0?'var(--danger)':'var(--ok)')+';font-weight:800;">Saldo: '+minToHM(r.bal*60)+'</span></div>'
          + '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="report-table-wrap"><table class="report-table"><thead><tr><th>Cliente</th><th>Analista</th><th>Tipo</th><th>Progresso</th><th class="num">Saldo</th></tr></thead><tbody>';
      projRows.slice(0,8).forEach(r=>{
        const barClass = r.pct>=90?'danger':(r.pct>=70?'warn':'');
        html += '<tr><td><strong>'+esc(r.client?r.client.name:'—')+'</strong></td><td>'+esc(r.analyst?r.analyst.name:'—')+'</td>'
          + '<td><span class="badge" style="background:'+r.typeInfo.badgeBg+';color:'+r.typeInfo.badgeColor+';font-size:9px;">'+esc(r.typeInfo.label)+'</span></td>'
          + '<td style="min-width:130px;"><div class="progress-bar-outer" style="margin:0;"><div class="progress-bar-inner '+barClass+'" style="width:'+r.pct+'%;"></div></div></td>'
          + '<td class="num"><span style="color:'+(r.bal<0?'var(--danger)':'var(--ok)')+';font-weight:800;">'+minToHM(r.bal*60)+'</span></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    if(projRows.length>8) html += '<p class="hint">Mostrando os 8 com maior uso do saldo, de '+projRows.length+' em andamento. <button type="button" class="btn btn-sm btn-ghost" data-action="goto-view" data-view="board" style="margin-left:6px;">Ver quadros →</button></p>';
  }
  html += '</div>';

  /* ---- Horas dos analistas — considera agendas ATÉ HOJE (sem futuras) ---- */
  html += '<div class="report-section dash-card">'
    + '<div class="report-section-head"><div class="report-section-icon" style="background:#EDE7F6;color:#7B4B94;">⏱</div>'
    + '<div style="flex:1;"><h2 class="report-section-title">Horas dos analistas</h2>'
    + '<p class="report-section-desc">Total de horas de todas as agendas cadastradas <strong>até a data de hoje</strong> (agendas futuras não entram), incluindo Férias, Treinamento, Reunião, Visita, Interna, Serviço e demais tipos. Agendas não realizadas são desconsideradas. Os filtros de analista, cidade e segmento continuam valendo.</p></div></div>';
  const dashboardHourSchedules = state.schedules.filter(s=>{
    if(s.status==='nao_realizada') return false;
    const endRef = s.allDay ? (s.endDate || s.date) : s.date;
    if(endRef > today) return false;
    if(selectedAnalyst && !scheduleAnalystIds(s).includes(selectedAnalyst.id)) return false;
    if(isInternalType(s.type)) return true;
    if(s.clientId && !dashboardClientIds.has(s.clientId)) return false;
    return true;
  });
  const analystSchedules = dashboardHourSchedules;
  if(!state.analysts.length){
    html += '<div class="report-empty">Nenhum analista cadastrado.</div>';
  } else if(!analystSchedules.length){
    html += '<div class="report-empty">Nenhuma agenda encontrada até a data de hoje.</div>';
  } else {
    const analystMin = state.analysts.filter(a=>!selectedAnalyst || a.id===selectedAnalyst.id).map(a=>{
      const scheds = analystSchedules.filter(s=>scheduleAnalystIds(s).includes(a.id));
      const mins = scheds.reduce((sum,s)=> sum + scheduleMinutesPerAnalyst(s), 0);
      return {a, mins, count:scheds.length};
    }).sort((x,y)=> y.mins-x.mins || x.a.name.localeCompare(y.a.name,'pt-BR'));
    const maxMin = Math.max(1, ...analystMin.map(x=>x.mins));
    html += '<div class="dash-barlist">';
    analystMin.forEach(({a,mins,count})=>{
      const pct = mins ? Math.round((mins/maxMin)*100) : 0;
      html += '<div class="dash-bar-row"><div class="dash-bar-label"><span class="side-dot" style="background:'+(a.inactive?'#B9CAD5':a.color)+';flex:0 0 auto;"></span>'+esc(a.name)+' <small style="color:var(--ink-faint);font-weight:600;">('+count+' agenda'+(count===1?'':'s')+')</small></div>'
        + '<div class="dash-bar-track"><div class="dash-bar-fill" style="width:'+pct+'%;background:'+(a.inactive?'#B9CAD5':a.color)+';"></div></div>'
        + '<div class="dash-bar-value">'+minToHM(mins)+'</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';

/* ---- Resumo de horas disponíveis dos clientes ---- */
  html += '<div class="report-section dash-card">'
    + '<div class="report-section-head"><div class="report-section-icon" style="background:var(--gold-soft);color:var(--gold);">💰</div>'
    + '<div style="flex:1;"><h2 class="report-section-title">Horas disponíveis dos clientes</h2>'
    + '<p class="report-section-desc">Saldo consolidado dos projetos ativos.</p></div></div>';
  const balRows = activeCards
    .map(c=>({client:getClient(c.clientId), bal: cardBalanceHours(c)}))
    .filter(r => Math.abs(r.bal) > 0.0001)
    .sort((a,b)=> a.bal-b.bal);
  const negCount = balRows.filter(r=>r.bal<0).length;
  if(!balRows.length){
    html += '<div class="report-empty">Nenhum cliente com saldo disponível.</div>';
  } else {
    html += '<div class="hint" style="margin:0 0 10px;">'+(negCount? '⚠ '+negCount+' cliente(s) com saldo negativo.' : '✅ Nenhum cliente com saldo negativo.')+'</div>';
    html += '<div class="dash-barlist">';
    balRows.slice(0,6).forEach(({client,bal})=>{
      html += '<div class="dash-bar-row" style="grid-template-columns:1fr 90px;"><div class="dash-bar-label">'+esc(client?client.name:'—')+'</div>'
        + '<div class="dash-bar-value" style="color:'+(bal<0?'var(--danger)':'var(--ok)')+';">'+minToHM(bal*60)+'</div></div>';
    });
    html += '</div>';
    if(balRows.length>6) html += '<p class="hint">Mostrando os 6 com menor saldo, de '+balRows.length+' clientes com saldo.</p>';
  }
  html += '</div>';

  html = __preTop.replace('<!--TOPDASH-->', '<div class="dash-grid" style="margin-bottom:22px;">'+html+'</div>') + '<div class="dash-grid">';

  /* ---- Total de horas por tipo de agenda — considera agendas ATÉ HOJE ---- */
  html += '<div class="report-section dash-card">'
    + '<div class="report-section-head"><div class="report-section-icon" style="background:#E7F5EE;color:var(--ok);">🗓</div>'
    + '<div style="flex:1;"><h2 class="report-section-title">Horas por tipo de agenda</h2>'
    + '<p class="report-section-desc">Horas de todas as agendas cadastradas <strong>até a data de hoje</strong> (agendas futuras não entram), separadas por tipo. Férias, agendas pendentes e concluídas aparecem; somente agendas não realizadas são desconsideradas. Os filtros de analista, cidade e segmento continuam valendo.</p></div></div>';
  const periodScheds = dashboardHourSchedules;
  if(!periodScheds.length){
    html += '<div class="report-empty">Nenhuma agenda encontrada até a data de hoje.</div>';
  } else {
    const byType = {};
    periodScheds.forEach(s=>{
      const typeName = String(s.type||'Sem tipo').trim() || 'Sem tipo';
      byType[typeName] = (byType[typeName]||0) + scheduleActualMinutes(s);
    });
    const typeEntries = Object.entries(byType).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'pt-BR'));
    const maxTypeMin = Math.max(1, ...typeEntries.map(e=>e[1]));
    html += '<div class="dash-barlist">';
    typeEntries.forEach(([typeName,mins])=>{
      const typeObj = state.agendaTypes.find(t=>String(t.name||'')===typeName);
      const color = typeObj && typeObj.isServico ? '#7B4B94' : (typeObj && typeObj.isInternal ? 'var(--gold)' : 'var(--brand)');
      const pct = Math.round((mins/maxTypeMin)*100);
      const count = periodScheds.filter(s=>(String(s.type||'Sem tipo').trim()||'Sem tipo')===typeName).length;
      html += '<div class="dash-bar-row"><div class="dash-bar-label">'+esc(typeName)+' <small style="color:var(--ink-faint);font-weight:600;">('+count+' agenda'+(count===1?'':'s')+')</small></div>'
        + '<div class="dash-bar-track"><div class="dash-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'
        + '<div class="dash-bar-value">'+minToHM(mins)+'</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';

  /* ---- Módulos mais treinados — respeita filtro de analista ---- */
  html += '<div class="report-section dash-card">'
    + '<div class="report-section-head"><div class="report-section-icon" style="background:#FFF3E0;color:#E67E22;">🎓</div>'
    + '<div style="flex:1;"><h2 class="report-section-title">Módulos mais treinados</h2>'
    + '<p class="report-section-desc">Ranking dos módulos registrados em agendas <strong>até a data de hoje</strong>, concluídas ou pendentes (agendas futuras e não realizadas não entram). O filtro de analista também se aplica a este relatório.</p></div></div>';
  const moduleCounts = {};
  state.schedules.forEach(s=>{
    if(s.status==='nao_realizada') return;
    if(selectedAnalyst && !scheduleAnalystIds(s).includes(selectedAnalyst.id)) return;
    const endRef = s.allDay ? (s.endDate || s.date) : s.date;
    if(endRef > today) return;
    (s.modules||[]).forEach(m=>{
      const name = String(m||'').trim();
      if(!name) return;
      moduleCounts[name] = (moduleCounts[name]||0) + 1;
    });
  });
  const moduleEntries = Object.entries(moduleCounts).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'pt-BR')).slice(0,8);
  if(!moduleEntries.length){
    html += '<div class="report-empty">Nenhum módulo registrado em agendas até hoje. Preencha o campo <strong>Módulo(s)</strong> nas agendas para que apareçam aqui.</div>';
  } else {
    const maxCount = Math.max(1, ...moduleEntries.map(e=>e[1]));
    html += '<div class="dash-barlist">';
    moduleEntries.forEach(([modName,count])=>{
      const pct = Math.round((count/maxCount)*100);
      html += '<div class="dash-bar-row"><div class="dash-bar-label">'+esc(modName)+'</div>'
        + '<div class="dash-bar-track"><div class="dash-bar-fill" style="width:'+pct+'%;background:var(--brand);"></div></div>'
        + '<div class="dash-bar-value">'+count+'x</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';

  /* ---- Ranking de clientes por atendimento sem abatimento (antes de "Clientes por
     segmento", conforme solicitado) ---- */
  const naoAbatidoByClientDash = {};
  state.schedules.forEach(s=>{
    if(s.status!=='concluida') return;
    if(!isInternalType(s.type)) return;
    if(!s.clientId) return;
    if(selectedAnalyst && !scheduleAnalystIds(s).includes(selectedAnalyst.id)) return;
    const isUnlinked = !s.cardId;
    const isZeroed = s.cardId && s.deductMinutes===0;
    if(!isUnlinked && !isZeroed) return;
    naoAbatidoByClientDash[s.clientId] = (naoAbatidoByClientDash[s.clientId]||0) + scheduleActualMinutes(s);
  });
  const naoAbatidoRanking = dashboardClients
    .map(cl=>({client:cl, mins:naoAbatidoByClientDash[cl.id]||0}))
    .filter(x=>x.mins>0)
    .sort((a,b)=>b.mins-a.mins)
    .slice(0,8);
  html += '<div class="report-section dash-card">'
    + '<div class="report-section-head"><div class="report-section-icon" style="background:var(--gold-soft);color:var(--gold);">⚑</div>'
    + '<div style="flex:1;"><h2 class="report-section-title">Ranking de atendimento sem abatimento</h2>'
    + '<p class="report-section-desc">Clientes com mais horas de atendimento interno concluído que não foram descontadas do saldo contratado (agendas internas sem card vinculado, ou com abatimento zerado de propósito).</p></div></div>';
  if(!naoAbatidoRanking.length){
    html += '<div class="report-empty">Nenhum atendimento sem abatimento registrado com os filtros atuais.</div>';
  } else {
    const maxNaoAbatidoMin = Math.max(1, ...naoAbatidoRanking.map(x=>x.mins));
    html += '<div class="dash-barlist">';
    naoAbatidoRanking.forEach(({client,mins})=>{
      const pct = Math.round((mins/maxNaoAbatidoMin)*100);
      html += '<div class="dash-bar-row"><div class="dash-bar-label">'+esc(client.name)+'</div>'
        + '<div class="dash-bar-track"><div class="dash-bar-fill" style="width:'+pct+'%;background:var(--gold);"></div></div>'
        + '<div class="dash-bar-value">'+minToHM(mins)+'</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';

  /* ---- Distribuição de clientes por segmento (na grade 2 colunas) e por cidade
     (seção de largura total, no final, pra fechar a grade sem espaço sobrando —
     eram 5 itens ao todo, número ímpar; "Clientes por cidade" vai sozinha,
     ocupando a largura toda, em vez de deixar um buraco na última linha) ---- */
  html += renderClientDistribution('Clientes por segmento', 'Distribuição da base de clientes conforme o segmento cadastrado. Este relatório não é filtrado por analista.', '🏷️', clientsBySegment);

  html += '</div>'; // fecha a dash-grid de 2 colunas (agora com 4 itens, sem espaço sobrando)

  html += renderClientDistribution('Clientes por cidade', 'Distribuição da base de clientes conforme a cidade cadastrada. Este relatório não é filtrado por analista.', '📍', clientsByCity)
    .replace('report-section dash-card client-distribution-card', 'report-section dash-card dash-card-full client-distribution-card');

  return html;
}

/* ============================= BOARD VIEW ============================= */
function renderBoardView(){
  if(!state.analysts.length) return '<div class="empty-state"><h3>Nenhum quadro selecionado</h3></div>';
  const filterId = ui.boardAnalystFilter || 'all';
  const selectedAnalyst = filterId!=='all' ? getAnalyst(filterId) : null;
  const selectedBoard = selectedAnalyst ? boardOfAnalyst(filterId) : null;
  const q = ui.search.trim().toLowerCase();
  const boards = filterId==='all' ? state.boards.slice() : (selectedBoard ? [selectedBoard] : []);
  if(!boards.length) return '<div class="empty-state"><h3>Nenhum quadro disponível</h3></div>';

  const listDefs = [];
  const seenNames = new Set();
  boards.forEach(b=>{ (b.lists||[]).forEach(l=>{ if(!seenNames.has(l.name)){ seenNames.add(l.name); listDefs.push(l.name); } }); });

  let html = '<div class="board-summary">'
    + '<div class="board-summary-main"><strong>'+listDefs.length+' etapas</strong>'
    + '<span>• '+state.cards.filter(c=>boards.some(b=>b.id===c.boardId)).filter(c=>{ const cl=getClient(c.clientId); return !q || clientMatchesQuery(cl, q); }).length+' clientes em implantação</span></div>'
    + '<span class="board-summary-filter">'+(selectedAnalyst ? 'Analista: '+esc(selectedAnalyst.name)+(selectedAnalyst.inactive?' (inativo)':'') : 'Todos os analistas')+'</span>'
    + '</div>';

  html += '<div class="board-lists unified-board">';
  listDefs.forEach(listName=>{
    let cards = [];
    boards.forEach(b=>{
      const list = (b.lists||[]).find(l=>l.name===listName);
      if(!list) return;
      cards = cards.concat(cardsInBoard(b.id).filter(c=>c.listId===list.id));
    });
    if(q){ cards = cards.filter(c=>{ const cl=getClient(c.clientId); return clientMatchesQuery(cl, q); }); }

    html += '<div class="list-col">'
      + '<div class="list-head"><span class="name">'+esc(listName)+'</span><span class="count">'+cards.length+'</span>'
      + (selectedBoard
        ? (function(){
            const realList = (selectedBoard.lists||[]).find(l=>l.name===listName);
            return realList
              ? '<button class="icon-btn btn-sm" style="width:26px;height:26px;" data-action="delete-list" data-board="'+selectedBoard.id+'" data-list="'+realList.id+'" title="Excluir lista">✕</button>'
              : '';
          })()
        : '')
      + '</div>'
      + '<div class="list-cards" data-unified-list-name="'+esc(listName)+'">';

    cards.forEach(c=> html += renderCardMini(c, listName, filterId));
    html += '</div>';

    if(selectedBoard){
      const realList = (selectedBoard.lists||[]).find(l=>l.name===listName);
      if(realList){ html += '<button class="add-card-btn" data-action="open-modal" data-modal="card-new" data-board="'+selectedBoard.id+'" data-list="'+realList.id+'">+ Adicionar cliente</button>'; }
    }
    html += '</div>';
  });

  if(selectedBoard){ html += '<div class="list-col list-add-col"><button data-action="open-modal" data-modal="list-new" data-board="'+selectedBoard.id+'">+ Nova lista</button></div>'; }
  html += '</div>';
  return html;
}
function renderCardMini(card, listName, filterId){
  const client = getClient(card.clientId);
  const balance = cardBalanceHours(card);
  const myId = myAnalystId();
  const due = pendingConfirmations(myId).some(s=>s.cardId===card.id);
  const board = getBoard(card.boardId);
  const analyst = board ? getAnalyst(board.analystId) : null;
  const pct = cardProgressPercent(card);
  const pctClass = cardProgressClass(pct);
  const attachCount = (card.attachments||[]).length;
  const typeInfo = cardTypeInfo(client);
  let chips = '';
  (card.productTags||[]).forEach(tid=>{ const t=byId(state.productTags,tid); if(t) chips += '<span class="chip" style="background:'+t.color+'">'+esc(t.name)+'</span>'; });
  return '<div class="card-mini'+(card.isConcluded?' done':'')+'" draggable="true" data-card-id="'+card.id+'" data-action="open-card" style="border-left:4px solid '+typeInfo.accent+';">'

function collectTrainedFromCard(card){
  const trains = state.schedules.filter(s=> s.cardId===card.id && s.status==='concluida');
  const mods = new Set();
  const screens = new Set();
  trains.forEach(s=>{
    (s.modules||[]).forEach(m=> mods.add(m));
    (s.trainedScreens||[]).forEach(sc=> screens.add(sc));
  });
  return { modules:[...mods], screens:[...screens] };
}
function renderForecastCompare(card){
  const expectedM = card.expectedModules || [];
  const expectedS = card.expectedScreens || [];
  const trained = collectTrainedFromCard(card);

  function compareList(expectedArr, trainedArr){
    const trainedSet = new Set(trainedArr);
    const expectedSet = new Set(expectedArr);
    const okItems = expectedArr.filter(x=> trainedSet.has(x));
    const missItems = expectedArr.filter(x=> !trainedSet.has(x));
    const extraItems = trainedArr.filter(x=> !expectedSet.has(x));
    return { okItems, missItems, extraItems };
  }
  const cmpM = compareList(expectedM, trained.modules);

  function renderCompareLists(expectedArr, trainedArr, cmp){
    let h = '<div class="compare-grid">';
    h += '<div class="compare-col expected"><h4>Previsto</h4><div class="compare-list">';
    if(!expectedArr.length) h += '<div class="hint">Nenhum item previsto.</div>';
    expectedArr.forEach(name=>{
      const ok = trainedArr.includes(name);
      h += '<div class="compare-item '+(ok?'ok':'miss')+'"><span class="cmp-dot" style="background:'+(ok?'var(--ok)':'var(--danger)')+'"></span>'+esc(name)+(ok?' ✓':' ✗')+'</div>';
    });
    h += '</div></div>';
    h += '<div class="compare-col trained"><h4>Treinado</h4><div class="compare-list">';
    if(!trainedArr.length) h += '<div class="hint">Nada treinado ainda.</div>';
    trainedArr.forEach(name=>{
      const extra = !expectedArr.includes(name);
      h += '<div class="compare-item '+(extra?'extra':'ok')+'"><span class="cmp-dot" style="background:'+(extra?'var(--gold)':'var(--ok)')+'"></span>'+esc(name)+(extra?' +':' ✓')+'</div>';
    });
    h += '</div></div>';
    h += '</div>';
    h += '<div style="margin-top:8px;font-size:12.5px;">'
      + '<span style="color:var(--ok);font-weight:700;">'+cmp.okItems.length+' conferidos</span>'
      + (cmp.missItems.length? ' · <span style="color:var(--danger);font-weight:700;">'+cmp.missItems.length+' pendentes</span>' : '')
      + (cmp.extraItems.length? ' · <span style="color:var(--gold);font-weight:700;">'+cmp.extraItems.length+' extras</span>' : '')
      + '</div>';
    return h;
  }

  let html = '<p class="hint" style="margin-top:-4px;">Compara os itens previstos no card com os efetivamente treinados nas agendas concluídas.</p>';

  html += '<div class="compare-sections"><div class="compare-section-title">Módulos</div>'+renderCompareLists(expectedM, trained.modules, cmpM)+'</div>';

  html += '<div class="compare-sections"><div class="compare-section-title">Telas (por módulo)</div>';
  const screenNameToModuleId = new Map();
  state.screens.forEach(scr=> screenNameToModuleId.set(scr.name, scr.moduleId));
  const allScreenNames = [...new Set([...expectedS, ...trained.screens])];
  const relevantModuleIds = new Set();
  allScreenNames.forEach(name=>{ const mid = screenNameToModuleId.get(name); if(mid) relevantModuleIds.add(mid); });
  const orphanScreens = allScreenNames.filter(name=> !screenNameToModuleId.has(name));
  const relevantModules = state.modules.filter(m=> relevantModuleIds.has(m.id));

  if(!relevantModules.length && !orphanScreens.length){
    html += '<div class="hint">Nenhuma tela prevista ou treinada.</div>';
  } else {
    const tabIds = relevantModules.map(m=>m.id).concat(orphanScreens.length?['__orphan__']:[]);
    const activeId = (ui.cardForecastModuleTab && tabIds.includes(ui.cardForecastModuleTab)) ? ui.cardForecastModuleTab : tabIds[0];
    html += '<div class="module-tabs">';
    relevantModules.forEach(mod=>{
      const modScreenNames = screensForModule(mod.id).map(s=>s.name);
      const expHere = expectedS.filter(n=>modScreenNames.includes(n));
      const trHere = trained.screens.filter(n=>modScreenNames.includes(n));
      const pend = expHere.filter(n=>!trHere.includes(n)).length;
      html += '<button type="button" class="module-tab-btn'+(mod.id===activeId?' active':'')+'" data-action="module-tab-select" data-context="forecast" data-module-id="'+mod.id+'">'+esc(mod.name)+(pend?' <span class="tab-count" style="background:var(--danger);">'+pend+'</span>':'')+'</button>';
    });
    if(orphanScreens.length){
      html += '<button type="button" class="module-tab-btn'+(activeId==='__orphan__'?' active':'')+'" data-action="module-tab-select" data-context="forecast" data-module-id="__orphan__">Sem módulo</button>';
    }
    html += '</div>';
    html += '<div class="module-tab-panels">';
    relevantModules.forEach(mod=>{
      const modScreenNames = screensForModule(mod.id).map(s=>s.name);
      const expHere = expectedS.filter(n=>modScreenNames.includes(n));
      const trHere = trained.screens.filter(n=>modScreenNames.includes(n));
      const cmpHere = compareList(expHere, trHere);
      html += '<div class="module-tab-panel" data-module-id="'+mod.id+'" style="'+(mod.id===activeId?'':'display:none;')+'">'+renderCompareLists(expHere, trHere, cmpHere)+'</div>';
    });
    if(orphanScreens.length){
      const expHere = expectedS.filter(n=>orphanScreens.includes(n));
      const trHere = trained.screens.filter(n=>orphanScreens.includes(n));
      const cmpHere = compareList(expHere, trHere);
      html += '<div class="module-tab-panel" data-module-id="__orphan__" style="'+(activeId==='__orphan__'?'':'display:none;')+'">'+renderCompareLists(expHere, trHere, cmpHere)+'</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* ============================= CALENDAR VIEW ============================= */
function calcCalTimeRange(scheds){
  let minH = 7, maxH = 21;
  scheds.forEach(s=>{
    if(s.allDay) return;
    const sh = Math.floor(timeToMin(s.startTime)/60);
    const eh = Math.ceil(timeToMin(s.endTime)/60);
    if(sh < minH) minH = Math.max(0, sh-1);
    if(eh > maxH) maxH = Math.min(24, eh+1);
  });
  return {startHour:minH, endHour:maxH};
}
function layoutDayEvents(scheds){
  const items = scheds.filter(s=>!s.allDay).map(s=>({ s, start:timeToMin(s.startTime), end:Math.max(timeToMin(s.endTime), timeToMin(s.startTime)+15) }))
    .sort((a,b)=> a.start-b.start || a.end-b.end);
  const clusters = [];
  let current = [], clusterEnd = -1;
  items.forEach(it=>{
    if(current.length && it.start >= clusterEnd){ clusters.push(current); current = []; }
    current.push(it);
    clusterEnd = Math.max(clusterEnd, it.end);
  });
  if(current.length) clusters.push(current);
  const result = [];
  clusters.forEach(cluster=>{
    const lanes = [];
    cluster.forEach(it=>{
      let laneIdx = lanes.findIndex(endT=> it.start >= endT);
      if(laneIdx===-1){ laneIdx = lanes.length; lanes.push(it.end); } else { lanes[laneIdx] = it.end; }
      it.lane = laneIdx;
    });
    const totalLanes = lanes.length;
    cluster.forEach(it=> result.push({sched:it.s, start:it.start, end:it.end, lane:it.lane, lanes:totalLanes}));
  });
  return result;
}

function isServicoType(typeName){ const t = state.agendaTypes.find(t=>t.name===typeName); return !!(t && t.isServico); }
