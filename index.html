<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F4F7F9; --surface:#FFFFFF; --surface-2:#F7F9FB;
    --border:#DCE5EB; --ink:#17324D; --ink-soft:#627486; --ink-faint:#8A9AAA;
    --brand:#0B5C8E; --brand-dark:#073F63; --brand-soft:#D6E9F5;
    --gold:#F0A72F; --gold-soft:#FFF1D8; --danger:#C94B42; --danger-soft:#FCE7E5;
    --ok:#169B67; --ok-soft:#E2F5ED; --purple:#7B4B94;
    --shadow-1:0 2px 8px rgba(23,50,77,.06),0 1px 2px rgba(23,50,77,.04);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:clamp(16px,1.25vw,22px);display:flex;flex-direction:column;}

  .topbar{background:var(--brand-dark);color:#fff;padding:clamp(10px,1vw,18px) clamp(18px,1.8vw,34px);display:flex;align-items:center;gap:clamp(16px,1.6vw,30px);flex:0 0 auto;flex-wrap:wrap;}
  .topbar h1{margin:0;font-size:clamp(22px,2.1vw,34px);font-weight:800;letter-spacing:-.2px;white-space:nowrap;}
  .topbar .updated{font-size:clamp(13px,1.05vw,18px);opacity:.85;margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:8px;font-weight:600;}
  .topbar .updated .pulse{width:10px;height:10px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite;flex:0 0 auto;}
  .topbar .updated .age{opacity:.7;font-weight:500;}
  @keyframes pulse{
    0%   { box-shadow:0 0 0 0 rgba(74,222,128,.7); }
    70%  { box-shadow:0 0 0 10px rgba(74,222,128,0); }
    100% { box-shadow:0 0 0 0 rgba(74,222,128,0); }
  }
  .kpis{display:flex;gap:clamp(10px,1vw,20px);flex:1;flex-wrap:nowrap;min-width:0;}
  .kpi{background:rgba(255,255,255,.08);border-radius:12px;padding:clamp(7px,.7vw,13px) clamp(14px,1.4vw,26px);min-width:0;flex:1 1 170px;}
  .kpi-label{font-size:clamp(13px,1.05vw,18px);font-weight:800;text-transform:uppercase;letter-spacing:.3px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-value{font-size:clamp(30px,3vw,52px);font-weight:800;line-height:1.15;}

  .main{flex:1;display:flex;gap:clamp(10px,1vw,16px);padding:clamp(10px,1vw,16px);min-height:0;}
  .left-col{flex:1 1 78%;display:flex;flex-direction:column;gap:clamp(10px,1vw,16px);min-height:0;min-width:0;}

  .charts-area{flex:1.6;display:grid;grid-template-columns:minmax(0,2.6fr) minmax(0,1fr);gap:clamp(10px,1vw,16px);min-height:0;min-width:0;}
  .projects-panel{min-height:0;min-width:0;display:flex;flex-direction:column;}
  .projects-panel .card-body{display:flex;flex-direction:column;gap:0;}

  .side-charts{display:grid;grid-template-rows:1.35fr 1fr;gap:clamp(10px,1vw,16px);min-height:0;min-width:0;}

  .prazo-strip{flex:0 0 auto;min-height:0;}
  .prazo-strip .card{padding:clamp(10px,1vw,16px) clamp(14px,1.4vw,24px);}
  .prazo-strip .card h2{margin-bottom:2px;}
  .prazo-strip .card p.desc{margin-bottom:10px;}
  .prazo-strip .card-body{overflow:visible;}

  .agenda-panel{flex:0 0 clamp(340px,28vw,520px);max-width:560px;min-width:320px;display:flex;flex-direction:column;min-height:0;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-1);
        display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:clamp(11px,1.1vw,18px) clamp(14px,1.4vw,24px);}
  .card h2{font-size:clamp(19px,1.6vw,27px);margin:0 0 2px;color:var(--brand-dark);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card p.desc{font-size:clamp(13px,1.1vw,18px);color:var(--ink-faint);margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-body{flex:1;min-height:0;overflow:hidden;position:relative;}

  .empty{padding:clamp(12px,1.2vw,22px);text-align:center;color:var(--ink-faint);font-size:clamp(14px,1.15vw,19px);background:var(--surface-2);border-radius:8px;border:1px dashed var(--border);}

  .carousel{overflow:hidden;height:100%;position:relative;}
  .carousel-inner{display:flex;flex-direction:column;will-change:transform;}

  .bar-row{display:grid;grid-template-columns:minmax(110px,32%) 1fr clamp(60px,6.5vw,92px);align-items:center;gap:clamp(8px,.8vw,14px);font-size:clamp(15px,1.3vw,22px);margin-bottom:clamp(6px,.7vw,11px);}
  .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .bar-track{background:var(--surface-2);border-radius:999px;height:clamp(10px,1vw,16px);overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;background:var(--brand);}
  .bar-value{text-align:right;font-weight:800;white-space:nowrap;font-size:clamp(14px,1.25vw,21px);}
  .neg{color:var(--danger);} .pos{color:var(--ok);}
  .dot{width:clamp(10px,.85vw,14px);height:clamp(10px,.85vw,14px);border-radius:50%;flex:0 0 auto;}

  /* ============ LISTA DE SALDO (sem barra) ============ */
  .bal-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:clamp(8px,.8vw,14px);
    padding:clamp(5px,.55vw,10px) 0;
    border-bottom:1px solid var(--border);
    font-size:clamp(15px,1.3vw,22px);
  }
  .bal-row:last-child{ border-bottom:none; }
  .bal-label{
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
    flex:1 1 auto;
  }
  .bal-value{
    font-weight:800;
    white-space:nowrap;
    flex:0 0 auto;
    font-size:clamp(14px,1.25vw,21px);
  }

  /* ============ PROJETOS ============ */
  .proj-row{padding:clamp(6px,.65vw,12px) 0;border-bottom:1px solid var(--border);}
  .proj-row:last-child{border-bottom:none;}
  .proj-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .proj-client{font-weight:800;font-size:clamp(18px,1.65vw,28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .proj-bal{font-weight:800;white-space:nowrap;font-size:clamp(17px,1.55vw,26px);margin-left:auto;}
  .proj-meta{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;margin-bottom:6px;min-width:0;}
  .proj-analyst{font-size:clamp(15px,1.35vw,23px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:70%;}
  .proj-analyst .dot{width:clamp(10px,.85vw,14px);height:clamp(10px,.85vw,14px);}
  .proj-bottom{display:flex;align-items:center;gap:12px;}
  .proj-bottom .bar-track{height:clamp(10px,.9vw,15px);flex:1;}
  .projects-panel h2{font-size:clamp(22px,1.9vw,32px);}
  .projects-panel p.desc{font-size:clamp(14px,1.2vw,19px);margin-bottom:8px;}

  /* Chips de produtos contratados ao lado do nome do cliente */
  .proj-products{
    display:inline-flex;
    flex-wrap:wrap;
    gap:4px;
    flex:0 1 auto;
    min-width:0;
  }
  .proj-chip{
    font-size:clamp(10px,.85vw,14px);
    font-weight:800;
    letter-spacing:.2px;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    line-height:1.35;
    max-width:14ch;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ============ AGENDA ============ */
  .agenda-allday{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;flex:0 0 auto;}
  .agenda-allday-chip{font-size:clamp(14px,1.15vw,19px);font-weight:700;padding:5px 12px;border-radius:8px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-grid-wrap{position:relative;flex:1;min-height:0;overflow:hidden;border-top:1px solid var(--border);}
  .cal-grid{position:relative;}

/* Banco dividido em tabelas por entidade — o dashboard (somente leitura)
   consulta a tabela sync_meta primeiro (carimbos de data, poucos bytes) e só
   busca de novo as tabelas que realmente mudaram desde a última vez. */
const ENTITY_TABLES = [
  {key:'clients', table:'clients'},
  {key:'analysts', table:'analysts'},
  {key:'boards', table:'boards'},
  {key:'cards', table:'cards'},
  {key:'schedules', table:'schedules'},

  {key:'jiraRequirements', table:'jira_requirements'}
];
let tableUpdatedAt = {};
let dashState = {};

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function currentMonthRange(){
  const d = new Date();
  const start = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const end = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(lastDay).padStart(2,'0');
  return {start, end};
}
function dateInRange(iso, range){ return iso >= range.start && iso <= range.end; }
function timeToMin(t){ if(!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+m; }
function countWeekdaysBetweenISO(startIso, endIso){
  let count = 0; let cur = new Date(startIso+'T00:00:00'); const end = new Date(endIso+'T00:00:00');
  while(cur <= end){ if(cur.getDay()!==0 && cur.getDay()!==6) count++; cur.setDate(cur.getDate()+1); }
  return count;
}
function daysBetweenISO(a,b){
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);
}
function fmtDias(n){ return (Math.round(n*10)/10).toLocaleString('pt-BR')+(Math.abs(n)===1?' dia':' dias'); }
function minToHM(min){
  const sign = min<0?'-':''; min = Math.abs(Math.round(min));
  const h = Math.floor(min/60), m = min%60;
  return sign + (m ? h+'h'+String(m).padStart(2,'0') : h+'h');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function readableTextColor(hex){
  if(!hex) return '#fff';
  const h = hex.replace('#','');
  const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum > 0.6 ? '#17324D' : '#fff';
}
const FERIAS_TYPE_NAME = 'Férias';
const FERIAS_MIN_PER_WEEKDAY = 8*60+48;

function buildHelpers(state){
  function isFeriasType(name){ return !!(name && name.toLowerCase()===FERIAS_TYPE_NAME.toLowerCase()); }
  function isInternalType(name){ const t=(state.agendaTypes||[]).find(t=>t.name===name); return !!(t && t.isInternal); }
  function scheduleAnalystIds(s){ return s.analystIds && s.analystIds.length ? s.analystIds : (s.analystId?[s.analystId]:[]); }
  function scheduleDayCount(s){ if(!s.allDay) return 1; const a=new Date(s.date+'T00:00:00'), b=new Date((s.endDate||s.date)+'T00:00:00'); return Math.round((b-a)/86400000)+1; }
  function scheduleSpansDate(s, dateISO){ if(!s.allDay) return s.date===dateISO; const endD = s.endDate || s.date; return dateISO>=s.date && dateISO<=endD; }
  function scheduleMinutesPerAnalyst(s){
    if(s.allDay){
      if(isFeriasType(s.type)) return countWeekdaysBetweenISO(s.date, s.endDate||s.date) * FERIAS_MIN_PER_WEEKDAY;
      return 8*60*scheduleDayCount(s);
    }
    return timeToMin(s.endTime)-timeToMin(s.startTime);
  }
  function scheduleActualMinutes(s){ const per=scheduleMinutesPerAnalyst(s); const n=Math.max(1, scheduleAnalystIds(s).length); return per*n; }
  function cardUsedMinutes(card){
    return (state.schedules||[]).filter(s=>s.cardId===card.id && s.status==='concluida')
      .reduce((sum,s)=> sum + (s.deductMinutes!=null ? s.deductMinutes : scheduleActualMinutes(s)), 0);
  }
  function cardBalanceHours(card){ if(card.balanceForfeited) return 0; return (card.contractedHours||0) - cardUsedMinutes(card)/60; }
  return { isFeriasType, isInternalType, scheduleAnalystIds, scheduleSpansDate, scheduleMinutesPerAnalyst, scheduleActualMinutes, cardUsedMinutes, cardBalanceHours };
}
function byId(arr, id){ return (arr||[]).find(x=>x.id===id); }

/* Mesma regra do app principal (implanta.html): uma agenda "vencida" é uma
   pendente cuja data/hora já passou. Uma agenda pendente cujo horário ainda
   não chegou NÃO conta aqui — ainda está em dia. */
function scheduleIsDue(s){
  if(s.status!=='pendente') return false;
  const dueDate = s.allDay ? (s.endDate||s.date) : s.date;
  const end = new Date(dueDate+'T'+(s.allDay ? '23:59' : (s.endTime||'00:00'))+':00');
  return end.getTime() < Date.now();
}

/* Lista de agendas vencidas — mesmo visual da lista de saldo (sem barra),
   mas com a cor indicando o motivo (vencida vs. marcada como não
   realizada) em vez de positivo/negativo. */
function overdueList(items){
  if(!items.length) return '<div class="empty">Nenhuma agenda vencida. Tudo em dia! ✅</div>';
  return items.map(i=>
    '<div class="bal-row">'

    + '<div class="bal-value" style="color:'+i.color+';">'+esc(i.display)+'</div>'
    + '</div>'
  ).join('');
}

function barList(items, colorFn){
  if(!items.length) return '<div class="empty">Nenhum dado no momento.</div>';
  const max = Math.max(1, ...items.map(i=>i.value));
  return items.map(i=>{
    const pct = Math.round((i.value/max)*100);
    return '<div class="bar-row"><div class="bar-label" title="'+esc(i.label)+'">'+(i.dot?'<span class="dot" style="background:'+i.dot+';"></span>':'')+esc(i.label)+'</div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+(colorFn?colorFn(i):'var(--brand)')+';"></div></div>'
      + '<div class="bar-value '+(i.valueClass||'')+'">'+esc(i.display!=null?i.display:i.value)+'</div></div>';
  }).join('');
}

/* Chips dos produtos contratados (usado em "Projetos em andamento") */
function productChipsHtml(productTags, productTagIds){

      + '</div>'

function layoutDayEvents(scheds){
  const items = scheds.map(s=>({
    s,
    start: timeToMin(s.startTime),
    end: Math.max(timeToMin(s.endTime), timeToMin(s.startTime)+15)
  })).sort((a,b)=> a.start - b.start || a.end - b.end);

  const clusters = [];
  let current = [], clusterEnd = -1;
  items.forEach(it=>{
    if(current.length && it.start >= clusterEnd){ clusters.push(current); current = []; clusterEnd = -1; }
    current.push(it);
    clusterEnd = Math.max(clusterEnd, it.end);
  });
  if(current.length) clusters.push(current);

  const result = [];
  clusters.forEach(cluster=>{
    const lanes = [];
    cluster.forEach(it=>{
      let laneIdx = lanes.findIndex(endT => it.start >= endT);
      if(laneIdx === -1){ laneIdx = lanes.length; lanes.push(it.end); }
      else { lanes[laneIdx] = it.end; }
      it.lane = laneIdx;
    });
    const totalLanes = lanes.length;
    cluster.forEach(it=> result.push({
      sched: it.s, start: it.start, end: it.end, lane: it.lane, lanes: totalLanes
    }));
  });
  return result;
}

function setupCarousel(el){
  if(!el) return;
  if(el._carTimer){ clearTimeout(el._carTimer); el._carTimer = null; }
  if(el._carRAF){ cancelAnimationFrame(el._carRAF); el._carRAF = null; }
  const inner = el.querySelector('.carousel-inner');
  if(!inner) return;
  inner.style.transition = 'none';
  inner.style.transform = 'translateY(0)';
  const wrapperH = el.clientHeight;
  const contentH = inner.scrollHeight;
  if(contentH <= wrapperH + 4){ return; }
  const distance = contentH - wrapperH;
  const speedPxPerSec = 28;
  const pauseMs = 2200;
  let pos = 0, lastTs = 0, phase = 'waiting';
  function step(ts){
    if(!lastTs) lastTs = ts;
    const dt = (ts - lastTs) / 1000; lastTs = ts;
    if(phase === 'scrolling'){
      pos += speedPxPerSec * dt;
      if(pos >= distance){
        pos = distance;
        inner.style.transform = 'translateY(-' + pos + 'px)';
        phase = 'pausing';
        el._carTimer = setTimeout(()=>{
          inner.style.transition = 'transform 0.5s ease';
          inner.style.transform = 'translateY(0)';
          pos = 0;
          setTimeout(()=>{
            inner.style.transition = 'none';
            phase = 'waiting'; lastTs = 0;
            el._carRAF = requestAnimationFrame(step);
          }, 550);
        }, pauseMs);
        return;
      }
      inner.style.transform = 'translateY(-' + pos + 'px)';
      el._carRAF = requestAnimationFrame(step);
    } else if(phase === 'waiting'){
      phase = 'scrolling'; lastTs = 0;
      el._carRAF = requestAnimationFrame(step);
    }
  }
  el._carRAF = requestAnimationFrame(step);
}

function renderDashboard(state){
  const H = buildHelpers(state);
  const clients = state.clients||[], analysts = state.analysts||[], boards = state.boards||[],
        cards = state.cards||[], schedules = state.schedules||[], productTags = state.productTags||[];

  /* Analistas com privilégio "Suporte" (mesmo campo state.analysts[].isSupport
     usado no app principal, ex: activeAnalysts()) não devem aparecer em NADA
     deste dashboard — nem nos quadros de projetos/saldo, nem na agenda do
     dia, nem nos KPIs agregados. Antes disso era feito por um filtro frágil
     de nome (EXCLUDE_ANALYST_NAMES), só aplicado em "Desempenho por
     analista"; agora a exclusão é por papel e vale em todo o dashboard. */
  const supportAnalystIds = new Set(analysts.filter(a=>a.isSupport).map(a=>a.id));
  const supportBoardIds = new Set(boards.filter(b=>supportAnalystIds.has(b.analystId)).map(b=>b.id));
  const visibleCards = cards.filter(c=> !supportBoardIds.has(c.boardId));
  const visibleSchedules = schedules.filter(s=> !H.scheduleAnalystIds(s).some(id=>supportAnalystIds.has(id)));

  const activeCards = visibleCards.filter(c=>!c.isConcluded);
  const monthRange = currentMonthRange();
  const today = todayISO();

  /* Mesma regra do app principal (implanta.html): um card CONCLUÍDO não
     mantém saldo "disponível" na soma total — a sobra que ficou ao
     concluir não é contabilizada aqui (ver kpiCard "Horas contratadas"
     no relatório do app principal: "saldo de concluídos não permanece no
     contratado"). Sem este ajuste, este total diverge do Painel Geral do
     implanta.html sempre que houver cards concluídos com saldo positivo
     ou negativo remanescente. */
  const totalBalance = visibleCards.reduce((s,c)=> s + (c.isConcluded ? 0 : H.cardBalanceHours(c)), 0);

  let totalAbatidoMin = 0;
  visibleSchedules.forEach(s=>{
    if(s.status!=='concluida') return;
    if(!s.cardId) return;
    if(s.deductMinutes === 0) return;
    totalAbatidoMin += (s.deductMinutes != null ? s.deductMinutes : H.scheduleActualMinutes(s));
  });

  const naoAbatidoByClient = {};
  visibleSchedules.forEach(s=>{
    if(s.status!=='concluida' || !H.isInternalType(s.type) || !s.clientId) return;
    const isUnlinked = !s.cardId, isZeroed = s.cardId && s.deductMinutes===0;
    if(!isUnlinked && !isZeroed) return;
    naoAbatidoByClient[s.clientId] = (naoAbatidoByClient[s.clientId]||0) + H.scheduleActualMinutes(s);
  });
  const totalNaoAbatido = Object.values(naoAbatidoByClient).reduce((s,v)=>s+v,0);

  document.getElementById('kpis').innerHTML =
      kpi('📁','Projetos em andamento', activeCards.length)
    + kpi('⏳','Saldo total disponível', minToHM(totalBalance*60), totalBalance<0)
    + kpi('✔','Horas abatidas', minToHM(totalAbatidoMin))
    + kpi('⚑','Horas sem abatimento', minToHM(totalNaoAbatido));

  renderAgendaDoDia(state, H, today, clients, analysts, supportAnalystIds);

  const projectItems = activeCards.map(c=>{
    const client = byId(clients, c.clientId);
    const board = boards.find(b=>b.id===c.boardId);
    const analyst = board ? byId(analysts, board.analystId) : null;
    const used = H.cardUsedMinutes(c)/60;
    const pct = c.contractedHours ? Math.min(100, Math.max(0,(used/c.contractedHours)*100)) : 0;
    const bal = H.cardBalanceHours(c);
    return {client, analyst, pct, bal, productTagIds: c.productTags || []};
  }).sort((a,b)=> b.pct-a.pct);

  document.getElementById('projects-panel').innerHTML =
      '<h2>📁 Projetos em andamento</h2>'
    + '<p class="desc">'+projectItems.length+' no total · ordenados por % de consumo</p>'
    + '<div class="card-body"><div class="carousel" id="proj-carousel"><div class="carousel-inner">'+projectList(projectItems, productTags)+'</div></div></div>';

  let sideHtml = '';

  /* "Agendas vencidas" — mesma regra do app principal: pendente cuja
     data/hora já passou (scheduleIsDue) OU já marcada como não realizada.
     Não considera agendas de analistas com privilégio Suporte. */
  const overdueRows = schedules.filter(s=>{
      if(s.status==='concluida') return false;
      if(!(scheduleIsDue(s) || s.status==='nao_realizada')) return false;
      if(H.scheduleAnalystIds(s).some(id=>supportAnalystIds.has(id))) return false;
      return true;
    })
    .sort((a,b)=> (a.date+'T'+(a.startTime||'00:00')).localeCompare(b.date+'T'+(b.startTime||'00:00')))
    .map(s=>{
      const client = s.clientId ? byId(clients, s.clientId) : null;
      const analystNames = H.scheduleAnalystIds(s).map(id=>{ const a=byId(analysts,id); return a?a.name:null; }).filter(Boolean).join(', ');
      return {
        label: (client ? client.name : 'Interno') + (s.type ? ' · '+s.type : ''),
        display: fmtDateBR(s.date) + (s.allDay ? ' · dia todo' : (s.startTime ? ' · '+s.startTime : '')),
        color: s.status==='nao_realizada' ? 'var(--gold)' : 'var(--danger)',
        analystNames
      };
    });
  const overdueBody = overdueList(overdueRows);
  sideHtml += chartCardCarousel('📋','Agendas vencidas','Pendentes com data já passada ou não realizadas', 'carousel-bal', overdueBody);

  const perfAnalysts = analysts.filter(a=> !a.isSupport);
  let analystHtml;
  if(!perfAnalysts.length){
    analystHtml = '<div class="empty">Nenhum analista para exibir.</div>';
  } else {
    const rows = perfAnalysts.map(a=>{
      const scheds = schedules.filter(s=> H.scheduleAnalystIds(s).includes(a.id) && s.status==='concluida' && dateInRange(s.date, monthRange));
      const totalMin = scheds.reduce((sum,s)=> sum + H.scheduleMinutesPerAnalyst(s), 0);
      const board = boards.find(b=>b.analystId===a.id);
      const cardCount = board ? cards.filter(c=>c.boardId===board.id).length : 0;
      return {a, sessions:scheds.length, totalMin, cardCount};
    }).sort((x,y)=> y.totalMin-x.totalMin);
    analystHtml = '<div class="analyst-grid">' + rows.map(({a,sessions,totalMin,cardCount})=>{
      return '<div class="analyst-card" style="border-left-color:'+(a.inactive?'#B9CAD5':a.color)+';">'
        + '<div class="analyst-card-head"><div class="analyst-avatar" style="background:'+(a.inactive?'#B9CAD5':a.color)+';">'+esc((a.name||'?').charAt(0).toUpperCase())+'</div>'
        + '<div class="analyst-name">'+esc(a.name)+'</div></div>'
        + '<div class="analyst-stats">'
        +   '<div><div class="analyst-stat-num">'+cardCount+'</div><div class="analyst-stat-lbl">Clientes</div></div>'
        +   '<div><div class="analyst-stat-num">'+sessions+'</div><div class="analyst-stat-lbl">Sessões</div></div>'
        +   '<div><div class="analyst-stat-num">'+minToHM(totalMin)+'</div><div class="analyst-stat-lbl">Horas</div></div>'
        + '</div></div>';
    }).join('') + '</div>';
  }
  sideHtml += chartCardCarousel('👤','Desempenho por analista','Clientes, sessões e horas neste mês', 'carousel-an', analystHtml);

  document.getElementById('side-charts').innerHTML = sideHtml;

  requestAnimationFrame(()=>{
    setupCarousel(document.getElementById('proj-carousel'));
    setupCarousel(document.getElementById('carousel-bal'));
    setupCarousel(document.getElementById('carousel-an'));
  });

  const prazoRows = visibleCards.filter(c=>c.commercialDate && c.startDate).map(c=>({
    c, client: byId(clients, c.clientId), days: daysBetweenISO(c.commercialDate, c.startDate)
  }));
  if(!prazoRows.length){
    document.getElementById('prazo-kpis').innerHTML = '<div class="empty">Nenhum card com as duas datas preenchidas.</div>';
  } else {
    const vals = prazoRows.map(r=>r.days).sort((a,b)=>a-b);
    const avg = vals.reduce((x,y)=>x+y,0)/vals.length;
    const mid = vals.length%2 ? vals[(vals.length-1)/2] : (vals[vals.length/2-1]+vals[vals.length/2])/2;
    const minR = prazoRows.reduce((m,r)=> r.days<m.days?r:m, prazoRows[0]);
    const maxR = prazoRows.reduce((m,r)=> r.days>m.days?r:m, prazoRows[0]);
    const nm = r=> r.client ? r.client.name : '—';
    document.getElementById('prazo-kpis').innerHTML = '<div class="prazo-kpis">'
      + prazoKpi('⏱','Média', fmtDias(avg), prazoRows.length+' card(s)')
      + prazoKpi('◎','Mediana', fmtDias(mid), '')
      + prazoKpi('⚡','+ rápido', fmtDias(minR.days), nm(minR))
      + prazoKpi('🐢','+ demorado', fmtDias(maxR.days), nm(maxR))
      + '</div>';
  }
}

function renderAgendaDoDia(state, H, today, clients, analysts, supportAnalystIds){
  document.getElementById('agenda-date').textContent = fmtDateBR(today);
  const all = state.schedules.filter(s=> s.status!=='nao_realizada' && H.scheduleSpansDate(s, today) && !H.scheduleAnalystIds(s).some(id=>supportAnalystIds.has(id)));
  const allDayScheds = all.filter(s=>s.allDay);
  const timedScheds = all.filter(s=>!s.allDay);

  const alldayEl = document.getElementById('agenda-allday');
  if(!allDayScheds.length){ alldayEl.innerHTML = ''; }
  else {
    alldayEl.innerHTML = allDayScheds.map(s=>{
      const analyst = byId(analysts, H.scheduleAnalystIds(s)[0]);
      const color = analyst ? (analyst.inactive?'#B9CAD5':analyst.color) : 'var(--ink-faint)';
      const client = s.clientId ? byId(clients, s.clientId) : null;
      return '<div class="agenda-allday-chip" style="background:'+color+';">'+esc(s.type||'Dia todo')+(client?' · '+esc(client.name):'')+'</div>';
    }).join('');
  }

  const gridWrap = document.getElementById('cal-grid-wrap');
  const gridEl = document.getElementById('cal-grid');

  if(!timedScheds.length){
    gridEl.innerHTML = '<div class="empty" style="margin:10px;">Nenhuma agenda com horário para hoje.</div>';
    document.getElementById('agenda-legend').innerHTML = '';
    return;
  }

  const starts = timedScheds.map(s=>timeToMin(s.startTime));
  const ends = timedScheds.map(s=>Math.max(timeToMin(s.endTime), timeToMin(s.startTime)+15));
  const startHour = Math.max(0, Math.min(7, Math.floor(Math.min(...starts)/60)));
  const endHour   = Math.max(20, Math.ceil(Math.max(...ends)/60));

  if(gridWrap._agendaRO){ gridWrap._agendaRO.disconnect(); gridWrap._agendaRO = null; }
  if(gridWrap._agendaRAF){ cancelAnimationFrame(gridWrap._agendaRAF); gridWrap._agendaRAF = null; }

  const GUTTER_PX = 56;

  function draw(available, wrapWidthPx){
    const totalHours = Math.max(1, endHour - startHour);
    const MIN_PX_PER_HOUR = 20;
    const pxPerHour = Math.max(MIN_PX_PER_HOUR, available / totalHours);
    const pxPerMin = pxPerHour / 60;
    const gridHeight = totalHours * pxPerHour;

    gridEl.style.height = gridHeight + 'px';
    gridWrap.style.overflowY = (gridHeight > available + 1) ? 'auto' : 'hidden';

    let html = '';
    for(let h=startHour; h<=endHour; h++){
      const top = (h-startHour)*pxPerHour;
      html += '<div class="cal-hour-line" style="top:'+top+'px;">'
        + '<span class="cal-hour-label" style="top:0;">'+String(h).padStart(2,'0')+':00</span></div>';
    }

    const laidOut = layoutDayEvents(timedScheds);
    const usedAnalysts = new Set();
    const trackWidth = Math.max(60, wrapWidthPx - GUTTER_PX);
    const GAP = 4;

    laidOut.forEach(item=>{
      const s = item.sched;
      const analyst = byId(analysts, H.scheduleAnalystIds(s)[0]);
      const color = analyst ? (analyst.inactive?'#B9CAD5':analyst.color) : '#8A9AAA';
      if(analyst) usedAnalysts.add(analyst.id);
      const textColor = readableTextColor(color);
      const client = s.clientId ? byId(clients, s.clientId) : null;

      const top    = (item.start - startHour*60) * pxPerMin;
      const height = Math.max((item.end - item.start) * pxPerMin, 22);

      const lanes = item.lanes;
      const laneWidth = (trackWidth - GAP * (lanes - 1)) / lanes;
      const left = GUTTER_PX + item.lane * (laneWidth + GAP);

      html += '<div class="cal-event" style="'
        + 'top:'+top+'px;'
        + 'height:'+height+'px;'
        + 'left:'+left+'px;'
        + 'width:'+laneWidth+'px;'
        + 'background:'+color+';color:'+textColor+';" '
        + 'title="'+esc((s.startTime||'')+'–'+(s.endTime||'')+' · '+(client?client.name:s.type)+' · '+(analyst?analyst.name:''))+'">'
        + '<div class="t">'+esc(s.startTime||'')+' '+esc(client?client.name:(s.type||''))+'</div>'
        + (height>30 ? '<div class="c">'+esc(analyst?analyst.name:'')+'</div>' : '')
        + '</div>';
    });

    const now = new Date();
    const nowMin = now.getHours()*60+now.getMinutes();
    if(nowMin >= startHour*60 && nowMin <= endHour*60){
      html += '<div class="cal-now-line" style="top:'+((nowMin-startHour*60)*pxPerMin)+'px;"></div>';
    }

    gridEl.innerHTML = html;

    const legendItems = analysts.filter(a=>usedAnalysts.has(a.id));
    document.getElementById('agenda-legend').innerHTML = legendItems.map(a=>
      '<span><span class="dot" style="background:'+(a.inactive?'#B9CAD5':a.color)+';"></span>'+esc(a.name)+'</span>'
    ).join('');
  }

  function measure(){
    let h = gridWrap.clientHeight;
    if(!h) h = gridWrap.getBoundingClientRect().height;
    if(!h){
      const card = gridWrap.closest('.card');
      if(card){
        const cardH = card.clientHeight || card.getBoundingClientRect().height;
        h = Math.max(220, cardH - (alldayEl.offsetHeight||0) - 110);
      }
    }
    let w = gridWrap.clientWidth || gridWrap.getBoundingClientRect().width;
    if(!w){
      const card = gridWrap.closest('.card');
      if(card) w = (card.clientWidth || card.getBoundingClientRect().width) - 40;
    }
    return { h: Math.max(220, h || 400), w: Math.max(180, w || 300) };
  }

  gridWrap._agendaRAF = requestAnimationFrame(()=>{
    const m = measure();
    draw(m.h, m.w);

    if(window.ResizeObserver){
      gridWrap._agendaRO = new ResizeObserver(()=>{
        const mm = measure();
        draw(mm.h, mm.w);
      });
      gridWrap._agendaRO.observe(gridWrap);
    }
  });
}

function kpi(icon, label, value, warn){
  return '<div class="kpi"><div class="kpi-label">'+icon+' '+esc(label)+'</div>'
    + '<div class="kpi-value" style="color:'+(warn?'#FFB4A8':'#fff')+';">'+esc(value)+'</div></div>';
}
function chartCardCarousel(icon, title, desc, carouselId, bodyHtml){
  return '<div class="card"><h2>'+icon+' '+esc(title)+'</h2><p class="desc">'+esc(desc)+'</p>'
    + '<div class="card-body"><div class="carousel" id="'+carouselId+'"><div class="carousel-inner">'+bodyHtml+'</div></div></div></div>';
}
function prazoKpi(icon, label, value, sub){
  return '<div class="prazo-kpi"><div class="prazo-kpi-label">'+icon+' '+esc(label)+'</div><div class="prazo-kpi-value">'+esc(value)+'</div><div class="prazo-kpi-sub">'+esc(sub)+'</div></div>';
}

/* ============================================================
   RENDER DO HORÁRIO — mostrado no topbar
   ============================================================ */
let lastRefreshAt = 0;

function paintUpdatedAt(){
  const el = document.getElementById('updated-at');
  if(!el) return;
  if(!lastRefreshAt){
    el.innerHTML = '<span class="pulse"></span>Carregando…';
    return;
  }
  const d = new Date(lastRefreshAt);
  const hora = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const seg = Math.max(0, Math.floor((Date.now() - lastRefreshAt) / 1000));
  const ageTxt = seg < 2 ? 'agora' : ('há ' + seg + 's');
  el.innerHTML = '<span class="pulse"></span>Atualizado às ' + hora
               + ' <span class="age">· ' + ageTxt + '</span>';
}

setInterval(paintUpdatedAt, 1000);

let lastKnownUpdatedAt = null;

async function loadAndRender(){
  const { data: metaRows, error: metaErr } = await sb.from('sync_meta').select('table_name, updated_at');
  if(metaErr) throw metaErr;
  const meta = {};
  (metaRows||[]).forEach(r=> meta[r.table_name] = r.updated_at);

  const isFirstLoad = !lastKnownUpdatedAt;
  const changedEntries = ENTITY_TABLES.filter(({table}) => isFirstLoad || (meta[table] && meta[table] !== tableUpdatedAt[table]));

  if(!changedEntries.length){
    lastRefreshAt = Date.now();
    paintUpdatedAt();
    return;
  }

  const results = await Promise.all(changedEntries.map(({table}) => sb.from(table).select('data')));
  results.forEach(r=>{ if(r.error) throw r.error; });
  changedEntries.forEach(({key}, i)=>{ dashState[key] = (results[i].data||[]).map(row=>row.data); });
  tableUpdatedAt = meta;
  lastKnownUpdatedAt = true;

  if(!Object.keys(dashState).length) throw new Error('Nenhum dado encontrado nas tabelas.');

  renderDashboard(dashState);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  lastRefreshAt = Date.now();
  paintUpdatedAt();
}

/* ============================================================
   LOOP DE ATUALIZAÇÃO RESILIENTE
   ============================================================ */
let refreshTimer = null;
let refreshInFlight = false;
let firstLoadDone = false;

async function refreshLoop(){
  if(refreshInFlight) return;
  refreshInFlight = true;
  const startedAt = Date.now();
  try{
    await loadAndRender();
    firstLoadDone = true;
  } catch(err){
    console.error('[NEO] refresh falhou:', err);
    if(!firstLoadDone){
      document.getElementById('loading').style.display = 'none';
      const errEl = document.getElementById('error');
      errEl.style.display = 'flex';
      errEl.textContent = 'Não foi possível carregar os dados: ' + (err.message || err);
      lastRefreshAt = Date.now();
      paintUpdatedAt();
    }
  } finally {
    refreshInFlight = false;
    const elapsed = Date.now() - startedAt;
    const wait = Math.max(2000, REFRESH_MS - elapsed);
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(refreshLoop, wait);
  }
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    const stale = Date.now() - lastRefreshAt > REFRESH_MS;
    if(stale && !refreshInFlight){
      clearTimeout(refreshTimer);
      refreshLoop();
    }
  }
});

setInterval(()=>{
  if(refreshInFlight) return;
  const stale = Date.now() - lastRefreshAt > REFRESH_MS * 2;
  if(stale){
    console.warn('[NEO] timer atrasado — forçando refresh');
    clearTimeout(refreshTimer);
    refreshLoop();
  }
}, 15000);

window.addEventListener('focus', ()=>{
  const stale = Date.now() - lastRefreshAt > REFRESH_MS;
  if(stale && !refreshInFlight){
    clearTimeout(refreshTimer);
    refreshLoop();
  }
});

setInterval(()=>{
  const deadFor = Date.now() - lastRefreshAt;
  const maxDeadTime = Math.max(30 * 60 * 1000, REFRESH_MS * 3); // margem de segurança proporcional ao intervalo configurado
  if(deadFor > maxDeadTime){
    console.warn('[NEO] sem atualização há muito tempo — recarregando');
    location.reload();
  }
}, 60000);

refreshLoop();
</script>
