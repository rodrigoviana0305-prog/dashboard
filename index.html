<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO - Gestão de Implantação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ECEEED; --bg-soft:#E2E5E3; --surface:#FFFFFF; --surface-2:#F5F6F5;
  --border:#D8DCDA; --ink:#181D1A; --ink-soft:#5A635D; --ink-faint:#8B948D;
  --brand:#2F5D50; --brand-dark:#1F423A; --brand-soft:#DCE8E3;
  --gold:#B9812E; --gold-soft:#F3E3C6;
  --danger:#A73E27; --danger-soft:#F3DCD4;
  --ok:#2F5D50; --ok-soft:#DCE8E3;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shadow-1:0 1px 2px rgba(24,29,26,.08),0 1px 1px rgba(24,29,26,.04);
  --shadow-2:0 12px 32px rgba(24,29,26,.18);
  --font-head:'Manrope',sans-serif; --font-body:'Inter',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181A; --bg-soft:#1A1F21; --surface:#1F2528; --surface-2:#242B2E;
    --border:#343C3F; --ink:#EDEFEE; --ink-soft:#AEB6B2; --ink-faint:#78827E;
    --brand:#5FA48D; --brand-dark:#4A8B75; --brand-soft:#1F332C;
    --gold:#D9A85C; --gold-soft:#392E1A;
    --danger:#DB8770; --danger-soft:#3A241C;
    --ok:#5FA48D; --ok-soft:#1F332C;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#14181A; --bg-soft:#1A1F21; --surface:#1F2528; --surface-2:#242B2E;
  --border:#343C3F; --ink:#EDEFEE; --ink-soft:#AEB6B2; --ink-faint:#78827E;
  --brand:#5FA48D; --brand-dark:#4A8B75; --brand-soft:#1F332C;
  --gold:#D9A85C; --gold-soft:#392E1A;
  --danger:#DB8770; --danger-soft:#3A241C;
  --ok:#5FA48D; --ok-soft:#1F332C;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; font-size:14px; color:inherit; }
button{ cursor:pointer; }
h1,h2,h3,h4{ font-family:var(--font-head); margin:0; color:var(--ink); }
::-webkit-scrollbar{ height:10px; width:10px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.shell{ display:flex; height:100vh; width:100%; overflow:hidden; }
.sidebar{
  width:230px; flex:0 0 230px; background:var(--brand-dark); color:#EFF4F1;
  display:flex; flex-direction:column; padding:18px 14px; gap:18px; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:0 4px; }
.brand-mark{ width:30px;height:30px;border-radius:9px;background:var(--gold); display:flex;align-items:center;justify-content:center; font-family:var(--font-head); font-weight:800; color:#241a06; font-size:15px; flex:0 0 auto;}
.brand-name{ font-family:var(--font-head); font-weight:800; font-size:17px; letter-spacing:.2px; }
.side-section{ display:flex; flex-direction:column; gap:3px; }
.side-label{ font-size:11px; color:#B9CCC3; font-weight:600; padding:6px 8px 2px; display:flex; justify-content:space-between; align-items:center; }
.side-item{
  display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; border:none;
  background:transparent; color:#E4EEE9; text-align:left; width:100%; font-size:13.5px; font-weight:500;
}
.side-item:hover{ background:rgba(255,255,255,.08); }
.side-item.active{ background:rgba(255,255,255,.16); color:#fff; }
.side-item.inactive-analyst{ opacity:.5; }
.side-dot{ width:9px;height:9px;border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(255,255,255,.25) inset; }
.side-badge{ margin-left:auto; background:var(--gold); color:#241a06; font-size:11px; font-weight:800; border-radius:20px; padding:1px 7px; }
.side-badge.inativo{ background:#6B7A73; color:#E4EEE9; }
.side-add{ display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:8px; border:1px dashed rgba(255,255,255,.3); background:transparent; color:#CFE0D8; font-size:13px; width:100%; }
.side-add:hover{ background:rgba(255,255,255,.06); }
.side-spacer{ flex:1; }
.side-foot{ font-size:11px; color:#9FB6AC; padding:6px 8px; line-height:1.5; }

.main{ flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar{
  display:flex; align-items:center; gap:14px; padding:14px 22px; background:var(--surface);
  border-bottom:1px solid var(--border); flex:0 0 auto;
}
.topbar h2{ font-size:19px; }
.topbar .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:1px; }
.topbar-title{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; position:relative; }
.search-box{
  display:flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; padding:7px 11px; min-width:200px;
}
.search-box input{ border:none; background:transparent; outline:none; width:100%; color:var(--ink); }
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border); background:var(--surface-2);
  display:flex;align-items:center;justify-content:center; position:relative; flex:0 0 auto;
}
.icon-btn:hover{ background:var(--bg-soft); }
.notif-dot{ position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:10px; font-weight:800; border-radius:20px; min-width:16px; height:16px; display:flex;align-items:center;justify-content:center; padding:0 3px; }
.view{ flex:1; overflow:auto; padding:20px 22px 40px; }

.btn{ border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:8px 14px; font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;}
.btn:hover{ background:var(--surface-2); }
.btn-primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn-primary:hover{ background:var(--brand-dark); }
.btn-gold{ background:var(--gold); border-color:var(--gold); color:#241a06; }
.btn-gold:hover{ filter:brightness(0.95); }
.btn-danger{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
.btn-danger:hover{ background:var(--danger); color:#fff; }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-sm{ padding:5px 10px; font-size:12.5px; border-radius:7px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.board-lists{ display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:16px; min-height:60vh; }
.list-col{ background:var(--bg-soft); border-radius:var(--radius-m); width:270px; flex:0 0 270px; display:flex; flex-direction:column; max-height:calc(100vh - 190px); }
.list-head{ display:flex; align-items:center; gap:8px; padding:11px 12px 7px; }
.list-head .name{ font-weight:700; font-size:13.5px; flex:1; }
.list-head .count{ font-size:11.5px; color:var(--ink-faint); background:var(--surface); border-radius:20px; padding:1px 8px; }
.list-cards{ flex:1; overflow-y:auto; padding:2px 10px; display:flex; flex-direction:column; gap:9px; min-height:40px; }
.list-cards.drag-over{ background:var(--brand-soft); border-radius:8px; }
.card-mini{ background:var(--surface); border-radius:9px; padding:10px 11px; box-shadow:var(--shadow-1); cursor:grab; border:1px solid transparent; display:flex; flex-direction:column; gap:6px; }
.card-mini:hover{ border-color:var(--border); }
.card-mini.dragging{ opacity:.4; }
.card-mini.done{ border-left:4px solid var(--ok); }
.chip-row{ display:flex; flex-wrap:wrap; gap:4px; }
.chip{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; color:#fff; letter-spacing:.2px; }
.card-title{ font-weight:700; font-size:13.5px; color:var(--ink); }
.card-meta{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap; }
.balance-pill{ font-weight:700; padding:1px 7px; border-radius:20px; background:var(--ok-soft); color:var(--ok); }
.balance-pill.neg{ background:var(--danger-soft); color:var(--danger); }
.pending-flag{ color:var(--danger); font-weight:700; display:flex; align-items:center; gap:3px; }
.done-flag{ color:var(--ok); font-weight:700; display:flex; align-items:center; gap:3px; }
.attach-flag{ color:var(--brand); font-weight:700; display:flex; align-items:center; gap:3px; font-size:11px; background:var(--brand-soft); padding:1px 7px; border-radius:20px; }
.add-card-btn{ margin:4px 10px 10px; padding:8px 10px; border-radius:8px; background:transparent; border:1px dashed var(--border); color:var(--ink-soft); text-align:left; font-size:13px; }
.add-card-btn:hover{ background:var(--surface); color:var(--ink); }
.list-add-col{ width:230px; flex:0 0 230px; }
.list-add-col button{ width:100%; padding:11px; border-radius:var(--radius-m); border:1.5px dashed var(--border); background:transparent; color:var(--ink-soft); font-weight:600; }
.list-add-col button:hover{ background:var(--surface); }

.empty-state{ text-align:center; padding:70px 20px; max-width:440px; margin:0 auto; }
.empty-state h3{ font-size:20px; margin-bottom:8px; }
.empty-state p{ color:var(--ink-soft); margin-bottom:20px; }

.overlay{ position:fixed; inset:0; background:rgba(15,20,17,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:100; }
.overlay.card-overlay{ z-index:90; }
.overlay.confirm-overlay{ z-index:300; }
.modal{ background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow-2); width:100%; max-width:520px; padding:22px 24px 24px; }
.modal.wide{ max-width:760px; }
.modal-header{ display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; }
.modal-header h3{ font-size:18px; flex:1; overflow-wrap:anywhere; }
.modal-close{ background:none;border:none;font-size:20px;color:var(--ink-faint); line-height:1; padding:2px 4px;}
.modal-close:hover{ color:var(--ink); }
.field{ margin-bottom:13px; display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field input[type=email], .field input[type=tel], .field input[type=password], .field select, .field textarea{
  border:1px solid var(--border); border-radius:8px; padding:9px 10px; background:var(--surface-2); color:var(--ink); outline:none; width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--brand); background:var(--surface); }
.field textarea{ resize:vertical; min-height:60px; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.check-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.check-pill{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:20px; padding:5px 11px; font-size:12.5px; background:var(--surface-2); }
.module-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.module-tab-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:8px 8px 0 0; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
.module-tab-btn:hover{ background:var(--surface); }
.module-tab-btn.active{ background:var(--surface); border-bottom:2px solid var(--brand,#2E7D32); color:var(--brand,#2E7D32); font-weight:700; }
.module-tab-btn .tab-count{ display:inline-block; background:var(--brand,#2E7D32); color:#fff; border-radius:10px; font-size:10.5px; padding:1px 6px; margin-left:4px; }
.module-tab-panels{ border:1px solid var(--border); border-radius:0 8px 8px 8px; padding:10px; background:var(--surface); }
.module-tab-panel .hint{ margin:2px 0; }
.check-pill input{ accent-color:var(--brand); }
.form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap;}
.error-msg{ background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:8px 11px; font-size:12.5px; font-weight:600; margin-bottom:12px; white-space:pre-line; }
input[type=color]{ width:38px; height:32px; padding:2px; border:1px solid var(--border); border-radius:7px; background:var(--surface-2); }

.card-modal-meta{ font-size:12.5px; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap; margin-top:4px; }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin:16px 0 16px; flex-wrap:wrap; }
.tab-btn{ background:none; border:none; padding:9px 4px; margin-right:16px; font-weight:700; color:var(--ink-faint); border-bottom:2px solid transparent; }
.tab-btn.active{ color:var(--brand); border-color:var(--brand); }
.balance-box{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.balance-item{ flex:1; background:var(--surface-2); border-radius:10px; padding:11px 13px; text-align:center; min-width:100px; }
.balance-item .num{ font-family:var(--font-head); font-weight:800; font-size:19px; }
.balance-item .lbl{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

.progress-bar-outer{ background:var(--surface-2); border-radius:999px; height:14px; overflow:hidden; border:1px solid var(--border); margin:6px 0 10px; }
.progress-bar-inner{ height:100%; border-radius:999px; transition:width .3s ease; background:var(--ok); }
.progress-bar-inner.warn{ background:var(--gold); }
.progress-bar-inner.danger{ background:var(--danger); }
.progress-meta{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); font-weight:600; }

.sched-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 11px; border:1px solid var(--border); border-radius:9px; margin-bottom:8px; background:var(--surface-2); }
.sched-row.due{ border-color:var(--danger); background:var(--danger-soft); }
.sched-main{ flex:1; min-width:0; }
.sched-time{ font-weight:700; font-size:13px; }
.sched-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.badge{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; }
.badge.pendente{ background:var(--gold-soft); color:var(--gold); }
.badge.concluida{ background:var(--ok-soft); color:var(--ok); }
.badge.nao_realizada{ background:var(--danger-soft); color:var(--danger); }
.hist-row{ padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
.hist-row .ts{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
.row-actions{ display:flex; gap:5px; flex:0 0 auto; flex-wrap:wrap;}

/* ============ CALENDÁRIO — GRID DINÂMICO (--cal-days) ============ */
.cal-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.cal-toolbar .grow{ flex:1; }
.cal-tg-outer{ border:1px solid var(--border); border-radius:10px; overflow-x:auto; overflow-y:hidden; background:var(--surface); --cal-days:7; }
.cal-tg-inner{ width:100%; min-width:calc(56px + var(--cal-days) * 90px); }
.cal-tg-headerrow,
.cal-tg-bodyrow,
.cal-tg-footerrow{
  display:grid;
  grid-template-columns:56px repeat(var(--cal-days),1fr);
}
.cal-tg-headerrow{ border-bottom:1px solid var(--border); background:var(--surface); }
.cal-tg-daycol-head{ padding:8px 6px; text-align:center; border-left:1px solid var(--border); }
.cal-tg-daycol-head .wd{ font-size:10.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; }
.cal-tg-daycol-head .dt{ font-family:var(--font-head); font-weight:800; font-size:14px; }
.cal-tg-daycol-head.today .dt{ color:var(--brand); }
.cal-tg-bodyscroll{ max-height:64vh; overflow-y:auto; }
.cal-tg-bodyrow{ position:relative; }
.cal-tg-hourlabels{ position:relative; }
.cal-tg-hourlabel{ position:absolute; right:8px; transform:translateY(-50%); font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
.cal-tg-daycol{ position:relative; border-left:1px solid var(--border); cursor:pointer; background-image:repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 1px, transparent 1px, transparent var(--hour-px)); }
.cal-tg-footerrow{ border-top:1px solid var(--border); background:var(--surface-2); padding:6px 0; }
.cal-tg-footer-label{ padding:4px 6px; font-size:9.5px; color:var(--ink-faint); font-weight:800; text-transform:uppercase; letter-spacing:.4px; display:flex; align-items:center; }
.cal-tg-footer-day{ padding:3px 6px; border-left:1px solid var(--border); display:flex; flex-direction:column; gap:3px; min-height:20px; }
.wl-bar{ display:flex; align-items:center; gap:4px; border-radius:5px; padding:2px 6px; font-size:9.5px; font-weight:800; color:#fff; }
.wl-dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 1px rgba(255,255,255,.5); }
.wl-pct{ white-space:nowrap; }
.cal-tg-daycol:hover{ background-color:var(--surface-2); }
.cal-tg-daycol.drag-over{ background-color:var(--brand-soft); }
.cal-tg-event{ position:absolute; border-radius:6px; padding:3px 6px; font-size:11px; overflow:hidden; cursor:pointer; line-height:1.3; font-weight:600; color:#fff; }
.cal-tg-event .resize-handle{ position:absolute; left:0; right:0; height:8px; cursor:ns-resize; z-index:3; }
.cal-tg-event .resize-handle.top{ top:0; }
.cal-tg-event .resize-handle.bottom{ bottom:0; }
.cal-tg-event .resize-handle:hover, .cal-tg-event.resizing .resize-handle{ background:rgba(255,255,255,.4); }
.cal-tg-event.resizing{ box-shadow:0 0 0 2px #fff inset; z-index:20; }
.cal-tg-event[draggable="true"]{ cursor:grab; }
.cal-tg-event.dragging{ opacity:.4; }
.cal-tg-event:hover{ filter:brightness(0.9); }
.cal-tg-event .t{ font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-tg-event .s{ opacity:.9; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-tg-event.allday{ min-width:0; max-width:100%; }
.cal-tg-event.allday .t{ white-space:normal; overflow-wrap:anywhere; word-break:break-word; text-overflow:clip; }
.cal-tg-now{ position:absolute; left:0; right:0; height:0; border-top:2px solid var(--danger); z-index:5; pointer-events:none; }
.cal-tg-now::before{ content:''; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--danger); }
.notif-panel{ position:absolute; top:44px; right:0; width:330px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-2); padding:8px; z-index:50; max-height:400px; overflow-y:auto; }
.notif-item{ padding:9px 10px; border-radius:8px; }
.notif-item:hover{ background:var(--surface-2); }
.notif-empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:13px; }
.client-picker{ position:relative; }
.client-picker-input-wrap{ display:flex; align-items:center; gap:7px; border:1px solid var(--border); border-radius:8px; padding:9px 10px; background:var(--surface-2); }
.client-picker-input-wrap input{ border:none; background:transparent; outline:none; width:100%; color:var(--ink); }
.client-picker-results{ position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-top:4px; box-shadow:var(--shadow-2); max-height:220px; overflow-y:auto; z-index:20; }
.client-picker-result{ display:block; width:100%; text-align:left; padding:9px 11px; border:none; background:none; font-size:13px; color:var(--ink); border-bottom:1px solid var(--border); }
.client-picker-result:last-child{ border-bottom:none; }
.client-picker-result:hover{ background:var(--surface-2); }
.client-picker-empty{ padding:12px; text-align:center; color:var(--ink-faint); font-size:12.5px; }
.client-picker-selected{ display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px solid var(--border); border-radius:8px; padding:9px 11px; background:var(--brand-soft); }

table{ width:100%; border-collapse:collapse; background:var(--surface); border-radius:10px; overflow:hidden; }
th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
th{ background:var(--surface-2); font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; color:var(--ink-soft); font-weight:700; }
tr:last-child td{ border-bottom:none; }
tr.row-inactive{ opacity:.55; }
.section-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:18px; overflow-x:auto; }
.section-card h3{ font-size:15px; margin-bottom:12px; }
.settings-tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.inline-add{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.hint{ font-size:12px; color:var(--ink-faint); margin-top:8px; }
#print-root{ position:fixed; left:-9999px; top:-9999px; width:800px; }
.topbar-hamburger{ display:none; width:38px; height:38px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); align-items:center; justify-content:center; flex:0 0 auto; font-size:18px; }
.sidebar-backdrop{ position:fixed; inset:0; background:rgba(15,20,17,.45); z-index:290; }

.switch{ position:relative; display:inline-block; width:44px; height:24px; vertical-align:middle; }
.switch input{ opacity:0; width:0; height:0; }
.switch .slider{ position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#C7D2DA; border-radius:24px; transition:.2s; }
.switch .slider::before{ content:''; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + .slider{ background:var(--ok); }
.switch input:checked + .slider::before{ transform:translateX(20px); }
.switch input:disabled + .slider{ opacity:.5; cursor:not-allowed; }
.status-label{ font-size:11.5px; font-weight:700; margin-left:6px; vertical-align:middle; }
.status-label.active{ color:var(--ok); }
.status-label.inactive{ color:var(--ink-faint); }

.choice-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.choice-box .choice-title{ font-weight:700; font-size:14px; color:var(--ink); margin-bottom:4px; }
.choice-box .choice-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
.choice-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }

.nao-abatido{ color:var(--gold); font-weight:700; }
.nao-abatido-pill{ background:var(--gold-soft); color:var(--gold); font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px; margin-left:6px; letter-spacing:.2px; }

.multi-analyst-grid{ display:flex; flex-wrap:wrap; gap:8px; padding:10px; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); }
.multi-analyst-item{ display:flex; align-items:center; gap:8px; padding:6px 12px 6px 8px; border:1px solid var(--border); border-radius:20px; background:var(--surface); font-size:12.5px; font-weight:600; cursor:pointer; transition:.14s ease; }
.multi-analyst-item:hover{ border-color:#79AFCB; }
.multi-analyst-item input{ accent-color:var(--brand); }
.multi-analyst-item.checked{ border-color:var(--brand); background:var(--brand-soft); color:var(--brand); }
.multi-analyst-item .m-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
.multi-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; }

.allday-toggle{ display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); cursor:pointer; width:fit-content; font-size:12.5px; font-weight:600; }
.allday-toggle input{ accent-color:var(--brand); }
.allday-banner{ background:#E0F2F1; color:#00695C; border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:600; margin-bottom:10px; }
.allday-banner .allday-time{ font-weight:800; color:#004D40; }
.allday-badge{ background:#E0F2F1; color:#00897B; border-radius:20px; padding:2px 8px; font-size:10.5px; font-weight:800; margin-left:4px; }
.cal-tg-event.allday.multiday{ background-image:linear-gradient(to right, transparent 0%, transparent 92%, rgba(0,0,0,.06) 92%, rgba(0,0,0,.06) 100%); border-right:1px dashed rgba(0,0,0,.15); }
.cal-tg-event.allday.continuation{ border-left:1px dashed rgba(0,0,0,.15); border-top-left-radius:0; border-bottom-left-radius:0; }
.cal-tg-event.allday.continuation .t{ opacity:.85; }

.compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px; }
.compare-col{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--surface-2); }
.compare-col h4{ font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin-bottom:8px; }
.compare-col.expected{ background:#FFF7E6; border-color:#F0D9A8; }
.compare-col.trained{ background:#E7F5EE; border-color:#B7E0CA; }
.compare-item{ font-size:12.5px; padding:3px 0; display:flex; align-items:center; gap:6px; }
.compare-item.ok{ color:var(--ok); font-weight:700; }
.compare-item.miss{ color:var(--danger); font-weight:700; }
.compare-item.extra{ color:var(--gold); font-weight:700; }
.compare-item .cmp-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
.compare-list{ display:flex; flex-direction:column; gap:2px; }
.compare-sections{ margin-top:14px; display:flex; flex-direction:column; gap:14px; }
.compare-section-title{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); margin-bottom:6px; }

.attach-dropzone{
  border:2px dashed var(--border); border-radius:10px; padding:14px; text-align:center;
  background:var(--surface-2); cursor:pointer; transition:.15s ease;
}
.attach-dropzone:hover, .attach-dropzone.drag-over{ border-color:var(--brand); background:var(--brand-soft); }
.attach-dropzone .adz-icon{ font-size:22px; }
.attach-dropzone .adz-title{ font-weight:700; font-size:13px; margin-top:4px; color:var(--ink); }
.attach-dropzone .adz-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
.attach-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
.attach-item{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--border);
  border-radius:9px; background:var(--surface);
}
.attach-item .att-icon{
  width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:18px; flex:0 0 auto; color:#fff;
}
.attach-item .att-body{ flex:1; min-width:0; }
.attach-item .att-name{ font-weight:700; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attach-item .att-meta{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
.attach-item .att-actions{ display:flex; gap:5px; flex:0 0 auto; }
.att-icon.pdf{ background:#C0392B; }
.att-icon.img{ background:#8E44AD; }
.att-icon.doc{ background:#2980B9; }
.att-icon.xls{ background:#1E8449; }
.att-icon.zip{ background:#B7950B; }
.att-icon.other{ background:#5D6D7E; }

.attach-warn{
  background:var(--gold-soft); color:var(--gold); border-radius:8px; padding:8px 11px;
  font-size:12px; font-weight:600; margin-top:8px;
}

@media screen and (max-width:820px){
  .shell{ position:relative; }
  .sidebar{ position:fixed; top:0; left:0; bottom:0; z-index:300; width:250px; transform:translateX(-100%); transition:transform .22s ease; box-shadow:none; }
  .sidebar.open{ transform:translateX(0); box-shadow:var(--shadow-2); }
  .topbar-hamburger{ display:flex; }
  .topbar{ padding:12px 14px; gap:10px; flex-wrap:wrap; }
  .topbar h2{ font-size:16px; }
  .topbar-title{ min-width:0; overflow:hidden; }
  .topbar-title h2{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar-title .sub, .topbar .sub{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar-right{ margin-left:0; }
  .search-box{ min-width:0; flex:1 1 140px; }
  .board-analyst-filter{ flex:1 1 160px; min-width:0; }
  .board-summary{ flex-wrap:wrap; }
  .view{ padding:14px 12px 32px; overflow-x:hidden; }
  .field-row{ flex-direction:column; gap:13px; }
  .modal{ max-width:calc(100vw - 24px); max-height:88vh; overflow-y:auto; overflow-x:hidden; padding:18px 16px 18px; }
  .overlay{ padding:4vh 8px; }
  .notif-panel{ width:min(320px, calc(100vw - 24px)); right:-6px; }
  .row-actions{ gap:8px; flex-wrap:wrap; }
  .btn-sm{ padding:7px 11px; }
  .list-col{ width:230px; flex:0 0 230px; }
  .list-add-col{ width:180px; flex:0 0 180px; }
  /* No mobile, o grid do calendário ocupa 100% da largura - sem scroll horizontal */
  .cal-tg-inner{ min-width:100%; }
  .cal-tg-outer{ overflow-x:hidden; }
  .cal-tg-event.allday{ padding:3px 5px; line-height:1.2; }
  .cal-tg-event.allday .t{ white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
  .balance-box{ flex-wrap:wrap; }
  .compare-grid{ grid-template-columns:1fr; }
  .field input, .field select, .field textarea,
  .login-card .field input,
  .board-analyst-filter, #cal-analyst-filter, #cal-category-filter,
  .client-picker-input, #search-input, #client-search-input{ font-size:16px !important; }

  /* ===== AGENDAMENTOS NO CARD (MOBILE) — empilha em vez de espremer lado a lado ===== */
  .sched-row{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
    padding:12px;
  }
  .sched-main{
    width:100%;
    min-width:0;
  }
  .sched-time{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    line-height:1.5;
  }
  .sched-sub{
    overflow-wrap:anywhere;
    word-break:break-word;
  }
  .sched-row .row-actions{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:2px;
    padding-top:10px;
    border-top:1px dashed var(--border);
  }
  .sched-row .row-actions .btn{
    flex:1 1 auto;
    justify-content:center;
    min-width:0;
  }
}
@media screen and (max-width:480px){
  .list-col{ width:78vw; flex:0 0 78vw; }
  .list-add-col{ width:60vw; flex:0 0 60vw; }
  table{ font-size:12.5px; }
  th, td{ padding:8px 9px; }
  .cal-toolbar > select, .cal-toolbar > .board-analyst-filter{ flex:1 1 100%; }
  .cal-toolbar > .btn{ flex:1 1 auto; justify-content:center; }
}
@media print{
  #app{ display:none !important; }
  body *{ visibility:hidden; }
  #print-root, #print-root *{ visibility:visible; }
  #print-root{ position:absolute; left:0; top:0; width:100%; padding:24px; color:#000; }
  #print-root table{ width:100%; border-collapse:collapse; }
  #print-root td{ padding:8px 10px; border-bottom:1px solid #ddd; }
  .no-print{ display:none !important; }
  .overlay{ position:static !important; inset:auto !important; overflow:visible !important; background:none !important; padding:0 !important; display:block !important; height:auto !important; }
  .modal{ position:static !important; max-height:none !important; overflow:visible !important; box-shadow:none !important; }
}

:root{
  --bg:#F4F7F9; --bg-soft:#EAF1F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --border:#DCE5EB; --ink:#17324D; --ink-soft:#627486; --ink-faint:#8A9AAA;
  --brand:#0B5C8E; --brand-dark:#073F63; --brand-soft:#E5F1F8;
  --gold:#F0A72F; --gold-soft:#FFF1D8; --danger:#C94B42; --danger-soft:#FCE7E5;
  --ok:#169B67; --ok-soft:#E2F5ED;
  --radius-s:7px; --radius-m:12px; --radius-l:18px;
  --shadow-1:0 2px 8px rgba(23,50,77,.06),0 1px 2px rgba(23,50,77,.04);
  --shadow-2:0 18px 50px rgba(23,50,77,.18);
}
html,body{background:var(--bg);}
body{font-size:14px;color:var(--ink);}
.shell{background:var(--bg);}
.sidebar{ width:258px;flex:0 0 258px;background:#fff;color:var(--ink);border-right:1px solid var(--border);padding:20px 14px 14px;gap:20px;box-shadow:4px 0 18px rgba(23,50,77,.035); }
.brand{padding:4px 9px 17px;gap:11px;border-bottom:1px solid var(--border);}
.brand-mark{ width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#1684BD);color:#fff;font-size:13px;box-shadow:0 5px 14px rgba(11,92,142,.22);letter-spacing:-.5px; }
.brand-name{font-size:18px;color:var(--brand-dark);letter-spacing:-.3px;}
.brand-name::after{content:' • REALTEC';font-size:9px;letter-spacing:1.1px;color:var(--ok);font-weight:800;display:block;margin-top:-2px;}
.side-label{color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:4px 10px 6px;}
.side-item{color:#506579;border-radius:9px;padding:10px 10px;font-weight:600;transition:.16s ease;}
.side-item:hover{background:#F0F6FA;color:var(--brand);}
.side-item.active{background:var(--brand-soft);color:var(--brand);box-shadow:inset 3px 0 0 var(--brand);}
.side-dot{width:8px;height:8px;box-shadow:none;}
.side-badge{background:var(--gold);color:#fff;min-width:22px;text-align:center;padding:2px 7px;}
.side-add{border:1px dashed #B9CAD5;color:var(--brand);background:#F8FBFD;padding:8px 10px;}
.side-foot{color:#8A9AAA;border-top:1px solid var(--border);padding:12px 9px 2px;}
.main{min-width:0;background:var(--bg);}
.topbar{ min-height:72px;padding:14px 28px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(23,50,77,.035);position:relative;z-index:40; }
.topbar-title h2{font-size:20px;color:var(--brand-dark);letter-spacing:-.35px;}
.search-box{background:#F5F8FA;border-color:#DDE7ED;border-radius:10px;min-width:260px;padding:8px 12px;}
.icon-btn{background:#F7FAFC;border-color:#DCE5EB;border-radius:10px;}
.view{padding:26px 28px 46px;}
.btn{border-radius:9px;padding:9px 15px;border-color:#D6E1E8;}
.btn-primary{background:var(--brand);border-color:var(--brand);}
.board-lists{gap:18px;align-items:stretch;min-height:calc(100vh - 170px);}
.list-col{background:#EAF0F4;border:1px solid #DCE5EB;border-radius:14px;width:285px;flex:0 0 285px;max-height:calc(100vh - 160px);}
.list-head{padding:13px 13px 9px;}
.card-mini{border:1px solid #E3EAEF;border-radius:11px;padding:12px;box-shadow:var(--shadow-1);gap:8px;}
.empty-state{background:#fff;border:1px solid var(--border);border-radius:18px;padding:58px 28px;box-shadow:var(--shadow-1);margin-top:30px;}
.section-card{border-color:var(--border);border-radius:14px;box-shadow:var(--shadow-1);}
table{box-shadow:var(--shadow-1);}
th{background:#F1F6F9;color:#607587;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=email],.field input[type=tel],.field input[type=password],.field select,.field textarea{background:#F7F9FB;border-color:#DCE5EB;border-radius:9px;}

.board-analyst-filter{ min-width:190px;border:1px solid #D6E1E8;border-radius:9px;padding:9px 34px 9px 11px;background:#F7F9FB;color:var(--ink);font-weight:600;outline:none; }
.board-summary{ display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;padding:11px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1); }
.board-summary-main{display:flex;align-items:center;gap:8px;min-width:0;}
.board-summary-main strong{color:var(--brand-dark);}
.board-summary-main span{color:var(--ink-soft);font-size:12.5px;}
.board-summary-filter{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:5px 9px;border-radius:20px;white-space:nowrap;}
.analyst-meta{font-size:11px;font-weight:600;}
.analyst-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}

#app.rt-live-update{animation:rtLiveUpdate .42s ease-out;}
@keyframes rtLiveUpdate{ 0%{opacity:.88;} 100%{opacity:1;} }
.live-sync-indicator{ position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink-soft);font:500 11px/1.1 var(--font-body);box-shadow:var(--shadow-1);opacity:0;pointer-events:none;transform:translateY(5px);transition:opacity .22s ease,transform .22s ease; }
.live-sync-indicator.show{opacity:.92;transform:translateY(0);}
.live-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}

#login-screen{ position:fixed; inset:0; z-index:10000;display:flex; align-items:center; justify-content:center;background:linear-gradient(135deg,#073F63 0%,#0B5C8E 50%,#1684BD 100%);padding:20px; }
.login-card{ background:#fff; border-radius:20px; box-shadow:0 24px 64px rgba(7,63,99,.35);width:100%; max-width:400px; padding:36px 32px 32px; text-align:center; }
.login-brand{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:6px; }
.login-logo{ max-width:220px; width:100%; height:auto; }
.brand-mark.brand-mark-img{ width:auto; height:38px; max-width:64px; background:none; box-shadow:none; border-radius:0; }
.brand-mark-img img{ height:100%; width:auto; max-width:100%; object-fit:contain; display:block; }
.login-brand-mark{ width:48px; height:48px; border-radius:14px;background:linear-gradient(135deg,var(--brand),#1684BD);display:flex; align-items:center; justify-content:center;font-family:var(--font-head); font-weight:800; color:#fff; font-size:18px;box-shadow:0 8px 20px rgba(11,92,142,.25); }
.login-brand h1{ font-size:26px; color:var(--brand-dark); letter-spacing:-.5px; }
.login-brand p{ font-size:11px; color:var(--ok); font-weight:800; letter-spacing:1.2px; margin:0; }
.login-subtitle{ font-size:13px; color:var(--ink-soft); margin:8px 0 24px; }
.login-card .field{ text-align:left; }
.login-card .field input{ border:1px solid var(--border); border-radius:10px; padding:11px 12px;background:#F7F9FB; color:var(--ink); outline:none; width:100%;font-size:14.5px; transition:.18s ease; }
.login-card .field input:focus{ border-color:#79AFCB; box-shadow:0 0 0 3px rgba(11,92,142,.07); background:#fff; }
.login-card .btn{ width:100%; justify-content:center; padding:12px; font-size:15px; margin-top:6px; }
.login-error{ background:var(--danger-soft); color:var(--danger); border-radius:10px;padding:10px 12px; font-size:12.5px; font-weight:600; margin-bottom:14px; text-align:left; }
.login-footer{ margin-top:22px; font-size:11px; color:var(--ink-faint); }

.report-header{
  display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
  padding:22px 26px; margin-bottom:22px; border-radius:14px;
  background:linear-gradient(120deg, var(--brand-dark) 0%, var(--brand) 100%);
  color:#fff; box-shadow:0 8px 24px rgba(11,92,142,.18);
}
.report-header-left{ min-width:0; }
.report-eyebrow{
  font-size:11px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase;
  color:rgba(255,255,255,.75); margin-bottom:6px;
}
.report-title{
  color:#fff; font-size:26px; letter-spacing:-.6px; margin:0 0 6px;
}
.report-subtitle{
  margin:0; color:rgba(255,255,255,.82); font-size:13px; max-width:640px;
}
.report-header-badge{
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25);
  padding:9px 14px; border-radius:10px; font-size:12.5px; font-weight:700; white-space:nowrap;
}

.kpi-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px;
  margin-bottom:22px;
}
.kpi-card{
  background:#fff; border:1px solid var(--border); border-radius:14px;
  padding:16px 18px; display:flex; gap:14px; align-items:flex-start;
  box-shadow:0 2px 8px rgba(23,50,77,.05); position:relative; overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease;
}
.kpi-card::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--kpi-accent, var(--brand));
}
.kpi-card:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(23,50,77,.10); }
.kpi-icon{
  width:42px; height:42px; border-radius:11px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  background:var(--brand-soft); color:var(--kpi-accent, var(--brand));
}
.kpi-body{ min-width:0; flex:1; }
.kpi-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; }
.kpi-value{ font-family:var(--font-head); font-weight:800; font-size:23px; color:var(--ink); line-height:1.15; margin:3px 0 2px; letter-spacing:-.4px; }
.kpi-sub{ font-size:11.5px; color:var(--ink-faint); }

.report-section{
  background:#fff; border:1px solid var(--border); border-radius:14px;
  padding:20px 22px; margin-bottom:20px; box-shadow:0 2px 8px rgba(23,50,77,.05);
}
.report-section-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:16px; }
.report-section-icon{
  width:42px; height:42px; border-radius:11px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:20px;
}

<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#5A635D;font-family:'Inter',sans-serif;">Carregando...</div>
</div>
<div id="print-root"></div>

<script>

/* ============================= LOGIN ============================= */
const LOGIN_KEY = 'implanta_logged_user_v1';
const MASTER_USER = 'administrador';
const MASTER_PASS = '71209403';

var currentUser = null;

function getStoredUser(){ try{ return JSON.parse(localStorage.getItem(LOGIN_KEY)); }catch(e){ return null; } }
function setStoredUser(u){ currentUser = u; if(u) localStorage.setItem(LOGIN_KEY, JSON.stringify(u)); else localStorage.removeItem(LOGIN_KEY); }

function renderLoginScreen(errorMsg){
  return '<div id="login-screen">'
    + '<div class="login-card">'
      + '<div class="login-brand"><img src="https://realtec.com.br/wp-content/uploads/2018/03/logorealtec.png" alt="Realtec" class="login-logo"></div>'
      + '<p class="login-subtitle">Entre com seu usuário para acessar o sistema</p>'
      + (errorMsg ? '<div class="login-error">'+esc(errorMsg)+'</div>' : '')
      + '<form id="login-form" onsubmit="event.preventDefault();doLogin();">'
        + '<div class="field"><label>Usuário</label><input type="text" id="login-user" placeholder="Digite seu usuário" autocomplete="username" autofocus></div>'
        + '<div class="field"><label>Senha</label><input type="password" id="login-pass" placeholder="Digite sua senha" autocomplete="current-password"></div>'
        + '<button type="submit" class="btn btn-primary">Entrar</button>'
      + '</form>'
      + '<div class="login-footer">Acesso restrito — fale com o administrador se não tiver acesso.</div>'
    + '</div>'
  + '</div>';
}

function doLogin(){
  const userEl = document.getElementById('login-user');
  const passEl = document.getElementById('login-pass');
  const u = (userEl.value||'').trim().toLowerCase();
  const p = passEl.value||'';

  if(!u || !p){ document.getElementById('app').innerHTML = renderLoginScreen('Preencha usuário e senha.'); return; }
  if(u === MASTER_USER && p === MASTER_PASS){
    setStoredUser({username:MASTER_USER, displayName:'Administrador', role:'admin', isMaster:true});
    document.getElementById('app').innerHTML = '';
    boot();
    return;
  }
  const analyst = state.analysts.find(a=> a.username && a.username.toLowerCase() === u);
  if(analyst){
    if(analyst.inactive){ document.getElementById('app').innerHTML = renderLoginScreen('Este usuário está inativo. Fale com o administrador.'); return; }
    if(!analyst.password || analyst.password !== p){ document.getElementById('app').innerHTML = renderLoginScreen('Usuário ou senha inválidos. Tente novamente.'); return; }
    setStoredUser({ username: analyst.username, displayName: analyst.name, role: analyst.isAdmin ? 'admin' : 'analyst', analystId: analyst.id, isAdmin: !!analyst.isAdmin });
    document.getElementById('app').innerHTML = '';
    boot();
    return;
  }
  document.getElementById('app').innerHTML = renderLoginScreen('Usuário ou senha inválidos. Tente novamente.');
}

function logout(){ setStoredUser(null); document.getElementById('app').innerHTML = renderLoginScreen(); }

/* ============================= STATE ============================= */
const STORAGE_KEY = 'implanta_v1';
const PALETTE = [
  '#0B5C8E','#C0392B','#1E8449','#8E44AD','#E67E22','#16A085','#C2185B','#2980B9',
  '#7B3F00','#5D6D7E','#D35400','#27AE60','#884EA0','#B7950B','#138D75'

function normalizeState(raw){
  let s = raw;
  if(!s || typeof s!=='object') s = defaultState();
  ['analysts','boards','clients','cards','schedules','productTags','modules','screens','agendaTypes'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=defaultState()[k]; });
  s.modules = s.modules.map(m=> (typeof m==='string') ? {id:uid('md'), name:m, inactive:false} : Object.assign({inactive:false}, m));
  s.screens = s.screens.map(scr=> Object.assign({inactive:false}, scr));
  s.productTags = s.productTags.map(t=> Object.assign({inactive:false}, t));
  s.agendaTypes = s.agendaTypes.map(t=> {
    if(typeof t==='string') return {id:uid('at'), name:t, isInternal: t==='Interna', isServico: t==='Serviço', inactive:false};
    const copy = Object.assign({inactive:false, isServico:false}, t);
    if(copy.isInternal===undefined) copy.isInternal = copy.name==='Interna';
    if(copy.isServico===undefined) copy.isServico = false;
    return copy;
  });
  if(!s.agendaTypes.some(t=> t.isServico)) s.agendaTypes.push({id:uid('at'), name:'Serviço', isInternal:false, isServico:true, inactive:false});
  if(!s.agendaTypes.some(t=> t.name && t.name.toLowerCase()===FERIAS_TYPE_NAME.toLowerCase())) s.agendaTypes.push({id:uid('at'), name:FERIAS_TYPE_NAME, isInternal:true, isServico:false, inactive:false});
  s.analysts = s.analysts.map(a=>{
    const copy = Object.assign({}, a);
    if(!copy.username) copy.username = '';
    if(!copy.password) copy.password = '';
    if(copy.isAdmin===undefined) copy.isAdmin = false;
    if(copy.inactive===undefined) copy.inactive = false;
    return copy;
  });
  /* Garante que todo cliente tenha os campos accountantId, crc, ownerCpf, uf e cep definidos. */
  s.clients = s.clients.map(c=>{
    const copy = Object.assign({}, c);
    if(copy.accountantId===undefined) copy.accountantId = '';
    if(copy.crc===undefined) copy.crc = '';
    if(copy.ownerCpf===undefined) copy.ownerCpf = '';
    if(copy.uf===undefined) copy.uf = '';
    if(copy.cep===undefined) copy.cep = '';
    return copy;
  });
  s.schedules = s.schedules.map(sc=>{
    const copy = Object.assign({}, sc);
    if(copy.allDay===undefined) copy.allDay = false;
    if(copy.title===undefined) copy.title = '';
    if(copy.category===undefined) copy.category = 'implantacao';
    if(!Array.isArray(copy.analystIds)){ copy.analystIds = copy.analystId ? [copy.analystId] : []; }
    if(copy.analystId===undefined && copy.analystIds.length) copy.analystId = copy.analystIds[0];
    if(copy.allDay){ if(!copy.endDate) copy.endDate = copy.date; if(copy.endDate < copy.date) copy.endDate = copy.date; }
    else { copy.endDate = copy.date; }
    return copy;
  });
  s.cards = s.cards.map(c=>{
    const copy = Object.assign({}, c);
    if(!Array.isArray(copy.expectedModules)) copy.expectedModules = [];
    if(!Array.isArray(copy.expectedScreens)) copy.expectedScreens = [];
    if(copy.conclusionDate===undefined) copy.conclusionDate = null;
    if(copy.commercialDate===undefined) copy.commercialDate = '';
    if(copy.isConcluded===undefined) copy.isConcluded = false;
    if(!Array.isArray(copy.attachments)) copy.attachments = [];
    return copy;
  });
  s = dedupeRegistries(s);
  s = ensureAdminAnalyst(s);
  return s;
}

async function refreshFromCloudIfChanged(source){
  if(!sbClient || cloudStatus!=='connected') return false;
  if(realtimeRefreshInFlight){ realtimeRefreshQueued = true; return false; }
  const now = Date.now();
  if(now - realtimeLastRefreshAt < REALTIME_MIN_REFRESH_GAP_MS) return false;
  realtimeRefreshInFlight = true;
  realtimeLastRefreshAt = now;
  let changed = false;
  try{
    const {data, error} = await sbClient.from('app_state').select('data, updated_at').eq('id', 1).maybeSingle();
    if(error) throw error;
    if(!data || !data.data || !data.updated_at) return false;
    if(sameInstant(data.updated_at, lastKnownUpdatedAt)) return false;
    const remote = normalizeState(data.data);
    if(saveStatus==='pending' || saveStatus==='saving') state = mergeStates(remote, state);
    else state = remote;
    lastKnownUpdatedAt = data.updated_at;
    saveStatus = 'saved';
    changed = true;
    renderWithoutPersist();
    flashLiveUpdate();
    showLiveSyncIndicator();
    updateSaveStatusLine();
  }catch(e){ console.warn('Falha na atualização em tempo real', source || 'refresh', e); }
  finally{
    realtimeRefreshInFlight = false;
    if(realtimeRefreshQueued){ realtimeRefreshQueued = false; setTimeout(()=>refreshFromCloudIfChanged('queued'), 0); }
  }
  return changed;
}
function stopRealtimeSync(){
  if(realtimeChannel && sbClient){ try{ sbClient.removeChannel(realtimeChannel); }catch(e){} }

}

  }catch(e){ console.warn('Não foi possível iniciar a sincronização em tempo real', e); }

function sameInstant(a, b){
  if(!a || !b) return false;
  const ta = new Date(a).getTime(), tb = new Date(b).getTime();
  if(isNaN(ta) || isNaN(tb)) return false;
  return Math.abs(ta - tb) < 1000;
}
async function cloudSave(){
  if(!sbClient) return;
  saveStatus = 'saving';
  updateSaveStatusLine();
  try{
    const { data: fresh, error: fetchErr } = await sbClient.from('app_state').select('data, updated_at').eq('id', 1).maybeSingle();
    if(fetchErr) throw fetchErr;
    if(fresh && fresh.updated_at && !sameInstant(fresh.updated_at, lastKnownUpdatedAt) && fresh.data){
      state = mergeStates(normalizeState(fresh.data), state);
    }
    const nowIso = new Date().toISOString();
    const { error } = await sbClient.from('app_state').update({data: state, updated_at: nowIso}).eq('id', 1);
    if(error) throw error;
    lastKnownUpdatedAt = nowIso;
    saveStatus = 'saved';
  }catch(e){ console.warn('Falha ao salvar na nuvem', e); saveStatus = 'error'; }
  updateSaveStatusLine();
}
function mergeStates(remote, local){
  const merged = Object.assign({}, local);
  ['analysts','boards','clients','cards','schedules','productTags','modules','agendaTypes','screens'].forEach(key=>{
    const byId = new Map();
    (remote[key]||[]).forEach(item=> byId.set(item.id, item));
    (local[key]||[]).forEach(item=> byId.set(item.id, item));
    merged[key] = [...byId.values()];
  });
  return dedupeRegistries(merged);
}
function dedupeRegistries(s){
  function dedupeWithRemap(arr){
    const survivorByName = new Map();
    const remap = new Map();
    (arr||[]).forEach(item=>{
      if(survivorByName.has(item.name)){ remap.set(item.id, survivorByName.get(item.name).id); }
      else { survivorByName.set(item.name, item); }
    });
    return { deduped:[...survivorByName.values()], remap };
  }
  const modResult = dedupeWithRemap(s.modules);
  s.modules = modResult.deduped;
  (s.screens||[]).forEach(scr=>{ if(modResult.remap.has(scr.moduleId)) scr.moduleId = modResult.remap.get(scr.moduleId); });
  s.agendaTypes = dedupeWithRemap(s.agendaTypes).deduped;
  const seenScreens = new Map();
  (s.screens||[]).forEach(scr=>{ const key = scr.name+'::'+scr.moduleId; if(!seenScreens.has(key)) seenScreens.set(key, scr); });
  s.screens = [...seenScreens.values()];
  return s;
}

async function boot(){
  if(!currentUser){ document.getElementById('app').innerHTML = renderLoginScreen(); return; }
  let needsImmediateResave = false;
  if(cloudConfig && window.supabase){
    try{
      sbClient = window.supabase.createClient(cloudConfig.url, cloudConfig.anonKey);
      const { data, error } = await sbClient.from('app_state').select('data, updated_at').eq('id', 1).maybeSingle();
      if(error) throw error;
      if(data && data.data){
        const before = data.data;
        const beforeCounts = {
          modules: Array.isArray(before.modules) ? before.modules.length : 0,
          agendaTypes: Array.isArray(before.agendaTypes) ? before.agendaTypes.length : 0,
          screens: Array.isArray(before.screens) ? before.screens.length : 0,
          analysts: Array.isArray(before.analysts) ? before.analysts.length : 0
        };
        state = normalizeState(before);
        lastKnownUpdatedAt = data.updated_at || null;
        if(state.modules.length < beforeCounts.modules || state.agendaTypes.length < beforeCounts.agendaTypes || state.screens.length < beforeCounts.screens || state.analysts.length > beforeCounts.analysts){
          needsImmediateResave = true;
        }
      } else {
        state = loadLocalState();
        const nowIso = new Date().toISOString();
        const ins = await sbClient.from('app_state').insert({id:1, data: state, updated_at: nowIso});
        if(ins.error) throw ins.error;
        lastKnownUpdatedAt = nowIso;
      }
      cloudStatus = 'connected';
      startRealtimeSync();
    }catch(e){
      console.warn('Falha ao conectar à nuvem', e);
      cloudStatus = 'error';
      const detail = (e && (e.message || e.error_description || e.hint || e.details)) || 'erro desconhecido';
      cloudErrorMsg = 'Não foi possível conectar ao banco na nuvem. Usando os dados salvos neste navegador por enquanto.\nDetalhe técnico: '+detail;
      sbClient = null;
      state = loadLocalState();
    }
  } else { state = loadLocalState(); }
  render();
  if(needsImmediateResave && sbClient){ await cloudSave(); }
}

/* ============================= HELPERS ============================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDaysISO(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function startOfWeekISO(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); const wd=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-wd); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function fmtDateBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
const WD_NAMES = ['seg','ter','qua','qui','sex','sáb','dom'];
function weekdayShort(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return WD_NAMES[(dt.getDay()+6)%7]; }
function fmtDT(ts){ const d=new Date(ts); return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function timeToMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function minToHM(min){ const sign = min<0?'-':''; min=Math.abs(Math.round(min)); const h=Math.floor(min/60), m=min%60; return sign + h + 'h' + (m>0? String(m).padStart(2,'0')+'m':''); }
function getTableSort(tableKey, defaultKey, defaultDir){
  if(!ui.tableSort[tableKey]) ui.tableSort[tableKey] = {key:defaultKey, dir:defaultDir||'asc'};
  return ui.tableSort[tableKey];
}
function sortRowsBy(rows, sortState, accessor){
  if(!sortState || !sortState.key) return rows;
  const dirMul = sortState.dir==='desc' ? -1 : 1;
  return [...rows].sort((a,b)=>{
    let va = accessor(a, sortState.key), vb = accessor(b, sortState.key);
    if(typeof va==='string') va = va.toLowerCase();
    if(typeof vb==='string') vb = vb.toLowerCase();
    if(va==null) va = '';
    if(vb==null) vb = '';
    if(va<vb) return -1*dirMul;
    if(va>vb) return 1*dirMul;
    return 0;
  });
}
function sortableTh(tableKey, fieldKey, label, sortState, extraAttrs){
  const active = sortState && sortState.key===fieldKey;
  const arrow = active ? (sortState.dir==='asc' ? ' ▲' : ' ▼') : '';
  return '<th data-action="sort-table" data-table="'+tableKey+'" data-key="'+fieldKey+'" style="cursor:pointer;user-select:none;white-space:nowrap;" title="Ordenar por '+esc(label)+'"'+(extraAttrs||'')+'>'+esc(label)+arrow+'</th>';
}
function daysBetweenISO(a,b){
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);

      + '<td>'+fmtDateBR(r.c.commercialDate)+'</td><td>'+fmtDateBR(r.c.startDate)+'</td>'

function bytesToHuman(b){
  if(b == null) return '—';
  if(b < 1024) return b+' B';
  if(b < 1024*1024) return (b/1024).toFixed(1)+' KB';
  return (b/(1024*1024)).toFixed(2)+' MB';
}

function captureFormValues(form){
  const fd = new FormData(form);
  const multiNames = new Set();
  form.querySelectorAll('input[type=checkbox]').forEach(cb=> multiNames.add(cb.name));
  const values = {};

function isWeekdayISO(iso){
  if(!iso) return false;
  const [y,m,d]=iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dow = dt.getDay();
  return dow !== 0 && dow !== 6;
}
function countWeekdaysBetweenISO(startIso, endIso){
  if(!startIso) return 0;
  if(!endIso) endIso = startIso;
  if(endIso < startIso) return 0;
  let count = 0;
  let cur = startIso;
  while(cur <= endIso){
    if(isWeekdayISO(cur)) count++;
    cur = addDaysISO(cur, 1);
  }
  return count;
}

function scheduleDayCount(s){
  if(!s.allDay) return 1;
  const endD = s.endDate || s.date;
  const start = new Date(s.date+'T00:00:00');
  const end = new Date(endD+'T00:00:00');
  const diff = Math.round((end-start)/86400000)+1;

function analystMinutesOnDay(day, analystId, inCategoryFn){
  let total = 0;
  state.schedules.forEach(s=>{
    if(s.status==='nao_realizada') return;
    if(!scheduleSpansDate(s, day)) return;
    if(inCategoryFn && !inCategoryFn(s)) return;
    if(!scheduleAnalystIds(s).includes(analystId)) return;
    total += scheduleMinutesOnSpecificDay(s, day);
  });
  return total;
}
function scheduleMinutesOnSpecificDay(s, day){
  if(!s.allDay) return scheduleMinutesPerAnalyst(s);
  if(isFeriasType(s.type)) return isWeekdayISO(day) ? FERIAS_MIN_PER_WEEKDAY : 0;
  return 8*60;
}
function workloadStatusColor(minutes){

function scheduleMinutesPerAnalyst(s){
  if(s.allDay){
    if(isFeriasType(s.type)){
      const weekdays = countWeekdaysBetweenISO(s.date, s.endDate || s.date);
      return weekdays * FERIAS_MIN_PER_WEEKDAY;
    }
    return 8*60*scheduleDayCount(s);
  }
  return timeToMin(s.endTime)-timeToMin(s.startTime);
}
function scheduleMinutes(s){
  if(s.deductMinutes!=null) return s.deductMinutes;
  const perAnalyst = scheduleMinutesPerAnalyst(s);
  const n = Math.max(1, scheduleAnalystIds(s).length);

}

function scheduleSpansDate(s, dateISO){
  if(!s.allDay) return s.date===dateISO;

/* Duração real de uma agenda, sempre - independente de quantos minutos foram configurados para
   abater do card (deductMinutes). Usada em tudo que precisa refletir o tempo de fato trabalhado
   (horas do analista, horas por tipo, etc.), nunca no saldo do card em si. */
function scheduleActualMinutes(s){
  const perAnalyst = scheduleMinutesPerAnalyst(s);

function scheduleConflict(analystIds, date, start, end, excludeId, allDay){
  if(allDay) return false;
  if(!Array.isArray(analystIds)) analystIds = analystIds ? [analystIds] : [];
  const s0=timeToMin(start), e0=timeToMin(end);
  return state.schedules.some(s=>{
    if(s.id===excludeId) return false;
    if(s.status==='nao_realizada') return false;
    if(s.allDay) return false;
    if(s.date!==date) return false;
    const overlap = !(e0<=timeToMin(s.startTime) || s0>=timeToMin(s.endTime));
    if(!overlap) return false;
    const sIds = scheduleAnalystIds(s);
    return sIds.some(id=> analystIds.includes(id));
  });
}
function hasAllDayBlocking(analystIds, dateISO, excludeId){
  if(!Array.isArray(analystIds)) analystIds = analystIds ? [analystIds] : [];
  return state.schedules.some(s=>{
    if(s.id===excludeId) return false;
    if(s.status==='nao_realizada') return false;
    if(!s.allDay) return false;
    if(!scheduleSpansDate(s, dateISO)) return false;
    const sIds = scheduleAnalystIds(s);
    return sIds.some(id=> analystIds.includes(id));
  });
}
function scheduleIsDue(s){ if(s.status!=='pendente') return false; const dueDate = s.allDay ? (s.endDate||s.date) : s.date; const end=new Date(dueDate+'T'+(s.allDay ? '23:59' : (s.endTime||'00:00'))+':00'); return end.getTime() < Date.now(); }
function pendingConfirmations(analystId){ return state.schedules.filter(s=> scheduleIsDue(s) && (!analystId || scheduleAnalystIds(s).includes(analystId))); }

function nextUpcomingSchedule(analystId){
  if(!analystId) return null;
  const now = new Date();
  const candidates = state.schedules
    .filter(s=>{
      if(s.status!=='pendente' || !scheduleAnalystIds(s).includes(analystId)) return false;
      if(s.allDay) return false;
      const start = new Date(s.date+'T'+(s.startTime||'00:00')+':00');
      return start.getTime() > now.getTime();
    })
    .sort((a,b)=>{
      const da = new Date(a.date+'T'+(a.startTime||'00:00')+':00').getTime();
      const db = new Date(b.date+'T'+(b.startTime||'00:00')+':00').getTime();
      return da-db;
    });
  return candidates[0] || null;
}

function upcomingScheduleNotification(analystId){
  const s = nextUpcomingSchedule(analystId);
  if(!s) return null;
  const start = new Date(s.date+'T'+(s.startTime||'00:00')+':00');
  const diffMin = Math.floor((start.getTime()-Date.now())/60000);
  return (diffMin >= 0 && diffMin <= 30) ? s : null;
}

function notificationItemsForAnalyst(analystId){
  if(!analystId) return [];
  const due = pendingConfirmations(analystId).map(s=>Object.assign({},s,{_notifKind:'due'}));
  const upcoming = upcomingScheduleNotification(analystId);
  if(upcoming && !due.some(s=>s.id===upcoming.id)){
    due.push(Object.assign({},upcoming,{_notifKind:'upcoming'}));
  }
  return due;
}

function resizeImageToDataURL(file, max){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const side = Math.min(img.width, img.height);
      const sx = (img.width-side)/2, sy = (img.height-side)/2;
      const c = document.createElement('canvas'); c.width = max; c.height = max;
      c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, max, max);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Imagem inválida')); };
    img.src = url;
  });
}

function darkenColor(hex, amount){
  if(!hex) return '#0B5C8E';
  const h = hex.replace('#','');
  let r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  r = Math.max(0, Math.round(r*(1-amount)));
  g = Math.max(0, Math.round(g*(1-amount)));
  b = Math.max(0, Math.round(b*(1-amount)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function readableTextColor(hex){
  if(!hex) return '#fff';
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const yiq = ((r*299)+(g*587)+(b*114))/1000;
  return yiq >= 150 ? '#111' : '#fff';
}

function readFileAsDataURL(file){

    const reader = new FileReader();

async function handleCardAttachmentUpload(cardId, inputEl, form){
  const card = getCard(cardId);
  if(!card) return;
  const files = Array.from(inputEl.files || []);
  if(!files.length) return;
  let rejected = [];
  for(const f of files){
    if(f.size > ATTACH_MAX_BYTES){
      rejected.push(f.name+' ('+bytesToHuman(f.size)+' excede '+bytesToHuman(ATTACH_MAX_BYTES)+')');
      continue;
    }
    try{
      const dataUrl = await readFileAsDataURL(f);
      card.attachments = card.attachments || [];
      card.attachments.push({
        id: uid('at'),
        name: f.name,
        type: f.type || '',
        size: f.size,
        data: dataUrl,
        uploadedAt: Date.now()
      });
      addHistory(card, 'Anexo adicionado: '+f.name+' ('+bytesToHuman(f.size)+')');
    }catch(err){
      rejected.push(f.name+' (falha ao ler)');
    }
  }
  inputEl.value = '';
  if(rejected.length){
    showAlert('Alguns arquivos não foram anexados:\n\n'+rejected.join('\n'));
  }
  if(ui.cardDraft && ui.cardDraft.cardId===cardId){
    const values = captureFormValues(form);
    ui.cardDraft = {cardId, values};
  }
  render();
}

const CLIENT_IMPORT_HEADER_MAP = {
  'codigo':'code', 'cod':'code', 'nome fantasia':'name', 'nome':'name', 'razao social':'companyName',
  'cnpj':'cnpj', 'ie':'ie', 'inscricao estadual':'ie', 'segmento':'segment', 'cidade':'city',
  'uf':'uf', 'estado':'uf', 'cep':'cep',
  'telefone':'phone', 'fone':'phone', 'email':'email', 'e-mail':'email', 'contato':'contact',
  'tipo de cliente':'clientType', 'tipo':'clientType'
};
function parseImportRow(row){
  const out = {};
  Object.keys(row).forEach(h=>{
    const field = CLIENT_IMPORT_HEADER_MAP[normalizeHeader(h)];
    if(field && out[field]===undefined) out[field] = row[h]!=null ? String(row[h]).trim() : '';
  });
  if(out.clientType){
    const normType = normalizeHeader(out.clientType);
    out.clientType = normType.includes('contador') ? 'contador' : (normType.includes('base') ? 'base' : 'novo');
  }
  if(out.uf) out.uf = String(out.uf).toUpperCase().slice(0,2);

}

async function importClientsFromFile(file){
  if(!window.XLSX){ showAlert('Biblioteca de importação não carregada.'); return; }
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = window.XLSX.utils.sheet_to_json(sheet, {defval:''});
  let created=0, updated=0, skipped=0;
  rows.forEach(row=>{
    const parsed = parseImportRow(row);
    if(!parsed.name || (!parsed.code && !parsed.name)){ skipped++; return; }
    const existing = parsed.code ? state.clients.find(c=>c.code && c.code===parsed.code) : null;
    if(existing){ Object.assign(existing, parsed); updated++; }
    else { createClient(parsed); created++; }
  });
  render();
  showAlert('Importação: '+created+' criado(s), '+updated+' atualizado(s)'+(skipped?', '+skipped+' ignorada(s)':'')+'.');
}

function firstLinkedScheduleForCard(cardId){
  return state.schedules
    .filter(s=>s.cardId===cardId && s.date)
    .sort((a,b)=>{
      const ta = new Date(a.date+'T'+(a.allDay ? '00:00' : (a.startTime||'00:00'))+':00').getTime();
      const tb = new Date(b.date+'T'+(b.allDay ? '00:00' : (b.startTime||'00:00'))+':00').getTime();
      return ta-tb;
    })[0] || null;
}
function syncCardStartDateFromSchedules(cardId){
  const card = getCard(cardId);
  if(!card) return;
  const first = firstLinkedScheduleForCard(cardId);
  if(!first) return;
  if(card.startDate !== first.date){
    const oldDate = card.startDate;
    card.startDate = first.date;
    addHistory(card, 'Início da implantação ajustado para a primeira agenda vinculada: '+fmtDateBR(first.date)+(oldDate ? ' (antes '+fmtDateBR(oldDate)+')' : ''));
  }
}

function moveCard(cardId, boardId, listId){
  const c=getCard(cardId); if(!c) return;
  const fromBoard = getBoard(c.boardId), fromList = fromBoard ? byId(fromBoard.lists, c.listId) : null;
  const toBoard = getBoard(boardId), toList = toBoard ? byId(toBoard.lists, listId) : null;
  if(c.boardId===boardId && c.listId===listId) return;
  c.boardId = boardId; c.listId = listId;
  let text = '';
  if(fromBoard && toBoard && fromBoard.id!==toBoard.id){ text = 'Movido de "'+esc(fromBoard.name)+'" para "'+esc(toBoard.name)+'"'; if(toList) text += ' — lista "'+esc(toList.name)+'"'; }
  else if(toList){ text = 'Estágio alterado para "'+esc(toList.name)+'"'; }
  addHistory(c, text);
  return { c, toList, fromList };
}

function concludeCard(cardId, keepBalance){
  const c = getCard(cardId); if(!c) return;

  c.isConcluded = true;
  c.conclusionDate = todayISO();
  addHistory(c, 'Implantação concluída em '+fmtDateBR(c.conclusionDate));
  if(keepBalance===false){
    c.balanceForfeited = true;
    addHistory(c, 'Saldo de horas remanescente zerado — não ficou disponível para o cliente');
  } else {
    c.balanceForfeited = false;
  }
}

      + '<div class="sub">'+(selectedAnalyst

      + '<option value="all"'+(ui.boardAnalystFilter==='all'?' selected':'')+'>Todos os analistas</option>';
    state.analysts.forEach(a=>{
      left += '<option value="'+a.id+'"'+(ui.boardAnalystFilter===a.id?' selected':'')+'>'+esc(a.name)+(a.inactive?' (inativo)':'')+'</option>';
    });
    left += '</select>'
      + '<div class="search-box" style="margin-left:8px;"><span>🔎</span><input id="search-input" placeholder="Buscar cliente..." value="'+esc(ui.search)+'"></div>'
      + (selectedBoard
        ? '<button class="btn btn-primary" data-action="open-modal" data-modal="card-new" data-board="'+selectedBoard.id+'">+ Novo cliente</button>'
        : '');
  } else if(ui.view==='calendar'){
    left = '<div class="topbar-title"><h2>Agenda</h2><div class="sub">Visualize por analista ou em conjunto</div></div>';
  } else if(ui.view==='reports'){
    left = '<div class="topbar-title"><h2>Relatórios</h2><div class="sub">Painel gerencial de implantações</div></div>';
  } else if(ui.view==='clients'){
    left = '<div class="topbar-title"><h2>Clientes</h2><div class="sub">Base de cadastro</div></div>'
      + '<button class="btn btn-primary" data-action="open-modal" data-modal="client-new">+ Novo cliente</button>';
  } else if(ui.view==='settings'){
    left = '<div class="topbar-title"><h2>Configurações</h2></div>';
  }

    right += '<span style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-right:4px;display:inline-flex;align-items:center;gap:7px;">'+(getAnalyst(currentUser.analystId) ? analystAvatar(getAnalyst(currentUser.analystId),26) : '👤')+' '+esc(currentUser.displayName||currentUser.username||'')+(isAdminUser()?' <span class="badge" style="background:var(--gold-soft);color:var(--gold);">ADMIN</span>':'')+'</span>';
  }
  right += '<div class="icon-btn" data-action="toggle-notif" title="Notificações">🔔'+(totalPend? '<span class="notif-dot">'+totalPend+'</span>':'')+'</div>';
  if(ui.showNotif) right += renderNotifPanel();
