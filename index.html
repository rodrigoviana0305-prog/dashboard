    const s = m.payload && m.payload.scheduleId ? byId(state.schedules, m.payload.scheduleId) : null;
    const client = s && s.clientId ? getClient(s.clientId) : null;
    const dur = s ? scheduleMinutes(s) : 0;
    inner = '<div class="modal-header"><h3>Vincular a um quadro?</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<div class="choice-box">'
        + '<div class="choice-title">'+esc(client?client.name:'(cliente)')+' — '+esc(s?s.type:'')+'</div>'
        + '<div class="choice-desc">'+(s?scheduleDateText(s):'')+' · '+(s&&s.allDay?'Dia todo':(s?s.startTime+'–'+s.endTime:''))+' · '+minToHM(dur)+'</div>'
        + '<div class="choice-desc" style="margin-top:8px;">Esta é uma <strong>agenda interna</strong> vinculada a um cliente. Deseja criar um <strong>card/quadro</strong> para abater do saldo?</div>'
      + '</div>'
      + '<div class="choice-actions">'
        + '<button class="btn btn-ghost" data-action="internal-answer-no">Não, apenas registrar</button>'
        + '<button class="btn btn-primary" data-action="internal-answer-yes">Sim, criar quadro</button>'
      + '</div>';
  } else if(m.type==='after-complete-print'){
    const s = m.payload && m.payload.scheduleId ? byId(state.schedules, m.payload.scheduleId) : null;
    if(!s) return '<div class="overlay"><div class="modal"><p>Agendamento não encontrado.</p></div></div>';
    const dur = scheduleMinutes(s);
    inner = '<div class="modal-header"><h3>✓ Agenda concluída</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<div class="choice-box"><div class="choice-title">'+esc(scheduleDisplayTitle(s))+'</div>'
        + '<div class="choice-desc">'+scheduleDateText(s)+' · '+(s.allDay?'Dia todo':s.startTime+'–'+s.endTime)+' · '+minToHM(dur)+' abatido(s)</div>'
        + '<div class="choice-desc" style="margin-top:8px;">Deseja imprimir o relatório do atendimento?</div></div>'
      + '<div class="choice-actions"><button class="btn btn-ghost" data-action="after-complete-no-print">Não</button>'
        + '<button class="btn btn-primary" data-action="after-complete-print">🖨 Sim</button></div>';
  } else if(m.type==='card-conclude-confirm'){
    const c = m.payload && m.payload.cardId ? getCard(m.payload.cardId) : null;
    if(!c) return '<div class="overlay"><div class="modal"><p>Card não encontrado.</p></div></div>';
    const client = getClient(c.clientId);
    const used = cardUsedMinutes(c);
    const bal = cardBalanceHours(c);
    inner = '<div class="modal-header"><h3>Concluir implantação?</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<div class="choice-box">'
        + '<div class="choice-title">'+esc(client?client.name:'')+'</div>'
        + '<div class="choice-desc">Tempo usado: <strong>'+minToHM(used)+'</strong> de <strong>'+c.contractedHours+'h</strong> contratadas.</div>'
        + '<div class="choice-desc">Saldo atual: <strong style="color:'+(bal<0?'var(--danger)':'var(--ok)')+';">'+minToHM(bal*60)+'</strong>.</div>'
        + '<div class="choice-desc" style="margin-top:10px;font-weight:700;">Deixar esse saldo de horas disponível para o cliente depois da conclusão?</div>'
        + '<div class="choice-desc">Se "Não", o saldo remanescente será zerado e não poderá mais ser usado por este cliente.</div>'
        + '<div class="choice-desc" style="margin-top:8px;">Ao confirmar, geraremos o <strong>relatório de fechamento</strong> com dados do cliente, produtos, módulos/telas e tempo gasto.</div>'
      + '</div>'
      + '<div class="choice-actions"><button class="btn btn-ghost" data-action="close-modal">Cancelar</button>'
        + '<button class="btn btn-danger" data-action="card-conclude-confirm" data-id="'+c.id+'" data-keep-balance="0">Não, zerar saldo</button>'
        + '<button class="btn btn-primary" data-action="card-conclude-confirm" data-id="'+c.id+'" data-keep-balance="1">✓ Sim, manter saldo</button></div>';
  } else if(m.type==='card-closing-report'){
    inner = renderCardClosingReport(m.payload && m.payload.cardId);
  } else if(m.type==='card-delete-confirm'){
    const c = m.payload && m.payload.cardId ? getCard(m.payload.cardId) : null;
    if(!c) return '<div class="overlay"><div class="modal"><p>Card não encontrado.</p></div></div>';
    const client = getClient(c.clientId);
    const importedTotal = cardImportedHoursTotal(c);
    inner = '<div class="modal-header"><h3>Excluir este card?</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<div class="choice-box">'
        + '<div class="choice-title">'+esc(client?client.name:'')+'</div>'
        + '<div class="choice-desc">Este card recebeu <strong>'+minToHM(importedTotal*60)+'</strong> de saldo importado de outro(s) card(s) deste cliente.</div>'
        + '<div class="choice-desc" style="margin-top:10px;font-weight:700;">Deseja estornar esse saldo de volta para o(s) card(s) de origem?</div>'
        + '<div class="choice-desc">Se "Sim", o saldo volta a ficar disponível no(s) card(s) que o transferiu(ram). Se "Não", esse saldo é perdido junto com a exclusão.</div>'
      + '</div>'
      + '<div class="choice-actions"><button class="btn btn-ghost" data-action="close-modal">Cancelar</button>'
        + '<button class="btn btn-danger" data-action="card-delete-confirm" data-id="'+c.id+'" data-refund="0">Não, apagar saldo</button>'
        + '<button class="btn btn-primary" data-action="card-delete-confirm" data-id="'+c.id+'" data-refund="1">✓ Sim, estornar saldo</button></div>';
  } else if(m.type==='card-forecast-report'){
    inner = renderCardForecastReport(m.payload && m.payload.cardId);
  }
  return '<div class="overlay"><div class="modal'+(m.type && (m.type.startsWith('schedule') || m.type==='card-closing-report' || m.type==='card-forecast-report' || m.type==='agenda-print')?' wide':'')+'">'+inner+'</div></div>';
}

function renderCardClosingReport(cardId){
  const c = getCard(cardId);
  if(!c) return '<div class="modal-header"><h3>Card não encontrado</h3><button class="modal-close" data-action="close-modal">✕</button></div>';
  const client = getClient(c.clientId);
  const board = getBoard(c.boardId);
  const analyst = board ? getAnalyst(board.analystId) : null;
  const products = (c.productTags||[]).map(id => byId(state.productTags, id)).filter(Boolean);
  const trained = collectTrainedFromCard(c);
  const used = cardUsedMinutes(c);
  const bal = cardBalanceHours(c);
  const startDate = c.startDate;
  const endDate = c.conclusionDate || todayISO();

  const cardSchedules = schedulesForCard(c.id).filter(s=> s.status==='concluida');
  const internalSchedulesInPeriod = state.schedules.filter(s=>{
    if(!s.clientId || s.clientId!==c.clientId) return false;
    if(!isInternalType(s.type)) return false;
    if(s.status!=='concluida') return false;
    return s.date >= startDate && s.date <= endDate;
  });
  const internalMinutes = internalSchedulesInPeriod.reduce((sum,s)=> sum + scheduleActualMinutes(s), 0);

  let html = '<div class="modal-header no-print"><h3>Relatório de fechamento da implantação</h3><button class="btn btn-sm btn-primary" data-action="print-report">🖨 Imprimir</button><button class="modal-close" data-action="close-modal">✕</button></div>';
  html += '<div id="print-report">'
    + '<h2 style="margin-bottom:2px;">Relatório de Fechamento — Implantação</h2>'
    + '<p class="hint" style="margin:0 0 16px;">Documento gerado em '+fmtDT(Date.now())+'</p>'
    + '<h3 style="font-size:14px;margin:12px 0 6px;">Dados do cliente</h3>'
    + '<table><tbody>'
    + '<tr><td style="font-weight:700;width:34%;">Nome fantasia</td><td>'+esc(client?client.name:'—')+'</td></tr>'
    + '<tr><td style="font-weight:700;">Razão social</td><td>'+esc(client?client.companyName||'—':'—')+'</td></tr>'
    + '<tr><td style="font-weight:700;">CNPJ / IE</td><td>'+esc(client?client.cnpj||'—':'—')+' / '+esc(client?client.ie||'—':'—')+'</td></tr>'
    + '<tr><td style="font-weight:700;">Cidade / UF</td><td>'+esc(client?client.city||'—':'—')+' / '+esc(client?client.uf||'—':'—')+'</td></tr>'
    + '<tr><td style="font-weight:700;">CEP</td><td>'+esc(client?client.cep||'—':'—')+'</td></tr>'
    + '<tr><td style="font-weight:700;">Segmento</td><td>'+esc(client?client.segment||'—':'—')+'</td></tr>'
    + '<tr><td style="font-weight:700;">Contato / Telefone</td><td>'+esc(client?client.contact||'—':'—')+' / '+esc(client?client.phone||'—':'—')+'</td></tr>'
    + '<tr><td style="font-weight:700;">E-mail</td><td>'+esc(client?client.email||'—':'—')+'</td></tr>'
    + '</tbody></table>'
    + '<h3 style="font-size:14px;margin:16px 0 6px;">Implantação</h3>'
    + '<table><tbody>'
    + '<tr><td style="font-weight:700;width:34%;">Analista responsável</td><td>'+esc(analyst?analyst.name:'—')+'</td></tr>'
    + '<tr><td style="font-weight:700;">Data do Comercial (contrato)</td><td>'+fmtDateBR(c.commercialDate)+'</td></tr>'
    + '<tr><td style="font-weight:700;">Data de início</td><td>'+fmtDateBR(startDate)+'</td></tr>'
    + '<tr><td style="font-weight:700;">Data de conclusão</td><td>'+fmtDateBR(endDate)+'</td></tr>'
    + '</tbody></table>'
    + '<h3 style="font-size:14px;margin:16px 0 6px;">Produtos contratados</h3>'
    + '<table><tbody>'
    + (products.length ? products.map(p=>'<tr><td>'+esc(p.name)+'</td></tr>').join('') : '<tr><td><em>Nenhum produto registrado.</em></td></tr>')
    + '</tbody></table>'
    + '<h3 style="font-size:14px;margin:16px 0 6px;">Módulos / Telas</h3>'
    + '<table><thead><tr><th>Módulos previstos</th><th>Módulos treinados</th></tr></thead><tbody>'
    + '<tr><td>'+((c.expectedModules||[]).map(esc).join(', ') || '—')+'</td><td>'+((trained.modules||[]).map(esc).join(', ') || '—')+'</td></tr>'
    + '</tbody><thead><tr><th>Telas previstas</th><th>Telas treinadas</th></tr></thead><tbody>'
    + '<tr><td>'+((c.expectedScreens||[]).map(esc).join(', ') || '—')+'</td><td>'+((trained.screens||[]).map(esc).join(', ') || '—')+'</td></tr>'
    + '</tbody></table>'
    + '<h3 style="font-size:14px;margin:16px 0 6px;">Tempo gasto por agenda</h3>'
    + '<table><thead><tr><th>Data</th><th>Título / Tipo</th><th>Analista(s)</th><th>Duração</th></tr></thead><tbody>'
    + (cardSchedules.length ? cardSchedules.map(s=>{
        const dur = scheduleActualMinutes(s);
        const zeroed = isInternalType(s.type) && s.deductMinutes===0;
        return '<tr><td>'+scheduleDateText(s)+'</td><td>'+esc(scheduleDisplayTitle(s))+'</td><td>'+esc(scheduleAnalystNames(s))+'</td><td>'+minToHM(dur)+(zeroed?' <em>(não abatido)</em>':'')+'</td></tr>';
      }).join('') : '<tr><td colspan="4"><em>Nenhuma agenda concluída vinculada ao card.</em></td></tr>')
    + '</tbody></table>'
    + '<h3 style="font-size:14px;margin:16px 0 6px;">Saldo</h3>'
    + '<table><tbody>'
    + '<tr><td style="font-weight:700;width:34%;">Horas contratadas</td><td>'+c.contractedHours+'h</td></tr>'
    + '<tr><td style="font-weight:700;">Tempo gasto na implantação</td><td>'+minToHM(used)+'</td></tr>'
    + '<tr><td style="font-weight:700;">Saldo disponível</td><td><strong>'+minToHM(bal*60)+'</strong></td></tr>'
    + '</tbody></table>'
    + '<h3 style="font-size:14px;margin:16px 0 6px;">Agendas internas vinculadas ao cliente</h3>'
    + '<p class="hint" style="margin:0 0 6px;">Período: '+fmtDateBR(startDate)+' a '+fmtDateBR(endDate)+'.</p>'
    + '<table><thead><tr><th>Data</th><th>Título / Tipo</th><th>Analista(s)</th><th>Duração</th></tr></thead><tbody>'
    + (internalSchedulesInPeriod.length ? internalSchedulesInPeriod.map(s=>{
        const dur = scheduleActualMinutes(s);
        return '<tr><td>'+scheduleDateText(s)+'</td><td>'+esc(scheduleDisplayTitle(s))+'</td><td>'+esc(scheduleAnalystNames(s))+'</td><td>'+minToHM(dur)+'</td></tr>';
      }).join('') : '<tr><td colspan="4"><em>Nenhuma agenda interna no período.</em></td></tr>')
    + '</tbody></table>'
    + '<p style="margin-top:12px;font-weight:700;">Total de horas em agendas internas: '+minToHM(internalMinutes)+'</p>'
    + '</div>';
  return html;
}

function renderCardForecastReport(cardId){
  const c = getCard(cardId);
  if(!c) return '<div class="modal-header"><h3>Card não encontrado</h3><button class="modal-close" data-action="close-modal">✕</button></div>';
  const client = getClient(c.clientId);
  const expectedM = c.expectedModules||[];
  const expectedS = c.expectedScreens||[];
  const trained = collectTrainedFromCard(c);
  const trainedMSet = new Set(trained.modules);
  const trainedSSet = new Set(trained.screens);
  const expectedMSet = new Set(expectedM);
  const expectedSSet = new Set(expectedS);
  let html = '<div class="modal-header no-print"><h3>Relatório comparativo — Previsto × Treinado</h3><button class="btn btn-sm btn-primary" data-action="print-report">🖨 Imprimir</button><button class="modal-close" data-action="close-modal">✕</button></div>';
  html += '<div id="print-report">'
    + '<h2 style="margin-bottom:2px;">Relatório Comparativo — Previsto × Treinado</h2>'
    + '<p class="hint" style="margin:0 0 16px;">Cliente: <strong>'+esc(client?client.name:'—')+'</strong> · Gerado em '+fmtDT(Date.now())+'</p>'
    + '<h3 style="font-size:14px;margin:12px 0 6px;">Módulos</h3>'
    + '<table><thead><tr><th>Módulo</th><th>Previsto</th><th>Treinado</th><th>Status</th></tr></thead><tbody>';
  const allMods = [...new Set([...expectedM, ...trained.modules])];
  if(!allMods.length) html += '<tr><td colspan="4"><em>Nenhum módulo registrado.</em></td></tr>';
  allMods.forEach(name=>{
    const prev = expectedMSet.has(name) ? 'Sim' : '—';
    const tr = trainedMSet.has(name) ? 'Sim' : '—';
    let st = 'OK';
    if(expectedMSet.has(name) && !trainedMSet.has(name)) st = 'Pendente';
    else if(!expectedMSet.has(name) && trainedMSet.has(name)) st = 'Extra';
    html += '<tr><td>'+esc(name)+'</td><td>'+prev+'</td><td>'+tr+'</td><td>'+st+'</td></tr>';
  });
  html += '</tbody></table>'
    + '<h3 style="font-size:14px;margin:16px 0 6px;">Telas (por módulo)</h3>'
    + '<table><thead><tr><th>Módulo</th><th>Tela</th><th>Previsto</th><th>Treinado</th><th>Status</th></tr></thead><tbody>';
  const allScr = [...new Set([...expectedS, ...trained.screens])];
  if(!allScr.length){
    html += '<tr><td colspan="5"><em>Nenhuma tela registrada.</em></td></tr>';
  } else {
    const screenNameToModuleId = new Map();
    state.screens.forEach(scr=> screenNameToModuleId.set(scr.name, scr.moduleId));
    const grouped = new Map();
    const orphan = [];
    allScr.forEach(name=>{
      const mid = screenNameToModuleId.get(name);
      if(mid){ if(!grouped.has(mid)) grouped.set(mid, []); grouped.get(mid).push(name); }
      else orphan.push(name);
    });
    function screenRow(name, prev, tr, st){
      return '<td>'+esc(name)+'</td><td>'+prev+'</td><td>'+tr+'</td><td>'+st+'</td></tr>';
    }
    state.modules.forEach(mod=>{
      const names = grouped.get(mod.id);
      if(!names || !names.length) return;
      names.forEach((name,i)=>{
        const prev = expectedSSet.has(name) ? 'Sim' : '—';
        const tr = trainedSSet.has(name) ? 'Sim' : '—';
        let st = 'OK';
        if(expectedSSet.has(name) && !trainedSSet.has(name)) st = 'Pendente';
        else if(!expectedSSet.has(name) && trainedSSet.has(name)) st = 'Extra';
        html += '<tr>'+(i===0?'<td rowspan="'+names.length+'" style="font-weight:700;vertical-align:top;">'+esc(mod.name)+'</td>':'')+screenRow(name, prev, tr, st);
      });
    });
    if(orphan.length){
      orphan.forEach((name,i)=>{
        const prev = expectedSSet.has(name) ? 'Sim' : '—';
        const tr = trainedSSet.has(name) ? 'Sim' : '—';
        let st = 'OK';
        if(expectedSSet.has(name) && !trainedSSet.has(name)) st = 'Pendente';
        else if(!expectedSSet.has(name) && trainedSSet.has(name)) st = 'Extra';
        html += '<tr>'+(i===0?'<td rowspan="'+orphan.length+'" style="font-weight:700;vertical-align:top;"><em>Sem módulo</em></td>':'')+screenRow(name, prev, tr, st);
      });
    }
  }
  html += '</tbody></table></div>';
  return html;
}

function renderScheduleForm(m){

  const clientExistingCards = effClientId ? state.cards.filter(c=>c.clientId===effClientId) : [];
  const defaultLinkCardId = editing ? (editing.cardId || '__new__') : (clientExistingCards.length ? clientExistingCards[0].id : '__new__');
  const editingAnalystIds = editing ? scheduleAnalystIds(editing) : [];
  const eff = {
    title: draft ? (draft.title||'') : (editing ? (editing.title||'') : ''),
    clientId: effClientId,
    analystIds: draft ? (draft.analystIds || (draft.analystId ? [draft.analystId] : [])) : (editingAnalystIds.length ? editingAnalystIds : (fixedAnalystId? [fixedAnalystId] : (m.prefillAnalyst? [m.prefillAnalyst] : []))),
    date: draft ? draft.date : (editing ? editing.date : (m.prefillDate || todayISO())),
    endDate: draft ? (draft.endDate || draft.date) : (editing ? (editing.endDate || editing.date) : (m.prefillDate || todayISO())),
    allDay: draft ? formValuesAllDay(draft) : (editing ? !!editing.allDay : false),
    startTime: draft ? draft.startTime : (editing ? editing.startTime : (m.prefillStart || '09:00')),
    endTime: draft ? draft.endTime : (editing ? editing.endTime : (m.prefillEnd || '10:00')),
    type: draft ? draft.type : (editing ? editing.type : (activeAgendaTypes().find(t=>!t.isInternal && !t.isServico) ? activeAgendaTypes().find(t=>!t.isInternal && !t.isServico).name : (activeAgendaTypes()[0]?activeAgendaTypes()[0].name:''))),
    category: draft ? (draft.category||'implantacao') : (editing ? (editing.category||'implantacao') : 'implantacao'),
    modules: draft ? (draft.modules||[]) : (editing ? (editing.modules||[]) : []),
    trainedScreens: draft ? (draft.trainedScreens||[]) : (editing ? (editing.trainedScreens||[]) : []),
    trainedUsers: draft ? (draft.trainedUsers||'') : (editing ? (editing.trainedUsers||'') : ''),
    linkCardId: draft ? (draft.linkCardId || defaultLinkCardId) : defaultLinkCardId,
    notes: draft ? (draft.notes||'') : (editing ? editing.notes : '')
  };

  if(ui.formErr){ html += '<div class="error-msg">'+esc(ui.formErr)+'</div>'; }
  html += '<form data-form="schedule" data-id="'+(editing?editing.id:'')+'" data-card="'+(cardCtx?cardCtx.id:'')+'">';
  html += '<div class="field"><label>Título</label><input type="text" name="title" value="'+esc(eff.title)+'"></div>';
  html += '<div class="field"><label>Categoria</label><select name="category">'
    + '<option value="implantacao" '+(eff.category==='implantacao'?'selected':'')+'>Implantação</option>'
    + '<option value="interna" '+(eff.category==='interna'?'selected':'')+'>Interna</option>'
    + '<option value="servico" '+(eff.category==='servico'?'selected':'')+'>Serviço</option>'
    + '</select></div>';

  if(cardCtx){
    const client = getClient(cardCtx.clientId);
    html += '<div class="field"><label>Cliente</label><input type="text" value="'+esc(client?client.name:'')+'" disabled></div>';
  } else {
    html += '<div class="field"><label>Cliente (opcional)</label>'+renderClientPicker('clientId', eff.clientId, m.clientQuery)+'</div>';
    if(eff.clientId){
      const existingCards = state.cards.filter(c=>c.clientId===eff.clientId);
      if(existingCards.length){
        html += '<div class="field"><label>Vincular ao card</label><select name="linkCardId">'
          + '<option value="__new__" '+(eff.linkCardId==='__new__'?'selected':'')+'>+ Criar novo card</option>';
        existingCards.forEach(c=>{
          const b = getBoard(c.boardId); const an = b ? getAnalyst(b.analystId) : null; const list = b ? byId(b.lists, c.listId) : null;
          html += '<option value="'+c.id+'" '+(eff.linkCardId===c.id?'selected':'')+'>Card de '+esc(an?an.name:'—')+(list?' — '+esc(list.name):'')+'</option>';
        });
        html += '</select></div>';
      }
    }
  }

  html += '<div class="field"><label>Analista(s)</label><div class="multi-analyst-grid">';
  state.analysts.forEach(a=>{
    const checked = eff.analystIds.includes(a.id);
    const showInactive = a.inactive && checked;
    if(a.inactive && !showInactive) return;
    html += '<label class="multi-analyst-item'+(checked?' checked':'')+'" style="'+(checked?'border-color:'+a.color+';background:'+a.color+'14;color:'+darkenColor(a.color,.25)+';':'')+'">'
      + '<input type="checkbox" name="analystIds" value="'+a.id+'" '+(checked?'checked':'')+'>'
      + '<span class="m-dot" style="background:'+(a.inactive?'#B9CAD5':a.color)+'"></span>'
      + '<span>'+esc(a.name)+(a.isAdmin?' · ADMIN':'')+'</span>'
      + '</label>';
  });
  html += '</div></div>';

  html += '<div class="field-row">'
    + '<div class="field"><label>'+(eff.allDay?'Dia inicial':'Data')+'</label><input type="date" name="date" value="'+esc(eff.date)+'"></div>'
    + '<div class="field" style="justify-content:flex-end;">'
    +   '<label class="allday-toggle"><input type="checkbox" name="allDay" '+(eff.allDay?'checked':'')+'> Dia todo</label>'
    + '</div></div>';

  if(eff.allDay){
    html += '<div class="field-row"><div class="field"><label>Dia final</label><input type="date" name="endDate" value="'+esc(eff.endDate)+'"></div></div>';
    const isFerias = isFeriasType(eff.type);
    let detail;
    if(isFerias){
      const wd = countWeekdaysBetweenISO(eff.date, eff.endDate||eff.date);
      detail = 'Férias — '+wd+' dia(s) útil(eis) × 8h48 = <strong>'+minToHM(wd*FERIAS_MIN_PER_WEEKDAY)+'</strong> por analista.';
    } else {
      const daysCount = scheduleDayCount({allDay:true, date:eff.date, endDate:eff.endDate||eff.date});
      detail = daysCount > 1 ? (daysCount+' dias corridos = <strong>'+minToHM(8*60*daysCount)+'</strong> por analista.') : '8h corridas por analista.';
    }
    html += '<div class="allday-banner">📅 '+detail+'</div>';
  } else {
    html += '<div class="field-row"><div class="field"><label>Início</label><input type="time" name="startTime" value="'+esc(eff.startTime)+'"></div>'
      + '<div class="field"><label>Fim</label><input type="time" name="endTime" value="'+esc(eff.endTime)+'"></div></div>';
  }

  html += '<div class="field"><label>Tipo</label><select name="type">';
  const catFilter = eff.category;
  state.agendaTypes.forEach(t=>{
    let matchCat = false;
    if(catFilter==='interna') matchCat = !!t.isInternal;
    else if(catFilter==='servico') matchCat = !!t.isServico;
    else matchCat = !t.isInternal && !t.isServico;
    if(!matchCat && !(editing && editing.type===t.name)) return;
    if(t.inactive && !(editing && editing.type===t.name)) return;
    html += '<option value="'+esc(t.name)+'" '+(eff.type===t.name?'selected':'')+'>'+esc(t.name)+'</option>';
  });
  html += '</select></div>';

  html += renderModuleScreenTabs('modules', 'trainedScreens', eff.modules, eff.trainedScreens,
    'Módulo(s)', 'Telas treinadas (por módulo)', ui.scheduleModuleTab, 'schedule');

  html += '<div class="field"><label>Usuários treinados</label><textarea name="trainedUsers">'+esc(eff.trainedUsers)+'</textarea></div>';
  html += '<div class="field"><label>Observações</label><textarea name="notes">'+esc(eff.notes)+'</textarea></div>';

  let quick = '';
  if(editing && editing.status==='pendente'){
    quick = '<button type="button" class="btn btn-sm btn-primary" data-action="open-modal" data-modal="confirm-complete" data-id="'+editing.id+'">Concluir agora</button>'
      + '<button type="button" class="btn btn-sm btn-ghost" data-action="mark-not-done" data-id="'+editing.id+'">Não realizada</button>';
  } else if(editing){
    quick = '<button type="button" class="btn btn-sm btn-ghost" data-action="revert-to-pending" data-id="'+editing.id+'">Reverter</button>';
  }
  if(editing){
    quick += '<button type="button" class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="agenda-print" data-id="'+editing.id+'">🖨 Relatório de agenda</button>';
  }
  html += '<div class="form-actions">'+quick+(editing?'<button type="button" class="btn btn-danger" data-action="delete-schedule" data-id="'+editing.id+'">Excluir</button>':'')+'<span style="flex:1;"></span><button type="submit" class="btn btn-primary">Salvar</button></div>';
  html += '</form>';
  return html;
}

/* ============================= EVENT HANDLING ============================= */
function closeModal(){ ui.modal=null; ui.formErr=''; render(); }
function showConfirm(message, onConfirm){ ui.confirmDialog = {message, onConfirm, alertOnly:false}; render(); }
function showAlert(message){ ui.confirmDialog = {message, onConfirm:null, alertOnly:true}; render(); }
function doPrint(){
  const source = document.querySelector('.overlay .modal #print-report');
  const printRoot = document.getElementById('print-root');
  if(source && printRoot){
    const clone = source.cloneNode(true);
    clone.removeAttribute('id');
    printRoot.innerHTML = '';
    printRoot.appendChild(clone);
  }
  try{ window.print(); }catch(err){ console.warn('Falha ao abrir impressão', err); }
}
function triggerAutoPrint(){
  if(window.innerWidth > 820){
    setTimeout(doPrint, 300);

    let minutesFromStart = (offsetY/pxPerHour)*60;

    let totalMin = Math.max(0, Math.min(24*60-30, startHour*60 + minutesFromStart));
    const pad = n=>String(n).padStart(2,'0');
    const startH = Math.floor(totalMin/60), startM = totalMin%60;
    const endTotal = Math.min(24*60, totalMin+60);

    ui.formErr = '';
    ui.modal = { type:'schedule-new', prefillDate: el.dataset.date, prefillStart: pad(startH)+':'+pad(startM), prefillEnd: pad(endH===24?23:endH)+':'+(endM===60?'59':pad(endM)), prefillAnalyst: ui.calAnalyst!=='all' ? ui.calAnalyst : undefined };

  else if(a==='after-complete-no-print'){ ui.modal = null; render(); }
  else if(a==='logout'){ logout(); }
  else { if(el.tagName!=='SELECT') render(); }
});

  if(type==='analyst'){
    if(!isAdminUser()){ showAlert('Apenas administradores.'); return; }
    const name = fd.get('name').trim(); const color = fd.get('color');
    const username = (fd.get('username')||'').trim().toLowerCase();
    const password = fd.get('password')||''; const passwordConfirm = fd.get('passwordConfirm')||'';
    const id = form.dataset.id; const wantsAdmin = fd.get('isAdmin')==='on';
    if(!username){ showAlert('Informe o usuário.'); return; }
    if(!/^[a-z0-9._-]+$/.test(username)){ showAlert('Usuário inválido.'); return; }
    if(state.analysts.some(a=> a.username && a.username.toLowerCase()===username && a.id!==id)){ showAlert('Usuário duplicado.'); return; }
    if(!id && !password){ showAlert('Defina senha.'); return; }
    if(password || passwordConfirm){
      if(password !== passwordConfirm){ showAlert('Senhas diferentes.'); return; }
      if(password.length < 4){ showAlert('Mínimo 4 caracteres.'); return; }
    }
    let newPhoto;
    const photoFile = fd.get('photo');
    if(photoFile && photoFile.size){
      try{ newPhoto = await resizeImageToDataURL(photoFile, 160); }
      catch(err){ showAlert('Não foi possível ler a imagem selecionada.'); return; }
    } else if(fd.get('removePhoto')==='on'){ newPhoto = ''; }
    if(id){
      const a = getAnalyst(id); if(!a) return;
      a.name = name; a.color = color; a.username = username;
      if(newPhoto!==undefined) a.photo = newPhoto;
      if(password) a.password = password;
      if(!a.isAdmin && wantsAdmin) a.isAdmin = true;
      const b = boardOfAnalyst(id); if(b) b.name = 'Quadro — '+name;
    } else { const r = createAnalyst(name, color, username, password, wantsAdmin); if(newPhoto) r.analyst.photo = newPhoto; }
    ui.modal=null; render();
  }
  else if(type==='change-password'){
    const id = form.dataset.id; const a = getAnalyst(id); if(!a) return;
    const cur = fd.get('currentPassword')||''; const nw = fd.get('newPassword')||''; const cf = fd.get('confirmPassword')||'';
    if(a.password && a.password !== cur){ showAlert('Senha atual incorreta.'); return; }
    if(nw.length < 4){ showAlert('Mínimo 4 caracteres.'); return; }
    if(nw !== cf){ showAlert('Senhas diferentes.'); return; }
    a.password = nw; render(); showAlert('Senha alterada.');
  }
  else if(type==='client'){
    const data = {
      code: fd.get('code').trim(), name: fd.get('name').trim(), companyName: fd.get('companyName').trim(),
      cnpj: fd.get('cnpj').trim(), ie: fd.get('ie').trim(), contact: fd.get('contact').trim(),
      email: fd.get('email').trim(), phone: fd.get('phone').trim(), segment: fd.get('segment').trim(),
      city: fd.get('city').trim(), uf: (fd.get('uf')||'').trim().toUpperCase().slice(0,2), cep: (fd.get('cep')||'').trim(),
      clientType: fd.get('clientType')||'novo',
      crc: (fd.get('crc')||'').trim(), ownerCpf: (fd.get('ownerCpf')||'').trim(),
      /* Novo campo: vínculo com contador. Se o próprio registro for do tipo
         contador, forçamos vazio — um contador não tem contador. */
      accountantId: (fd.get('clientType')==='contador' ? '' : (fd.get('accountantId')||'').trim())
    };
    const id = form.dataset.id;
    if(data.code && state.clients.some(c=>c.code===data.code && c.id!==id)){ showAlert('Código duplicado.'); return; }
    if(id) updateClient(id, data); else createClient(data);
    ui.modal=null; render();
  }
  else if(type==='list-new'){ addList(form.dataset.board, fd.get('name').trim()); ui.modal=null; render(); }
  else if(type==='card-new'){
    let clientId = fd.get('clientId');
    if(!clientId){
      const newName = (fd.get('newClientName')||'').trim();
      if(!newName){ showAlert('Selecione ou informe o cliente.'); return; }
      clientId = createClient({name:newName}).id;
    }
    let hours = parseFloat(fd.get('contractedHours'))||0;
    const useExisting = fd.get('useExistingBalance')==='on';
    let importedFromCards = [];
    if(useExisting){
      const prevCards = state.cards.filter(c=>c.clientId===clientId && cardBalanceHours(c)>0);
      const prev = prevCards.reduce((sum,c)=> sum + cardBalanceHours(c), 0);
      if(prev > 0){
        hours += prev;
        importedFromCards = prevCards.map(c=>({card:c, bal:cardBalanceHours(c)}));
      }
    }
    const newCard = createCard(form.dataset.board, form.dataset.list, clientId, { contractedHours: hours, startDate: fd.get('startDate')||todayISO(), commercialDate: fd.get('commercialDate')||'' });
    if(importedFromCards.length && newCard){
      importedFromCards.forEach(({card,bal})=>{
        addHistory(card, 'Saldo de '+minToHM(bal*60)+' transferido para um novo card deste cliente ('+minToHM(hours*60)+' contratadas).');
        card.balanceForfeited = true;
      });
      newCard.importedFrom = importedFromCards.map(({card,bal})=>({cardId:card.id, hours:bal}));
      addHistory(newCard, 'Recebeu '+minToHM(importedFromCards.reduce((s,x)=>s+x.bal,0)*60)+' de saldo importado de card(s) anterior(es) deste cliente.');
    }
    ui.modal=null; render();
  }
  else if(type==='card-info'){
    const cardId = form.dataset.card;
    const card = getCard(cardId);
    const newHours = parseFloat(fd.get('contractedHours'))||0;
    const newStart = fd.get('startDate');
    const newCommercial = fd.get('commercialDate')||'';
    const newTags = fd.getAll('productTags');
    const expectedModules = fd.getAll('expectedModules');
    const expectedScreens = fd.getAll('expectedScreens');
    let histTexts = [];
    if(newHours !== card.contractedHours) histTexts.push('Horas alteradas de '+card.contractedHours+'h para '+newHours+'h');
    if(newStart !== card.startDate) histTexts.push('Início alterado para '+fmtDateBR(newStart));
    if(newCommercial !== (card.commercialDate||'')) histTexts.push(newCommercial ? 'Data do Comercial alterada para '+fmtDateBR(newCommercial) : 'Data do Comercial removida');
    card.contractedHours = newHours; card.startDate = newStart; card.commercialDate = newCommercial; card.productTags = newTags;
    card.expectedModules = expectedModules;
    card.expectedScreens = expectedScreens;
    histTexts.forEach(t=> addHistory(card, t));
    const moveVal = fd.get('moveTo');
    if(moveVal){
      const [b,l] = moveVal.split('::');
      const r = moveCard(cardId, b, l);
      if(r && r.toList && isDoneListName(r.toList.name) && !card.isConcluded){
        ui.cardDraft = null;
        ui.modal = {type:'card-conclude-confirm', payload:{cardId: card.id}};
        render(); return;
      }
    }
    ui.cardDraft = null;
    render();
  }
  else if(type==='schedule'){
    const cardIdFromCtx = form.dataset.card || null;
    const card = cardIdFromCtx ? getCard(cardIdFromCtx) : null;
    const clientId = card ? card.clientId : (fd.get('clientId') || null);
    const date = fd.get('date');
    const allDay = fd.get('allDay')==='on';
    let endDate = allDay ? (fd.get('endDate')||date) : date;
    if(allDay && endDate < date){ ui.formErr = 'Dia final antes do inicial.'; render(); return; }
    const startTime = allDay ? '00:00' : (fd.get('startTime')||'09:00');
    const endTime = allDay ? '23:59' : (fd.get('endTime')||'10:00');
    const typeName = fd.get('type'); const title = (fd.get('title')||'').trim();
    let analystIds = fd.getAll('analystIds');
    if(!analystIds.length && card){
      const cardBoard = getBoard(card.boardId);
      if(cardBoard && cardBoard.analystId) analystIds = [cardBoard.analystId];
    }
    if(!analystIds.length){ ui.formErr = 'Selecione analista(s).'; render(); return; }
    const id = form.dataset.id;

    if(!allDay && hasAllDayBlocking(analystIds, date, id||null)){ ui.formErr = 'Há agenda de dia todo nesta data.'; render(); return; }
    if(!allDay && timeToMin(endTime) <= timeToMin(startTime)){ ui.formErr = 'Horário inválido.'; render(); return; }
    if(!allDay && scheduleConflict(analystIds, date, startTime, endTime, id||null, false)){ ui.formErr = 'Conflito de horário.'; render(); return; }
    ui.formErr = '';

    const isInternal = isInternalType(typeName);
    let resolvedCardId = cardIdFromCtx;
    let askAfterSave = false;
    if(!resolvedCardId && clientId && isInternal){
      // Se já existe um card para este cliente, mesmo que esteja no quadro
      // de outro analista, vincula a agenda diretamente ao card existente.
      const existingCard = state.cards.find(c=>c.clientId===clientId);
      if(existingCard){
        resolvedCardId = existingCard.id;
      } else {
        // Só pergunta sobre criação de card quando realmente não existe nenhum.
        askAfterSave = true;
      }
    }
    else if(!resolvedCardId && clientId){
      const linkChoice = fd.get('linkCardId');
      if(linkChoice === '__new__'){
        const board = boardOfAnalyst(analystIds[0]);
        if(board){ const newCard = createCard(board.id, board.lists[0].id, clientId, {}); resolvedCardId = newCard.id; }
      } else if(linkChoice){ resolvedCardId = linkChoice; }
      else {
        const existing = state.cards.find(c=>c.clientId===clientId);
        if(existing){ resolvedCardId = existing.id; }
        else { const board = boardOfAnalyst(analystIds[0]); if(board){ const newCard = createCard(board.id, board.lists[0].id, clientId, {}); resolvedCardId = newCard.id; } }
      }
    }

    const data = {
      title, analystId: analystIds[0], analystIds, clientId, cardId: resolvedCardId,
      date, endDate: allDay ? endDate : date, allDay, startTime, endTime, type: typeName,
      category: fd.get('category')||'implantacao', modules: fd.getAll('modules'),
      trainedScreens: fd.getAll('trainedScreens'), trainedUsers: fd.get('trainedUsers')||'', notes: fd.get('notes')||''
    };
    let savedSchedule = null;
    if(id){ updateSchedule(id, data); savedSchedule = byId(state.schedules, id); }
    else { savedSchedule = createSchedule(data); }
    if(savedSchedule && savedSchedule.cardId) syncCardStartDateFromSchedules(savedSchedule.cardId);
    ui.modal = null;
    if(askAfterSave && savedSchedule && savedSchedule.clientId && !savedSchedule.cardId){ ui.modal = { type:'internal-ask-board', payload:{ scheduleId: savedSchedule.id } }; }
    render();
  }
  else if(type==='confirm-complete'){
    const minutes = parseInt(fd.get('deductMinutes'),10)||0;
    const id = form.dataset.id;
    completeSchedule(id, minutes, fd.get('notes'));
    ui.modal = { type:'agenda-print', id: id };
    render();
    triggerAutoPrint();
  }
  else if(type==='product'){
    const name = fd.get('name').trim(); const color = fd.get('color'); const id = form.dataset.id;
    if(id){ const p=byId(state.productTags,id); if(p){ p.name=name; p.color=color; } }
    else { state.productTags.push({id:uid('pt'), name, color, inactive:false}); }
    ui.modal=null; render();
  }
  else if(type==='module'){
    const name = fd.get('name').trim(); const id = form.dataset.id;
    const productIds = fd.getAll('productIds');
    if(state.modules.some(m=>m.name===name && m.id!==id)){ showAlert('Módulo duplicado.'); return; }
    if(id){ const md = byId(state.modules, id); if(md){ renameModuleEverywhere(md.name, name); md.name = name; md.productIds = productIds; delete md.productId; } }
    else if(name){ state.modules.push({id:uid('md'), name, productIds, inactive:false}); }
    ui.modal=null; render();
  }
  else if(type==='screen'){
    const name = fd.get('name').trim(); const moduleId = fd.get('moduleId'); const id = form.dataset.id;
    if(state.screens.some(s=>s.name===name && s.moduleId===moduleId && s.id!==id)){ showAlert('Tela duplicada.'); return; }
    if(id){ const scr = byId(state.screens, id); if(scr){ renameScreenEverywhere(scr.name, name); scr.name = name; scr.moduleId = moduleId; } }
    else if(name){ state.screens.push({id:uid('scr'), name, moduleId, inactive:false}); }
    ui.modal=null; render();
  }
  else if(type==='agenda-type'){
    const name = fd.get('name').trim(); const catKind = fd.get('catKind') || 'implantacao';
    const isInternal = catKind==='interna'; const isServico = catKind==='servico';
    const id = form.dataset.id;
    if(state.agendaTypes.some(t=>t.name===name && t.id!==id)){ showAlert('Tipo duplicado.'); return; }
    if(id){ const tp = byId(state.agendaTypes, id); if(tp){ renameTypeEverywhere(tp.name, name); tp.name = name; tp.isInternal = isInternal; tp.isServico = isServico; } }
    else if(name){ state.agendaTypes.push({id:uid('at'), name, isInternal, isServico, inactive:false}); }
    ui.modal=null; render();
  }
  else if(type==='cloud-config'){
    if(!isAdminUser()){ showAlert('Apenas administradores.'); return; }
    const url = fd.get('url').trim(); const anonKey = fd.get('anonKey').trim();
    await connectCloud(url, anonKey);
  }
});

/* Drag and drop */
document.addEventListener('dragstart', function(e){
  const card = e.target.closest('.card-mini');
  if(card){ e.dataTransfer.setData('text/plain', card.dataset.cardId); e.dataTransfer.effectAllowed='move'; setTimeout(()=>card.classList.add('dragging'),0); return; }
  const evt = e.target.closest('.cal-tg-event');
  if(evt && evt.dataset.draggable==='1'){
    const rect = evt.getBoundingClientRect();
    const grabOffset = e.clientY - rect.top;
    e.dataTransfer.setData('text/plain', 'sched:'+evt.dataset.id+':'+grabOffset);
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>evt.classList.add('dragging'),0);
  }
});
document.addEventListener('dragend', function(e){
  const card = e.target.closest('.card-mini'); if(card) card.classList.remove('dragging');
  const evt = e.target.closest('.cal-tg-event'); if(evt) evt.classList.remove('dragging');
});
document.addEventListener('dragover', function(e){
  const list = e.target.closest('.list-cards'); if(list){ e.preventDefault(); list.classList.add('drag-over'); return; }
  const daycol = e.target.closest('.cal-tg-daycol'); if(daycol){ e.preventDefault(); daycol.classList.add('drag-over'); }
});
document.addEventListener('dragleave', function(e){
  const list = e.target.closest('.list-cards'); if(list){ list.classList.remove('drag-over'); }
  const daycol = e.target.closest('.cal-tg-daycol'); if(daycol){ daycol.classList.remove('drag-over'); }
});
document.addEventListener('drop', function(e){
  const list = e.target.closest('.list-cards');
  if(list){
    e.preventDefault(); list.classList.remove('drag-over');
    const payload = e.dataTransfer.getData('text/plain');
    if(payload && !payload.startsWith('sched:')){
      const card = getCard(payload);
      if(card){
        const listName = list.dataset.unifiedListName;
        const targetBoard = getBoard(card.boardId);
        const targetList = targetBoard && targetBoard.lists.find(l=>l.name===listName);
        if(targetList){
          const r = moveCard(payload, targetBoard.id, targetList.id);
          if(r && r.toList && isDoneListName(r.toList.name) && !card.isConcluded){
            ui.modal = {type:'card-conclude-confirm', payload:{cardId: card.id}};
            render(); return;
          }
          render();
        } else { showAlert('Este estágio não existe no quadro do analista responsável.'); }
      }
    }
    return;
  }
  const daycol = e.target.closest('.cal-tg-daycol');
  if(daycol){
    e.preventDefault(); daycol.classList.remove('drag-over');
    const payload = e.dataTransfer.getData('text/plain');
    if(payload && payload.startsWith('sched:')){
      const parts = payload.split(':');
      moveScheduleToGridPosition(parts[1], daycol, e.clientY, parseFloat(parts[2])||0);
    }
  }
});
function moveScheduleToGridPosition(schedId, daycolEl, clientY, grabOffset){
  const s = byId(state.schedules, schedId);
  if(!s || s.status!=='pendente' || s.allDay) return;
  const rect = daycolEl.getBoundingClientRect();
  const startHour = parseFloat(daycolEl.dataset.startHour);
  const pxPerHour = parseFloat(daycolEl.dataset.pxPerHour);
  const dropTop = clientY - rect.top - grabOffset;
  let minutesFromStart = Math.round(((dropTop/pxPerHour)*60)/15)*15;
  const duration = timeToMin(s.endTime)-timeToMin(s.startTime);
  let newStartTotal = Math.max(0, Math.min(24*60-duration, startHour*60 + minutesFromStart));
  const pad = n=>String(n).padStart(2,'0');
  const newStart = pad(Math.floor(newStartTotal/60))+':'+pad(newStartTotal%60);
  const newEndTotal = newStartTotal+duration;
  const newEnd = pad(Math.floor(newEndTotal/60))+':'+pad(newEndTotal%60);
  const newDate = daycolEl.dataset.date;
  if(newDate===s.date && newStart===s.startTime) return;
  if(hasAllDayBlocking(scheduleAnalystIds(s), newDate, s.id)){ showAlert('Há agenda de dia todo nesta data.'); return; }
  if(scheduleConflict(scheduleAnalystIds(s), newDate, newStart, newEnd, s.id, false)){ showAlert('Conflito de horário.'); return; }
  const oldDate = s.date, oldStart = s.startTime, oldEnd = s.endTime;
  s.date = newDate; s.startTime = newStart; s.endTime = newEnd;
  if(s.cardId){ const c = getCard(s.cardId); if(c) addHistory(c, 'Agenda reagendada de '+fmtDateBR(oldDate)+' '+oldStart+'–'+oldEnd+' para '+fmtDateBR(newDate)+' '+newStart+'–'+newEnd); }
  render();
}

/* Redimensionar agenda pelas bordas (arrastar topo = ajusta início, arrastar
   base = ajusta fim), diretamente na grade de horários da Agenda. */
let resizeDrag = null;
document.addEventListener('mousedown', function(e){
  const handle = e.target.closest('.resize-handle');
  if(!handle) return;
  const eventEl = handle.closest('.cal-tg-event');
  const daycol = eventEl && eventEl.closest('.cal-tg-daycol');
  const s = byId(state.schedules, handle.dataset.id);
  if(!eventEl || !daycol || !s) return;
  e.preventDefault();
  e.stopPropagation();
  resizeDrag = {
    schedId: handle.dataset.id,
    edge: handle.dataset.edge,
    eventEl, daycol,
    startHour: parseFloat(daycol.dataset.startHour),
    pxPerHour: parseFloat(daycol.dataset.pxPerHour),
    origStart: s.startTime, origEnd: s.endTime,
    date: s.date,
    previewStart: null, previewEnd: null
  };
  eventEl.classList.add('resizing');
  document.body.style.cursor = 'ns-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', function(e){
  if(!resizeDrag) return;
  const rd = resizeDrag;
  const rect = rd.daycol.getBoundingClientRect();
  const relY = e.clientY - rect.top;
  const pad = n=>String(n).padStart(2,'0');
  let minutesFromStart = Math.round(((relY/rd.pxPerHour)*60)/15)*15;
  let totalMin = rd.startHour*60 + minutesFromStart;
  totalMin = Math.max(0, Math.min(24*60, totalMin));

  let newStart = rd.origStart, newEnd = rd.origEnd;
  if(rd.edge==='top'){
    const endMin = timeToMin(rd.origEnd);
    totalMin = Math.min(totalMin, endMin-15);
    newStart = pad(Math.floor(totalMin/60))+':'+pad(totalMin%60);
    rd.previewStart = newStart;
  } else {
    const startMin = timeToMin(rd.origStart);
    totalMin = Math.max(totalMin, startMin+15);
    newEnd = pad(Math.floor(totalMin/60))+':'+pad(totalMin%60);
    rd.previewEnd = newEnd;
  }

  const top = (timeToMin(newStart) - rd.startHour*60) * (rd.pxPerHour/60);
  const height = Math.max((timeToMin(newEnd)-timeToMin(newStart)) * (rd.pxPerHour/60), 20);
  rd.eventEl.style.top = top+'px';
  rd.eventEl.style.height = height+'px';
  const titleEl = rd.eventEl.querySelector('.t');
  if(titleEl) titleEl.textContent = newStart+' '+titleEl.textContent.replace(/^\d{2}:\d{2}\s*/, '');
  rd.eventEl.title = rd.eventEl.title.replace(/\d{2}:\d{2}–\d{2}:\d{2}/, newStart+'–'+newEnd);
});
document.addEventListener('mouseup', function(){
  if(!resizeDrag) return;
  const rd = resizeDrag;
  resizeDrag = null;
  rd.eventEl.classList.remove('resizing');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';

  const finalStart = rd.previewStart || rd.origStart;
  const finalEnd = rd.previewEnd || rd.origEnd;
  if(finalStart===rd.origStart && finalEnd===rd.origEnd) return;

  const s = byId(state.schedules, rd.schedId);
  if(!s){ render(); return; }
  if(hasAllDayBlocking(scheduleAnalystIds(s), rd.date, s.id)){ showAlert('Há agenda de dia todo nesta data.'); render(); return; }
  if(scheduleConflict(scheduleAnalystIds(s), rd.date, finalStart, finalEnd, s.id, false)){ showAlert('Conflito de horário.'); render(); return; }
  const oldStart = s.startTime, oldEnd = s.endTime;
  s.startTime = finalStart; s.endTime = finalEnd;
  if(s.cardId){ const c = getCard(s.cardId); if(c) addHistory(c, 'Horário ajustado de '+oldStart+'–'+oldEnd+' para '+finalStart+'–'+finalEnd); }
  render();
});

/* Card detail overlay */
function renderCardDetailOverlay(){
  const existing = document.getElementById('card-detail-overlay');
  if(existing) existing.remove();
  if(!ui.openCardId) return;
  const card = getCard(ui.openCardId);
  if(!card){ ui.openCardId=null; return; }
  const wrap = document.createElement('div');
  wrap.id = 'card-detail-overlay';
  wrap.className = 'overlay card-overlay';
  wrap.innerHTML = '<div class="modal wide">'+renderCardModalContent(card)+'</div>';
  document.body.appendChild(wrap);
}
const _origRender = render;
render = function(){
  _origRender();
  if(ui.openCardId){ renderCardDetailOverlay(); } else { const ex=document.getElementById('card-detail-overlay'); if(ex) ex.remove(); }
};

/* Initial paint */
currentUser = getStoredUser();
if(currentUser){ boot(); } else { document.getElementById('app').innerHTML = renderLoginScreen(); }
