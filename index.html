<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO — Painel de Implantação</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F4F7F9; --surface:#FFFFFF; --surface-2:#F7F9FB;
    --border:#DCE5EB; --ink:#17324D; --ink-soft:#627486; --ink-faint:#8A9AAA;
    --brand:#0B5C8E; --brand-dark:#073F63; --brand-soft:#E5F1F8;
    --gold:#F0A72F; --gold-soft:#FFF1D8; --danger:#C94B42; --danger-soft:#FCE7E5;
    --ok:#169B67; --ok-soft:#E2F5ED; --purple:#7B4B94;
    --shadow-1:0 2px 8px rgba(23,50,77,.06),0 1px 2px rgba(23,50,77,.04);
  }
  /* Fontes em clamp(mínimo, %-da-largura-da-tela, máximo): crescem numa TV
     grande (telas largas = mais vw) e ficam com um piso decente em telas
     menores, em vez de um tamanho fixo que fica minúsculo numa TV de 50". */
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:clamp(14px,1.05vw,19px);display:flex;flex-direction:column;}

  .topbar{background:var(--brand-dark);color:#fff;padding:clamp(8px,.8vw,14px) clamp(14px,1.4vw,26px);display:flex;align-items:center;gap:clamp(14px,1.4vw,26px);flex:0 0 auto;flex-wrap:wrap;}
  .topbar h1{margin:0;font-size:clamp(18px,1.7vw,28px);font-weight:800;letter-spacing:-.2px;white-space:nowrap;}
  .topbar .updated{font-size:clamp(11px,.9vw,15px);opacity:.8;margin-left:auto;white-space:nowrap;}
  .kpis{display:flex;gap:clamp(8px,.8vw,16px);flex:1;flex-wrap:nowrap;min-width:0;}
  .kpi{background:rgba(255,255,255,.08);border-radius:10px;padding:clamp(5px,.5vw,9px) clamp(12px,1.2vw,22px);min-width:0;flex:1 1 150px;}
  .kpi-label{font-size:clamp(11px,.9vw,15px);font-weight:800;text-transform:uppercase;letter-spacing:.3px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-value{font-size:clamp(26px,2.5vw,42px);font-weight:800;line-height:1.2;}

  .main{flex:1;display:flex;gap:clamp(8px,.8vw,14px);padding:clamp(8px,.8vw,14px);min-height:0;}
  .left-col{flex:1 1 74%;display:flex;flex-direction:column;gap:clamp(8px,.8vw,14px);min-height:0;min-width:0;}
  .charts-area{flex:1.3;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(8px,.8vw,14px);min-height:0;min-width:0;}
  .below-row{flex:1;display:flex;gap:clamp(8px,.8vw,14px);min-height:0;}
  .below-row .card{flex:1;min-width:0;}
  .agenda-panel{flex:0 0 clamp(280px,24vw,420px);max-width:460px;min-width:260px;display:flex;flex-direction:column;min-height:0;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);
        display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:clamp(9px,.9vw,16px) clamp(12px,1.2vw,20px);}
  .card h2{font-size:clamp(16px,1.35vw,23px);margin:0 0 1px;color:var(--brand-dark);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card p.desc{font-size:clamp(11px,.95vw,15px);color:var(--ink-faint);margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-body{flex:1;min-height:0;overflow-y:auto;}

  .empty{padding:clamp(10px,1vw,18px);text-align:center;color:var(--ink-faint);font-size:clamp(12px,1vw,16px);background:var(--surface-2);border-radius:8px;border:1px dashed var(--border);}

  .bar-row{display:grid;grid-template-columns:minmax(90px,26%) 1fr clamp(50px,5.5vw,72px);align-items:center;gap:clamp(6px,.6vw,12px);font-size:clamp(13px,1.1vw,18px);margin-bottom:clamp(4px,.5vw,8px);}
  .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px;}
  .bar-track{background:var(--surface-2);border-radius:999px;height:clamp(8px,.8vw,13px);overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;background:var(--brand);}
  .bar-value{text-align:right;font-weight:800;white-space:nowrap;font-size:clamp(12px,1.05vw,17px);}
  .neg{color:var(--danger);} .pos{color:var(--ok);}
  .dot{width:clamp(8px,.7vw,12px);height:clamp(8px,.7vw,12px);border-radius:50%;flex:0 0 auto;}

  .proj-row{padding:clamp(4px,.5vw,7px) 0;border-bottom:1px solid var(--border);}
  .proj-row:last-child{border-bottom:none;}
  .proj-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:clamp(13px,1.1vw,18px);margin-bottom:3px;}
  .proj-client{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .proj-bal{font-weight:800;white-space:nowrap;font-size:clamp(12px,1.05vw,17px);}
  .proj-bottom{display:flex;align-items:center;gap:8px;}
  .proj-bottom .bar-track{height:clamp(7px,.65vw,11px);}
  .proj-analyst{font-size:clamp(10.5px,.9vw,14px);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%;}

  .agenda-allday{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex:0 0 auto;}
  .agenda-allday-chip{font-size:clamp(12px,1vw,16px);font-weight:700;padding:3px 9px;border-radius:6px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-grid-wrap{position:relative;flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--border);}
  .cal-grid{position:relative;}
  .cal-hour-line{position:absolute;left:clamp(38px,3.2vw,54px);right:0;border-top:1px solid var(--border);}
  .cal-hour-label{position:absolute;left:0;top:-7px;width:clamp(34px,3vw,50px);font-size:clamp(11px,.9vw,15px);color:var(--ink-faint);text-align:right;padding-right:5px;}
  .cal-now-line{position:absolute;left:clamp(38px,3.2vw,54px);right:0;height:2px;background:var(--danger);z-index:5;}
  .cal-now-line::before{content:'';position:absolute;left:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--danger);}
  .cal-event{position:absolute;border-radius:6px;padding:3px 8px;overflow:hidden;font-size:clamp(12px,1.05vw,17px);line-height:1.3;box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:default;}
  .cal-event .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-event .c{opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10px,.9vw,14px);}
  .agenda-legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;font-size:clamp(11px,.9vw,15px);color:var(--ink-soft);flex:0 0 auto;}
  .agenda-legend span{display:inline-flex;align-items:center;gap:4px;}

  .analyst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:clamp(6px,.6vw,12px);}
  .analyst-card{border:1px solid var(--border);border-radius:9px;padding:clamp(7px,.7vw,12px) clamp(9px,.9vw,14px);border-left:4px solid var(--brand);background:var(--surface-2);min-width:0;overflow:hidden;}
  .analyst-card-head{display:flex;align-items:center;gap:6px;margin-bottom:5px;min-width:0;}
  .analyst-avatar{width:clamp(22px,2vw,32px);height:clamp(22px,2vw,32px);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(11px,1vw,15px);flex:0 0 auto;}
  .analyst-name{font-weight:700;font-size:clamp(13px,1.1vw,18px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .analyst-stats{display:flex;gap:clamp(6px,.7vw,14px);min-width:0;}
  .analyst-stats > div{min-width:0;overflow:hidden;}
  .analyst-stat-num{font-size:clamp(15px,1.35vw,21px);font-weight:800;color:var(--brand-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .analyst-stat-lbl{font-size:clamp(9px,.75vw,12px);color:var(--ink-faint);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .prazo-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(6px,.6vw,12px);height:100%;}
  .prazo-kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:clamp(7px,.7vw,12px) clamp(10px,1vw,16px);display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .prazo-kpi-label{font-size:clamp(11px,.9vw,14px);font-weight:800;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prazo-kpi-value{font-size:clamp(19px,1.7vw,28px);font-weight:800;color:var(--brand-dark);line-height:1.2;}
  .prazo-kpi-sub{font-size:clamp(11px,.9vw,14px);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  #loading, #error{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:clamp(14px,1.2vw,20px);}
  #error{color:var(--danger);display:none;}

  @media screen and (max-width:900px){
    html,body{overflow:auto;}
    .main{flex-direction:column;height:auto;}
    .charts-area{grid-template-columns:1fr;grid-template-rows:none;}
    .below-row{flex-direction:column;}
    .agenda-panel{max-width:none;flex:0 0 420px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>🗂️ NEO</h1>
  <div class="kpis" id="kpis"></div>
  <span class="updated" id="updated-at">Carregando…</span>
</div>

<div id="loading">Carregando dados…</div>
<div id="error"></div>
<div class="main" id="app" style="display:none;">
  <div class="left-col">
    <div class="charts-area" id="charts-area"></div>
    <div class="below-row">
      <div class="card">
        <h2>👤 Desempenho por analista</h2>
        <p class="desc">Sessões e horas concluídas neste mês</p>
        <div class="card-body" id="analyst-performance"></div>
      </div>
      <div class="card">
        <h2>⏱ Comercial → Início da implantação</h2>
        <p class="desc">Dias corridos até o início do projeto</p>
        <div class="card-body" id="prazo-kpis"></div>
      </div>
    </div>
  </div>
  <div class="agenda-panel">
    <div class="card" style="flex:1;">
      <h2>📅 Agenda do dia</h2>
      <p class="desc" id="agenda-date"></p>
      <div id="agenda-allday" class="agenda-allday"></div>
      <div class="cal-grid-wrap" id="cal-grid-wrap"><div class="cal-grid" id="cal-grid"></div></div>
      <div class="agenda-legend" id="agenda-legend"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pfabqqdhvacakszoklxh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0lFYSvX-C7n3Y1FVZ4RWvQ_8HVOCxQI';
const REFRESH_MS = 60000;
const EXCLUDE_ANALYST_NAMES = ['sabrina'];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function currentMonthRange(){
  const d = new Date();
  const start = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const end = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(lastDay).padStart(2,'0');
  return {start, end};
}
function dateInRange(iso, range){ return iso >= range.start && iso <= range.end; }
function timeToMin(t){ if(!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+m; }
function countWeekdaysBetweenISO(startIso, endIso){
  let count = 0; let cur = new Date(startIso+'T00:00:00'); const end = new Date(endIso+'T00:00:00');
  while(cur <= end){ if(cur.getDay()!==0 && cur.getDay()!==6) count++; cur.setDate(cur.getDate()+1); }
  return count;
}
function daysBetweenISO(a,b){
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);
}
function fmtDias(n){ return (Math.round(n*10)/10).toLocaleString('pt-BR')+(Math.abs(n)===1?' dia':' dias'); }
function minToHM(min){
  const sign = min<0?'-':''; min = Math.abs(Math.round(min));
  const h = Math.floor(min/60), m = min%60;
  return sign + (m ? h+'h'+String(m).padStart(2,'0') : h+'h');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function readableTextColor(hex){
  if(!hex) return '#fff';
  const h = hex.replace('#','');
  const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum > 0.6 ? '#17324D' : '#fff';
}

const FERIAS_TYPE_NAME = 'Férias';
const FERIAS_MIN_PER_WEEKDAY = 8*60+48;

function buildHelpers(state){
  function isFeriasType(name){ return !!(name && name.toLowerCase()===FERIAS_TYPE_NAME.toLowerCase()); }
  function isInternalType(name){ const t=(state.agendaTypes||[]).find(t=>t.name===name); return !!(t && t.isInternal); }
  function scheduleAnalystIds(s){ return s.analystIds && s.analystIds.length ? s.analystIds : (s.analystId?[s.analystId]:[]); }
  function scheduleDayCount(s){ if(!s.allDay) return 1; const a=new Date(s.date+'T00:00:00'), b=new Date((s.endDate||s.date)+'T00:00:00'); return Math.round((b-a)/86400000)+1; }
  function scheduleSpansDate(s, dateISO){ if(!s.allDay) return s.date===dateISO; const endD = s.endDate || s.date; return dateISO>=s.date && dateISO<=endD; }
  function scheduleMinutesPerAnalyst(s){
    if(s.allDay){
      if(isFeriasType(s.type)) return countWeekdaysBetweenISO(s.date, s.endDate||s.date) * FERIAS_MIN_PER_WEEKDAY;
      return 8*60*scheduleDayCount(s);
    }
    return timeToMin(s.endTime)-timeToMin(s.startTime);
  }
  function scheduleActualMinutes(s){ const per=scheduleMinutesPerAnalyst(s); const n=Math.max(1, scheduleAnalystIds(s).length); return per*n; }
  function cardUsedMinutes(card){
    return (state.schedules||[]).filter(s=>s.cardId===card.id && s.status==='concluida')
      .reduce((sum,s)=> sum + (s.deductMinutes!=null ? s.deductMinutes : scheduleActualMinutes(s)), 0);
  }
  function cardBalanceHours(card){ if(card.balanceForfeited) return 0; return (card.contractedHours||0) - cardUsedMinutes(card)/60; }
  return { isFeriasType, isInternalType, scheduleAnalystIds, scheduleSpansDate, scheduleMinutesPerAnalyst, scheduleActualMinutes, cardUsedMinutes, cardBalanceHours };
}

function byId(arr, id){ return (arr||[]).find(x=>x.id===id); }
function barList(items, colorFn){
  if(!items.length) return '<div class="empty">Nenhum dado no momento.</div>';
  const max = Math.max(1, ...items.map(i=>i.value));
  return items.map(i=>{
    const pct = Math.round((i.value/max)*100);
    return '<div class="bar-row"><div class="bar-label" title="'+esc(i.label)+'">'+(i.dot?'<span class="dot" style="background:'+i.dot+';"></span>':'')+esc(i.label)+'</div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+(colorFn?colorFn(i):'var(--brand)')+';"></div></div>'
      + '<div class="bar-value '+(i.valueClass||'')+'">'+esc(i.display!=null?i.display:i.value)+'</div></div>';
  }).join('');
}
function projectList(items){
  if(!items.length) return '<div class="empty">Nenhum projeto em andamento.</div>';
  return items.map(p=>{
    const barClass = p.pct>=90?'danger':(p.pct>=70?'gold':'brand');
    return '<div class="proj-row">'
      + '<div class="proj-top"><span class="proj-client" title="'+esc(p.client?p.client.name:'—')+'">'+esc(p.client?p.client.name:'—')+'</span>'
      + '<span class="proj-bal '+(p.bal<0?'neg':'pos')+'">'+minToHM(p.bal*60)+'</span></div>'
      + '<div class="proj-bottom">'
      +   '<div class="bar-track" style="flex:1;"><div class="bar-fill" style="width:'+p.pct+'%;background:var(--'+barClass+');"></div></div>'
      +   '<span class="proj-analyst">'+esc(p.analyst?p.analyst.name:'—')+'</span>'
      + '</div></div>';
  }).join('');
}

function layoutDayEvents(scheds){
  const items = scheds.map(s=>({ s, start:timeToMin(s.startTime), end:Math.max(timeToMin(s.endTime), timeToMin(s.startTime)+15) }))
    .sort((a,b)=> a.start-b.start || a.end-b.end);
  const clusters = [];
  let current = [], clusterEnd = -1;
  items.forEach(it=>{
    if(current.length && it.start >= clusterEnd){ clusters.push(current); current = []; }
    current.push(it);
    clusterEnd = Math.max(clusterEnd, it.end);
  });
  if(current.length) clusters.push(current);
  const result = [];
  clusters.forEach(cluster=>{
    const lanes = [];
    cluster.forEach(it=>{
      let laneIdx = lanes.findIndex(endT=> it.start >= endT);
      if(laneIdx===-1){ laneIdx = lanes.length; lanes.push(it.end); } else { lanes[laneIdx] = it.end; }
      it.lane = laneIdx;
    });
    const totalLanes = lanes.length;
    cluster.forEach(it=> result.push({sched:it.s, start:it.start, end:it.end, lane:it.lane, lanes:totalLanes}));
  });
  return result;
}

function renderDashboard(state){
  const H = buildHelpers(state);
  const clients = state.clients||[], analysts = state.analysts||[], boards = state.boards||[],
        cards = state.cards||[], schedules = state.schedules||[];
  const activeCards = cards.filter(c=>!c.isConcluded);
  const monthRange = currentMonthRange();
  const today = todayISO();

  const totalBalance = cards.reduce((s,c)=> s + H.cardBalanceHours(c), 0);
  const naoAbatidoByClient = {};
  schedules.forEach(s=>{
    if(s.status!=='concluida' || !H.isInternalType(s.type) || !s.clientId) return;
    const isUnlinked = !s.cardId, isZeroed = s.cardId && s.deductMinutes===0;
    if(!isUnlinked && !isZeroed) return;
    naoAbatidoByClient[s.clientId] = (naoAbatidoByClient[s.clientId]||0) + H.scheduleActualMinutes(s);
  });
  const totalNaoAbatido = Object.values(naoAbatidoByClient).reduce((s,v)=>s+v,0);

  document.getElementById('kpis').innerHTML =
      kpi('📁','Projetos em andamento', activeCards.length)
    + kpi('⏳','Saldo total disponível', minToHM(totalBalance*60), totalBalance<0)
    + kpi('⚑','Horas sem abatimento', minToHM(totalNaoAbatido));

  renderAgendaDoDia(state, H, today, clients, analysts);

  let chartsHtml = '';

  const projectItems = activeCards.map(c=>{
    const client = byId(clients, c.clientId);
    const board = boards.find(b=>b.id===c.boardId);
    const analyst = board ? byId(analysts, board.analystId) : null;
    const used = H.cardUsedMinutes(c)/60;
    const pct = c.contractedHours ? Math.min(100, Math.max(0,(used/c.contractedHours)*100)) : 0;
    const bal = H.cardBalanceHours(c);
    return {client, analyst, pct, bal};
  }).sort((a,b)=> b.pct-a.pct);
  chartsHtml += chartCard('📁','Projetos em andamento', projectItems.length+' no total', projectList(projectItems));

  const balRows = activeCards.map(c=>({client:byId(clients,c.clientId), bal:H.cardBalanceHours(c)}))
    .filter(r=>r.client).sort((a,b)=>a.bal-b.bal).slice(0,4)
    .map(r=>({label:r.client.name, value:Math.abs(r.bal), display:minToHM(r.bal*60), valueClass:r.bal<0?'neg':'pos'}));
  chartsHtml += chartCard('💰','Horas disponíveis dos clientes','Menor saldo primeiro', barList(balRows, i=>i.valueClass==='neg'?'var(--danger)':'var(--ok)'));

  const byType = {};
  schedules.filter(s=>s.status==='concluida' && dateInRange(s.date, monthRange)).forEach(s=>{
    byType[s.type] = (byType[s.type]||0) + H.scheduleActualMinutes(s);
  });
  const typeItems = Object.entries(byType).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([name,mins])=>({label:name, value:mins, display:minToHM(mins)}));
  chartsHtml += chartCard('🗓','Horas por tipo de agenda','Concluídas neste mês', barList(typeItems, ()=>'var(--gold)'));

  const naoAbatidoItems = Object.entries(naoAbatidoByClient).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(([clientId,mins])=>{ const cl=byId(clients,clientId); return {label:cl?cl.name:'—', value:mins, display:minToHM(mins)}; });
  chartsHtml += chartCard('⚑','Ranking sem abatimento','Horas internas não descontadas', barList(naoAbatidoItems, ()=>'var(--purple)'));

  document.getElementById('charts-area').innerHTML = chartsHtml;

  const perfAnalysts = analysts.filter(a=> !EXCLUDE_ANALYST_NAMES.some(n=> (a.name||'').trim().toLowerCase().includes(n)));
  if(!perfAnalysts.length){
    document.getElementById('analyst-performance').innerHTML = '<div class="empty">Nenhum analista para exibir.</div>';
  } else {
    const rows = perfAnalysts.map(a=>{
      const scheds = schedules.filter(s=> H.scheduleAnalystIds(s).includes(a.id) && s.status==='concluida' && dateInRange(s.date, monthRange));
      const totalMin = scheds.reduce((sum,s)=> sum + H.scheduleMinutesPerAnalyst(s), 0);
      const board = boards.find(b=>b.analystId===a.id);
      const cardCount = board ? cards.filter(c=>c.boardId===board.id).length : 0;
      return {a, sessions:scheds.length, totalMin, cardCount};
    }).sort((x,y)=> y.totalMin-x.totalMin);
    document.getElementById('analyst-performance').innerHTML = '<div class="analyst-grid">' + rows.map(({a,sessions,totalMin,cardCount})=>{
      return '<div class="analyst-card" style="border-left-color:'+(a.inactive?'#B9CAD5':a.color)+';">'
        + '<div class="analyst-card-head"><div class="analyst-avatar" style="background:'+(a.inactive?'#B9CAD5':a.color)+';">'+esc((a.name||'?').charAt(0).toUpperCase())+'</div>'
        + '<div class="analyst-name">'+esc(a.name)+'</div></div>'
        + '<div class="analyst-stats">'
        +   '<div><div class="analyst-stat-num">'+cardCount+'</div><div class="analyst-stat-lbl">Clientes</div></div>'
        +   '<div><div class="analyst-stat-num">'+sessions+'</div><div class="analyst-stat-lbl">Sessões</div></div>'
        +   '<div><div class="analyst-stat-num">'+minToHM(totalMin)+'</div><div class="analyst-stat-lbl">Horas</div></div>'
        + '</div></div>';
    }).join('') + '</div>';
  }

  const prazoRows = cards.filter(c=>c.commercialDate && c.startDate).map(c=>({
    c, client: byId(clients, c.clientId), days: daysBetweenISO(c.commercialDate, c.startDate)
  }));
  if(!prazoRows.length){
    document.getElementById('prazo-kpis').innerHTML = '<div class="empty">Nenhum card com as duas datas preenchidas.</div>';
  } else {
    const vals = prazoRows.map(r=>r.days).sort((a,b)=>a-b);
    const avg = vals.reduce((x,y)=>x+y,0)/vals.length;
    const mid = vals.length%2 ? vals[(vals.length-1)/2] : (vals[vals.length/2-1]+vals[vals.length/2])/2;
    const minR = prazoRows.reduce((m,r)=> r.days<m.days?r:m, prazoRows[0]);
    const maxR = prazoRows.reduce((m,r)=> r.days>m.days?r:m, prazoRows[0]);
    const nm = r=> r.client ? r.client.name : '—';
    document.getElementById('prazo-kpis').innerHTML = '<div class="prazo-kpis">'
      + prazoKpi('⏱','Média', fmtDias(avg), prazoRows.length+' card(s)')
      + prazoKpi('◎','Mediana', fmtDias(mid), '')
      + prazoKpi('⚡','+ rápido', fmtDias(minR.days), nm(minR))
      + prazoKpi('🐢','+ demorado', fmtDias(maxR.days), nm(maxR))
      + '</div>';
  }
}

function renderAgendaDoDia(state, H, today, clients, analysts){
  document.getElementById('agenda-date').textContent = fmtDateBR(today);
  const all = state.schedules.filter(s=> s.status!=='nao_realizada' && H.scheduleSpansDate(s, today));
  const allDayScheds = all.filter(s=>s.allDay);
  const timedScheds = all.filter(s=>!s.allDay);

  const alldayEl = document.getElementById('agenda-allday');
  if(!allDayScheds.length){ alldayEl.innerHTML = ''; }
  else {
    alldayEl.innerHTML = allDayScheds.map(s=>{
      const analyst = byId(analysts, H.scheduleAnalystIds(s)[0]);
      const color = analyst ? (analyst.inactive?'#B9CAD5':analyst.color) : 'var(--ink-faint)';
      const client = s.clientId ? byId(clients, s.clientId) : null;
      return '<div class="agenda-allday-chip" style="background:'+color+';">'+esc(s.type||'Dia todo')+(client?' · '+esc(client.name):'')+'</div>';
    }).join('');
  }

  const gridWrap = document.getElementById('cal-grid-wrap');
  const gridEl = document.getElementById('cal-grid');
  if(!timedScheds.length){
    gridEl.innerHTML = '<div class="empty" style="margin:10px;">Nenhuma agenda com horário para hoje.</div>';
    document.getElementById('agenda-legend').innerHTML = '';
    return;
  }

  const starts = timedScheds.map(s=>timeToMin(s.startTime));
  const ends = timedScheds.map(s=>Math.max(timeToMin(s.endTime), timeToMin(s.startTime)+15));
  const startHour = Math.max(0, Math.min(7, Math.floor(Math.min(...starts)/60)));
  const endHour = Math.max(20, Math.ceil(Math.max(...ends)/60));

  const wrapHeight = gridWrap.clientHeight || 500;
  const totalHours = Math.max(1, endHour-startHour);
  const pxPerHour = Math.max(30, Math.min(60, Math.floor(wrapHeight/totalHours)));
  const pxPerMin = pxPerHour/60;
  const gridHeight = totalHours*pxPerHour;
  gridEl.style.height = gridHeight+'px';

  let html = '';
  for(let h=startHour; h<=endHour; h++){
    const top = (h-startHour)*pxPerHour;
    html += '<div class="cal-hour-line" style="top:'+top+'px;"><span class="cal-hour-label" style="top:0;">'+String(h).padStart(2,'0')+':00</span></div>';
  }

  const laidOut = layoutDayEvents(timedScheds);
  const usedAnalysts = new Set();
  laidOut.forEach(item=>{
    const s = item.sched;
    const analystIds = H.scheduleAnalystIds(s);
    const analyst = byId(analysts, analystIds[0]);
    const color = analyst ? (analyst.inactive?'#B9CAD5':analyst.color) : '#8A9AAA';
    if(analyst) usedAnalysts.add(analyst.id);
    const textColor = readableTextColor(color);
    const client = s.clientId ? byId(clients, s.clientId) : null;
    const top = (item.start - startHour*60)*pxPerMin;
    const height = Math.max((item.end-item.start)*pxPerMin, 20);
    const widthPct = 100/item.lanes;
    const leftPct = item.lane*widthPct;
    html += '<div class="cal-event" style="top:'+top+'px;height:'+height+'px;left:calc(34px + ('+leftPct+'% * (100% - 34px)/100));width:calc('+widthPct+'% * (100% - 34px)/100 - 3px);background:'+color+';color:'+textColor+';" title="'+esc((s.startTime||'')+'–'+(s.endTime||'')+' · '+(client?client.name:s.type)+' · '+(analyst?analyst.name:''))+'">'
      + '<div class="t">'+esc(s.startTime||'')+' '+esc(client?client.name:(s.type||''))+'</div>'
      + (height>28 ? '<div class="c">'+esc(analyst?analyst.name:'')+'</div>' : '')
      + '</div>';
  });

  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  if(nowMin >= startHour*60 && nowMin <= endHour*60){
    html += '<div class="cal-now-line" style="top:'+((nowMin-startHour*60)*pxPerMin)+'px;"></div>';
  }

  gridEl.innerHTML = html;

  const legendItems = analysts.filter(a=>usedAnalysts.has(a.id));
  document.getElementById('agenda-legend').innerHTML = legendItems.map(a=>
    '<span><span class="dot" style="background:'+(a.inactive?'#B9CAD5':a.color)+';"></span>'+esc(a.name)+'</span>'
  ).join('');

  setTimeout(()=>{ gridWrap.scrollTop = Math.max(0, (Math.min(...starts)-startHour*60)*pxPerMin - 20); }, 0);
}

function kpi(icon, label, value, warn){
  return '<div class="kpi"><div class="kpi-label">'+icon+' '+esc(label)+'</div>'
    + '<div class="kpi-value" style="color:'+(warn?'#FFB4A8':'#fff')+';">'+esc(value)+'</div></div>';
}
function chartCard(icon, title, desc, bodyHtml){
  return '<div class="card"><h2>'+icon+' '+esc(title)+'</h2><p class="desc">'+esc(desc)+'</p><div class="card-body">'+bodyHtml+'</div></div>';
}
function prazoKpi(icon, label, value, sub){
  return '<div class="prazo-kpi"><div class="prazo-kpi-label">'+icon+' '+esc(label)+'</div><div class="prazo-kpi-value">'+esc(value)+'</div><div class="prazo-kpi-sub">'+esc(sub)+'</div></div>';
}

async function loadAndRender(){
  try{
    const { data, error } = await sb.from('app_state').select('data, updated_at').eq('id', 1).maybeSingle();
    if(error) throw error;
    if(!data || !data.data){ throw new Error('Nenhum dado encontrado na tabela app_state.'); }
    renderDashboard(data.data);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    const upd = data.updated_at ? new Date(data.updated_at) : new Date();
    document.getElementById('updated-at').textContent = upd.toLocaleTimeString('pt-BR') + ' · a cada 1 min';
  } catch(err){
    console.error(err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'flex';
    document.getElementById('error').textContent = 'Não foi possível carregar os dados: ' + (err.message || err);
  }
}

loadAndRender();
setInterval(loadAndRender, REFRESH_MS);
window.addEventListener('resize', ()=>{ if(document.getElementById('app').style.display!=='none') loadAndRender(); });
</script>
