    + '<select id="cal-category-filter" data-action="cal-category-filter">'
      + '<option value="all"'+(ui.calCategory==='all'?' selected':'')+'>Todas as categorias</option>'
      + '<option value="implantacao"'+(ui.calCategory==='implantacao'?' selected':'')+'>Implantação</option>'
      + '<option value="interna"'+(ui.calCategory==='interna'?' selected':'')+'>Interna</option>'
      + '<option value="servico"'+(ui.calCategory==='servico'?' selected':'')+'>Serviço</option>'
      + '</select>'
    + '<button class="btn btn-sm '+(isDayView?'btn-primary':'')+'" data-action="cal-mode" data-mode="day">Dia</button>'
    + '<button class="btn btn-sm '+(!isDayView?'btn-primary':'')+'" data-action="cal-mode" data-mode="week">Semana</button>'
    + '<button class="btn btn-sm" data-action="cal-nav" data-dir="-1">‹ '+(isDayView?'Dia anterior':'Semana anterior')+'</button>'
    + '<button class="btn btn-sm" data-action="cal-nav" data-dir="0">Hoje</button>'
    + '<button class="btn btn-sm" data-action="cal-nav" data-dir="1">'+(isDayView?'Próximo dia ›':'Próxima semana ›')+'</button>'
    + '<span class="grow"></span>'
    + '<button class="btn btn-primary" data-action="open-modal" data-modal="schedule-new">+ Novo agendamento</button>'
    + '</div>';

  function inCategory(s){
    if(ui.calCategory==='all') return true;
    if(ui.calCategory==='interna') return isInternalType(s.type);
    if(ui.calCategory==='servico') return isServicoType(s.type);
    return !isInternalType(s.type) && !isServicoType(s.type);
  }

  const days = [];
  const baseDay = isDayView ? ui.calStart : startOfWeekISO(ui.calStart);
  days.push(baseDay);
  if(!isDayView){ for(let i=1;i<7;i++) days.push(addDaysISO(baseDay, i)); }
  const numDays = days.length;

  const uniqueWeekSchedules = state.schedules.filter(s=>{
    const inAnyDay = days.some(d => scheduleSpansDate(s, d));
    if(!inAnyDay) return false;
    if(!inCategory(s)) return false;
    if(ui.calAnalyst==='all') return true;
    return scheduleAnalystIds(s).includes(ui.calAnalyst);
  });
  const {startHour, endHour} = calcCalTimeRange(uniqueWeekSchedules);
  const pxPerHour = 48;
  const pxPerMin = pxPerHour/60;
  const alldayHeight = 26;
  const gridHeight = (endHour-startHour)*pxPerHour;
  const today = todayISO();

  html += '<div class="cal-tg-outer" style="--cal-days:'+numDays+';"><div class="cal-tg-inner">';
  html += '<div class="cal-tg-headerrow"><div></div>';
  days.forEach(d=>{
    html += '<div class="cal-tg-daycol-head'+(d===today?' today':'')+'"><div class="wd">'+weekdayShort(d)+'</div><div class="dt">'+fmtDateBR(d).slice(0,5)+'</div></div>';
  });
  html += '</div>';

  let anyAllday = false;
  days.forEach(d=>{
    const raw = state.schedules.filter(s=>s.allDay && scheduleSpansDate(s, d) && inCategory(s) && (ui.calAnalyst==='all' || scheduleAnalystIds(s).includes(ui.calAnalyst)));
    if(raw.length) anyAllday = true;
  });
  if(anyAllday){
    html += '<div class="cal-tg-headerrow" style="background:var(--surface-2);"><div style="padding:6px 8px;font-size:10px;color:var(--ink-faint);font-weight:800;text-transform:uppercase;display:flex;align-items:center;">Dia todo</div>';
    days.forEach(d=>{
      const raw = state.schedules.filter(s=>s.allDay && scheduleSpansDate(s, d) && inCategory(s) && (ui.calAnalyst==='all' || scheduleAnalystIds(s).includes(ui.calAnalyst)));
      const entries = [];
      raw.forEach(s=>{
        if(ui.calAnalyst==='all'){
          const ids = scheduleAnalystIds(s);
          if(!ids.length) entries.push({ schedule:s, analystId:null });
          else ids.forEach(id => entries.push({ schedule:s, analystId:id }));
        } else {
          entries.push({ schedule:s, analystId: ui.calAnalyst });
        }
      });
      html += '<div style="min-height:'+alldayHeight+'px;border-left:1px solid var(--border);padding:3px 4px;display:flex;flex-direction:column;gap:3px;">';
      entries.forEach(entry=>{
        const s = entry.schedule;
        const color = scheduleColorForAnalyst(s, entry.analystId);
        const txt = readableTextColor(color);
        const due = scheduleIsDue(s);
        const title = scheduleDisplayTitle(s);
        const isContinuation = (s.date !== d);
        const isMulti = (s.endDate && s.endDate !== s.date);
        const cls = 'cal-tg-event allday'+(due?' due':'')+(isMulti?' multiday':'')+(isContinuation?' continuation':'');
        const arrow = isContinuation ? '↳ ' : '';
        const analyst = entry.analystId ? getAnalyst(entry.analystId) : null;
        const analystPrefix = analyst ? analyst.name+' · ' : '';
        const colorStyle = due ? 'background:var(--danger);color:#fff;border-left-color:var(--danger);' : 'background:'+color+';color:'+txt+';border-left-color:'+darkenColor(color,.25)+';';
        html += '<div class="'+cls+'" style="position:static;left:auto;width:auto;'+colorStyle+'" data-action="open-modal" data-modal="schedule-edit" data-id="'+s.id+'" title="'+esc(title+' · '+(analyst?analyst.name:'—')+' · '+scheduleDateText(s))+'">'
          + '<div class="t">'+arrow+esc(analystPrefix+title)+'</div>'
          + '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  html += '<div class="cal-tg-bodyscroll"><div class="cal-tg-bodyrow" style="height:'+gridHeight+'px;">';
  html += '<div class="cal-tg-hourlabels" style="height:'+gridHeight+'px;">';
  for(let h=startHour; h<=endHour; h++){ html += '<div class="cal-tg-hourlabel" style="top:'+((h-startHour)*pxPerHour)+'px;">'+String(h).padStart(2,'0')+':00</div>'; }
  html += '</div>';

  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();

  days.forEach(d=>{
    const rawScheds = state.schedules.filter(s=>!s.allDay && scheduleSpansDate(s, d) && inCategory(s) && (ui.calAnalyst==='all' || scheduleAnalystIds(s).includes(ui.calAnalyst)));
    const expandedScheds = [];
    rawScheds.forEach(s=>{
      const ids = scheduleAnalystIds(s);
      if(ui.calAnalyst==='all'){
        if(!ids.length){ expandedScheds.push(Object.assign({}, s, {__viewAnalystId:null})); }
        else { ids.forEach(anId=> expandedScheds.push(Object.assign({}, s, {__viewAnalystId: anId}))); }
      } else { expandedScheds.push(Object.assign({}, s, {__viewAnalystId: ui.calAnalyst})); }
    });
    const laidOut = layoutDayEvents(expandedScheds);
    html += '<div class="cal-tg-daycol" data-action="cal-grid-click" data-date="'+d+'" data-start-hour="'+startHour+'" data-px-per-hour="'+pxPerHour+'" style="height:'+gridHeight+'px;--hour-px:'+pxPerHour+'px;">';
    laidOut.forEach(item=>{
      const s = item.sched;
      const due = scheduleIsDue(s);
      const top = (item.start - startHour*60)*pxPerMin;
      const height = Math.max((item.end-item.start)*pxPerMin, 20);
      const widthPct = 100/item.lanes;
      const leftPct = item.lane*widthPct;
      const viewAnalystId = s.__viewAnalystId || null;
      const color = scheduleColorForAnalyst(s, viewAnalystId);
      const txt = readableTextColor(color);
      const draggable = s.status==='pendente';
      const title = scheduleDisplayTitle(s);
      const analyst = viewAnalystId ? getAnalyst(viewAnalystId) : null;
      const colorStyle = due ? 'background:var(--danger);color:#fff;border-left-color:#8a2018;' : 'background:'+color+';color:'+txt+';border-left-color:'+darkenColor(color,.25)+';';
      html += '<div class="cal-tg-event" draggable="'+(draggable?'true':'false')+'" data-draggable="'+(draggable?'1':'0')+'" data-sched-id="'+s.id+'" style="top:'+top+'px;height:'+height+'px;left:'+leftPct+'%;width:calc('+widthPct+'% - 4px);'+colorStyle+'" data-action="open-modal" data-modal="schedule-edit" data-id="'+s.id+'" title="'+esc(title+' · '+(analyst?analyst.name:'—')+' · '+s.startTime+'–'+s.endTime)+'">'
        + (draggable ? '<div class="resize-handle top" draggable="false" data-edge="top" data-id="'+s.id+'"></div>' : '')
        + '<div class="t">'+s.startTime+' '+esc(title)+'</div>'
        + (height>34? '<div class="s">'+esc(analyst?analyst.name:scheduleAnalystNames(s))+'</div>' : '')
        + (draggable ? '<div class="resize-handle bottom" draggable="false" data-edge="bottom" data-id="'+s.id+'"></div>' : '')
        + '</div>';
    });
    if(d===today && nowMin>=startHour*60 && nowMin<=endHour*60){ html += '<div class="cal-tg-now" style="top:'+((nowMin-startHour*60)*pxPerMin)+'px;"></div>'; }
    html += '</div>';
  });
  html += '</div></div>';

  html += '<div class="cal-tg-footerrow">';
  html += '<div class="cal-tg-footer-label">Carga do dia</div>';
  const relevantAnalysts = ui.calAnalyst==='all' ? state.analysts.filter(a=>!a.inactive) : [getAnalyst(ui.calAnalyst)].filter(Boolean);
  days.forEach(d=>{
    html += '<div class="cal-tg-footer-day">';
    let any = false;
    relevantAnalysts.forEach(a=>{
      const minutes = analystMinutesOnDay(d, a.id, inCategory);
      if(minutes<=0) return;
      any = true;
      const pct = Math.round((minutes/FERIAS_MIN_PER_WEEKDAY)*100);
      const color = workloadStatusColor(minutes);
      html += '<div class="wl-bar" style="background:'+color+';" title="'+esc(a.name)+': '+minToHM(minutes)+' ('+pct+'% de 8h48)">'
        + (ui.calAnalyst==='all' ? '<span class="wl-dot" style="background:'+a.color+';"></span>' : '')
        + '<span class="wl-pct">'+pct+'%</span></div>';
    });
    if(!any) html += '<span class="hint" style="font-size:9.5px;">—</span>';
    html += '</div>';
  });
  html += '</div>';

  html += '</div></div>';
  html += '<p class="hint" style="margin-top:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">'
    + '<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);margin-right:5px;"></span>abaixo de 7h</span>'
    + '<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:5px;"></span>de 7h a 8h48</span>'
    + '<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#1B1F23;margin-right:5px;"></span>acima de 8h48</span>'
    + '</p>';
  return html;
}

/* ============================= REPORTS VIEW ============================= */
function renderReportsView(){
  const today = new Date();
  const dataGeracao = today.toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});

  const allCards = state.cards;
  const totalContratadas = allCards.reduce((s,c)=> s + (c.contractedHours||0), 0);
  const totalUsadas = allCards.reduce((s,c)=> s + cardUsedMinutes(c)/60, 0);
  const saldoTotal = totalContratadas - totalUsadas;
  const clientesAtivos = new Set(allCards.map(c=>c.clientId)).size;
  const cardsConcluidos = allCards.filter(c=>c.isConcluded).length;
  const pendentes = pendingConfirmations(null).length;
  const usoPct = totalContratadas ? Math.min(100, (totalUsadas/totalContratadas)*100) : 0;

  let html = '';

  html += '<div class="report-header">'
    + '<div class="report-header-left">'
    +   '<div class="report-eyebrow">Painel Gerencial</div>'
    +   '<h1 class="report-title">Relatórios de Implantação</h1>'
    +   '<p class="report-subtitle">Visão consolidada das implantações, horas e treinamentos · Atualizado em '+dataGeracao+'</p>'
    + '</div>'
    + '<div class="report-header-right">'
    +   '<div class="report-header-badge">📊 '+allCards.length+' cards no total</div>'
    + '</div>'
    + '</div>';

  html += '<div class="kpi-grid">';
  html += kpiCard('👥','Clientes ativos', clientesAtivos, 'em implantação', 'var(--brand)');
  html += kpiCard('⏱','Horas contratadas', totalContratadas.toFixed(1)+'h', usoPct.toFixed(0)+'% utilizado', 'var(--brand)');
  html += kpiCard('✅','Horas usadas', minToHM(totalUsadas*60), 'em '+cardsConcluidos+' concluídos', 'var(--gold)');
  html += kpiCard('💰','Saldo disponível', minToHM(saldoTotal*60), saldoTotal < 0 ? 'atenção: saldo negativo' : 'dentro do contratado', saldoTotal < 0 ? 'var(--danger)' : 'var(--ok)');
  html += kpiCard('🔔','Confirmações pendentes', pendentes, pendentes ? 'requer atenção' : 'tudo em dia', pendentes ? 'var(--danger)' : 'var(--ok)');
  html += '</div>';

  const REPORT_TABS = [
    {k:'saldo', l:'💼 Saldo de horas'},
    {k:'internas', l:'⚑ Horas internas não abatidas'},
    {k:'modulos', l:'🎓 Módulos treinados'},
    {k:'analistas', l:'👤 Desempenho por analista'},
    {k:'distribuicao', l:'🔗 Analista × Clientes'},
    {k:'prazo', l:'⏱ Comercial → Início'}
  ];
  if(!REPORT_TABS.some(t=>t.k===ui.reportsTab)) ui.reportsTab = REPORT_TABS[0].k;
  html += '<div class="settings-tabs">';
  REPORT_TABS.forEach(t=>{ html += '<button class="btn btn-sm'+(ui.reportsTab===t.k?' btn-primary':'')+'" data-action="reports-tab" data-tab="'+t.k+'">'+t.l+'</button>'; });
  html += '</div>';

  const dateRange = getReportsDateRange();
  const dateFilterApplies = ['internas','modulos','analistas'].includes(ui.reportsTab);
  const clientFilterApplies = ['saldo','internas','modulos'].includes(ui.reportsTab);
  if(clientFilterApplies && !state.clients.some(cl=>cl.id===ui.reportsClientFilter)) ui.reportsClientFilter = 'all';
  html += '<div class="cal-toolbar" style="margin-bottom:16px;">'
    + '<span class="hint" style="margin:0;">Período:</span>'
    + '<input type="date" id="reports-date-start" value="'+esc(dateRange.start)+'" style="max-width:160px;">'
    + '<span class="hint" style="margin:0;">até</span>'
    + '<input type="date" id="reports-date-end" value="'+esc(dateRange.end)+'" style="max-width:160px;">'
    + '<button class="btn btn-sm btn-ghost" data-action="reports-date-this-month">Mês atual</button>'
    + (dateFilterApplies ? '' : '<span class="hint" style="margin:0;">— esta guia mostra o total geral, não é afetada pelo período</span>')
    + (clientFilterApplies ? ('<span class="hint" style="margin:0;">Cliente:</span>'+renderReportsClientPicker()) : '')
    + '</div>';

  const rows = [];
  allCards.forEach(c=>{
    const client=getClient(c.clientId), board=getBoard(c.boardId), analyst=board?getAnalyst(board.analystId):null;
    const used = cardUsedMinutes(c)/60, bal = cardBalanceHours(c);
    const pct = c.contractedHours ? Math.min(100, Math.max(0,(used/c.contractedHours)*100)) : 0;
    rows.push({ client, analyst, used, bal, contracted: c.contractedHours, pct, concluded: c.isConcluded });
  });
  state.clients.forEach(cl=>{
    if(state.cards.some(c=>c.clientId===cl.id)) return;
    const minutes = unlinkedInternalMinutesForClient(cl.id);
    if(minutes <= 0) return;
    rows.push({ client: cl, analyst: null, used: 0, bal: 0, contracted: 0, naoAbatido: minutes, onlyInternal:true, pct: 0 });
  });
  const naoAbatidoByClient = {};
  state.clients.forEach(cl=>{ naoAbatidoByClient[cl.id] = unlinkedInternalMinutesForClient(cl.id) + clientZeroedInternalMinutes(cl.id); });
  rows.forEach(r=>{
    if(r.client && naoAbatidoByClient[r.client.id] && !r.naoAbatido){ r.naoAbatido = naoAbatidoByClient[r.client.id]; }
  });

  if(ui.reportsTab==='saldo'){
  const rowsForSaldo = ui.reportsClientFilter==='all' ? rows : rows.filter(r=> r.client && r.client.id===ui.reportsClientFilter);
  html += '<div class="report-section">';
  html += '<div class="report-section-head">'
    + '<div class="report-section-icon" style="background:var(--brand-soft);color:var(--brand);">💼</div>'
    + '<div style="flex:1;">'
    +   '<h2 class="report-section-title">Saldo de horas por cliente</h2>'
    +   '<p class="report-section-desc">Saldo consolidado de todos os cards. Férias contam apenas dias úteis (8h48/dia).</p>'
    + '</div>'
    + '</div>';
  if(!rowsForSaldo.length){
    html += '<div class="report-empty">Nenhum cliente em implantação ainda.</div>';
  } else {
    const saldoSort = getTableSort('saldo', 'client', 'asc');
    const saldoAccessor = (r,key)=>{
      switch(key){
        case 'client': return r.client?r.client.name:'';
        case 'analyst': return r.analyst?r.analyst.name:'';
        case 'contracted': return r.onlyInternal? -Infinity : r.contracted;
        case 'used': return r.onlyInternal? -Infinity : r.used;
        case 'pct': return r.onlyInternal? -Infinity : r.pct;
        case 'bal': return r.onlyInternal? -Infinity : r.bal;
        case 'naoAbatido': return r.naoAbatido||0;
        default: return '';
      }
    };
    const sortedSaldoRows = sortRowsBy(rowsForSaldo, saldoSort, saldoAccessor);
    html += '<div class="report-table-wrap"><table class="report-table">'
      + '<thead><tr>'
      + sortableTh('saldo','client','Cliente',saldoSort)
      + sortableTh('saldo','analyst','Analista',saldoSort)
      + sortableTh('saldo','contracted','Contratadas',saldoSort,' class="num"')
      + sortableTh('saldo','used','Usadas',saldoSort,' class="num"')
      + sortableTh('saldo','pct','Progresso',saldoSort)
      + sortableTh('saldo','bal','Saldo',saldoSort,' class="num"')
      + sortableTh('saldo','naoAbatido','Não abatido',saldoSort,' class="num"')
      + '</tr></thead><tbody>';
    sortedSaldoRows.forEach(r=>{
      const naoAbatidoTxt = r.naoAbatido > 0 ? '<span class="report-tag gold">'+minToHM(r.naoAbatido)+'</span>' : '<span style="color:var(--ink-faint);">—</span>';
      const balClass = r.bal < 0 ? 'neg' : 'pos';
      const barClass = r.pct >= 90 ? 'danger' : (r.pct >= 70 ? 'warn' : '');
      html += '<tr>'
        + '<td><div class="report-client-cell">'
        +   '<span class="report-client-dot" style="background:'+(r.analyst?r.analyst.color:'var(--ink-faint)')+'"></span>'
        +   '<div><div class="report-client-name">'+esc(r.client?r.client.name:'—')+'</div>'
        +   (r.concluded ? '<span class="report-tag ok">Concluído</span>' : (r.onlyInternal ? '<span class="report-tag gold">Só interna</span>' : '<span class="report-tag info">Em andamento</span>'))
        +   '</div></div></td>'
        + '<td>'+(r.analyst ? esc(r.analyst.name) : '<span style="color:var(--ink-faint);">—</span>')+'</td>'
        + '<td class="num">'+(r.onlyInternal? '—' : (r.contracted+'h'))+'</td>'
        + '<td class="num">'+(r.onlyInternal? '—' : minToHM(r.used*60))+'</td>'
        + '<td>'+(r.onlyInternal ? '<span style="color:var(--ink-faint);">—</span>' :
            '<div class="report-progress"><div class="report-progress-bar '+barClass+'" style="width:'+r.pct+'%"></div></div>'
            +'<div class="report-progress-label">'+r.pct.toFixed(0)+'%</div>')+'</td>'
        + '<td class="num">'+(r.onlyInternal? '—' : '<span class="report-balance '+balClass+'">'+minToHM(r.bal*60)+'</span>')+'</td>'
        + '<td class="num">'+naoAbatidoTxt+'</td>'
        + '</tr>';
    });
    const totalBalAll = sortedSaldoRows.reduce((s,r)=> s + (r.onlyInternal?0:r.bal), 0);
    const totalNaoAbatidoAll = sortedSaldoRows.reduce((s,r)=> s + (r.naoAbatido||0), 0);
    html += '<tfoot><tr style="font-weight:800;background:var(--surface-2);">'
      + '<td colspan="5" style="text-align:right;">Total (saldo de todos os cards acima, inclusive concluídos):</td>'
      + '<td class="num"><span style="color:'+(totalBalAll<0?'var(--danger)':'var(--ok)')+';">'+minToHM(totalBalAll*60)+'</span></td>'
      + '<td class="num">'+(totalNaoAbatidoAll>0? minToHM(totalNaoAbatidoAll) : '—')+'</td>'
      + '</tr></tfoot>';
    html += '</tbody></table></div>';
  }
  html += '</div>';
  }

  if(ui.reportsTab==='internas'){
  const allUnlinked = state.schedules
    .filter(s=> isInternalType(s.type) && s.clientId && !s.cardId && s.status==='concluida' && dateInRange(s.date, dateRange) && (ui.reportsClientFilter==='all' || s.clientId===ui.reportsClientFilter))
    .sort((a,b)=> (b.date+(b.startTime||'')).localeCompare(a.date+(a.startTime||'')));
  if(allUnlinked.length){
    const totalInterno = allUnlinked.reduce((s,x)=> s + scheduleMinutes(x), 0);
    html += '<div class="report-section">';
    html += '<div class="report-section-head">'
      + '<div class="report-section-icon" style="background:var(--gold-soft);color:var(--gold);">⚑</div>'
      + '<div style="flex:1;">'
      +   '<h2 class="report-section-title">Horas internas não abatidas</h2>'
      +   '<p class="report-section-desc">Agendas internas concluídas vinculadas a clientes, mas sem card correspondente. Total: <strong>'+minToHM(totalInterno)+'</strong>.</p>'
      + '</div>'
      + '</div>';
    html += '<div class="report-table-wrap"><table class="report-table">';
    const internasSort = getTableSort('internas', 'date', 'desc');
    const internasAccessor = (s,key)=>{
      switch(key){
        case 'date': return s.date+(s.startTime||'');
        case 'client': { const cl=getClient(s.clientId); return cl?cl.name:''; }
        case 'analyst': return scheduleAnalystNames(s);
        case 'type': return s.type||'';
        case 'duration': return scheduleMinutes(s);
        default: return '';
      }
    };
    const sortedUnlinked = sortRowsBy(allUnlinked, internasSort, internasAccessor);
    html += '<thead><tr>'
      + sortableTh('internas','date','Data',internasSort)
      + sortableTh('internas','client','Cliente',internasSort)
      + sortableTh('internas','analyst','Analista',internasSort)
      + '<th>Horário</th>'
      + sortableTh('internas','type','Tipo',internasSort)
      + sortableTh('internas','duration','Duração',internasSort,' class="num"')
      + '</tr></thead><tbody>';
    sortedUnlinked.forEach(s=>{
      const cl = getClient(s.clientId);
      const dur = scheduleMinutes(s);
      html += '<tr>'
        + '<td>'+scheduleDateText(s)+'</td>'
        + '<td><strong>'+esc(cl?cl.name:'—')+'</strong></td>'
        + '<td>'+esc(scheduleAnalystNames(s))+'</td>'
        + '<td>'+(s.allDay?'Dia todo':s.startTime+'–'+s.endTime)+'</td>'
        + '<td><span class="report-tag gold">'+esc(s.type)+'</span></td>'
        + '<td class="num"><span class="report-tag gold">'+minToHM(dur)+'</span></td>'
        + '</tr>';
    });
    html += '</tbody></table></div></div>';
  } else {
    html += '<div class="report-section"><div class="report-section-head">'
      + '<div class="report-section-icon" style="background:var(--gold-soft);color:var(--gold);">⚑</div>'
      + '<div style="flex:1;"><h2 class="report-section-title">Horas internas não abatidas</h2>'
      +   '<p class="report-section-desc">Agendas internas concluídas vinculadas a clientes, mas sem card correspondente.</p></div></div>'
      + '<div class="report-empty">Nenhuma hora interna pendente de vínculo no período selecionado.</div></div>';
  }
  }

  if(ui.reportsTab==='modulos'){
  html += '<div class="report-section">';
  html += '<div class="report-section-head">'
    + '<div class="report-section-icon" style="background:#E7F5EE;color:var(--ok);">🎓</div>'
    + '<div style="flex:1;">'
    +   '<h2 class="report-section-title">Módulos treinados por cliente</h2>'
    +   '<p class="report-section-desc">Módulos, telas e usuários efetivamente treinados em agendas concluídas no período selecionado.</p>'
    + '</div>'
    + '</div>';
  const trainedRows = [];
  state.cards.forEach(c=>{
    if(ui.reportsClientFilter!=='all' && c.clientId!==ui.reportsClientFilter) return;
    const trains = state.schedules.filter(s=> s.cardId===c.id && s.status==='concluida' && dateInRange(s.date, dateRange));
    const mods = new Set(), screens = new Set(), users = new Set();
    trains.forEach(s=>{
      (s.modules||[]).forEach(m=> mods.add(m));
      (s.trainedScreens||[]).forEach(sc=> screens.add(sc));
      if(s.type==='Treinamento'){ (s.trainedUsers||'').split(',').map(u=>u.trim()).filter(Boolean).forEach(u=>users.add(u)); }
    });
    if(mods.size || screens.size || users.size){
      trainedRows.push({client: getClient(c.clientId), modules:[...mods], screens:[...screens], users:[...users]});
    }
  });
  if(!trainedRows.length){
    html += '<div class="report-empty">Nenhum treinamento concluído registrado ainda.</div>';
  } else {
    const modulosSort = getTableSort('modulos', 'client', 'asc');
    const modulosAccessor = (r,key)=>{
      switch(key){
        case 'client': return r.client?r.client.name:'';
        case 'modules': return r.modules.length;
        case 'screens': return r.screens.length;
        case 'users': return r.users.length;
        default: return '';
      }
    };
    const sortedTrainedRows = sortRowsBy(trainedRows, modulosSort, modulosAccessor);
    html += '<div class="report-table-wrap"><table class="report-table">'
      + '<thead><tr>'
      + sortableTh('modulos','client','Cliente',modulosSort)
      + sortableTh('modulos','modules','Módulos treinados',modulosSort)
      + sortableTh('modulos','screens','Telas treinadas',modulosSort)
      + sortableTh('modulos','users','Usuários treinados',modulosSort)
      + '</tr></thead><tbody>';
    sortedTrainedRows.forEach(r=>{
      html += '<tr>'
        + '<td><strong>'+esc(r.client?r.client.name:'—')+'</strong></td>'
        + '<td>'+([...r.modules].map(m=>'<span class="report-tag brand">'+esc(m)+'</span>').join(' ')||'<span style="color:var(--ink-faint);">—</span>')+'</td>'
        + '<td>'+([...r.screens].map(s=>'<span class="report-tag info">'+esc(s)+'</span>').join(' ')||'<span style="color:var(--ink-faint);">—</span>')+'</td>'
        + '<td>'+([...r.users].map(u=>'<span class="report-tag">'+esc(u)+'</span>').join(' ')||'<span style="color:var(--ink-faint);">—</span>')+'</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  }

  if(ui.reportsTab==='analistas'){
  html += '<div class="report-section">';
  html += '<div class="report-section-head">'
    + '<div class="report-section-icon" style="background:var(--brand-soft);color:var(--brand);">👤</div>'
    + '<div style="flex:1;">'
    +   '<h2 class="report-section-title">Desempenho por analista</h2>'
    +   '<p class="report-section-desc">Sessões concluídas e total de horas realizadas por cada analista no período selecionado.</p>'
    + '</div>'
    + '</div>';
  if(!state.analysts.length){
    html += '<div class="report-empty">Nenhum analista cadastrado.</div>';
  } else {
    const analistasSort = getTableSort('analistas-cards', 'name', 'asc');
    const analystRows = state.analysts.map(a=>{
      const scheds = schedulesForAnalyst(a.id).filter(s=>s.status==='concluida' && dateInRange(s.date, dateRange));
      const totalMin = scheds.reduce((sum,s)=> sum + scheduleMinutesPerAnalyst(s), 0);
      const board = boardOfAnalyst(a.id);
      const cardCount = board ? cardsInBoard(board.id).length : 0;
      return {a, scheds, totalMin, cardCount};
    });
    const analistasAccessor = (r,key)=>{
      switch(key){
        case 'name': return r.a.name;
        case 'cardCount': return r.cardCount;
        case 'sessions': return r.scheds.length;
        case 'hours': return r.totalMin;
        default: return '';
      }
    };
    const sortedAnalystRows = sortRowsBy(analystRows, analistasSort, analistasAccessor);
    const sortOptLabel = {name:'Nome', cardCount:'Clientes', sessions:'Sessões', hours:'Horas'};
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">'
      + '<span class="hint" style="margin:0;">Ordenar por:</span>';
    Object.keys(sortOptLabel).forEach(k=>{
      const active = analistasSort.key===k;
      const arrow = active ? (analistasSort.dir==='asc'?' ▲':' ▼') : '';
      html += '<button class="btn btn-sm'+(active?' btn-primary':'')+'" data-action="sort-table" data-table="analistas-cards" data-key="'+k+'">'+sortOptLabel[k]+arrow+'</button>';
    });
    html += '</div>';
    html += '<div class="analyst-grid">';
    sortedAnalystRows.forEach(({a, scheds, totalMin, cardCount})=>{
      html += '<div class="analyst-card'+(a.inactive?' inactive':'')+'" style="border-left-color:'+a.color+';">'
        + '<div class="analyst-card-head">'
        +   '<div class="analyst-avatar" style="background:'+(a.inactive?'#B9CAD5':a.color)+'">'+(a.photo?'<img src="'+esc(a.photo)+'" alt="">':esc(a.name.charAt(0).toUpperCase()))+'</div>'
        +   '<div style="flex:1;min-width:0;">'
        +     '<div class="analyst-card-name">'+esc(a.name)+(a.isAdmin?' <span class="report-tag gold">ADMIN</span>':'')+'</div>'
        +     (a.inactive ? '<span class="report-tag">Inativo</span>' : '<span class="report-tag ok">Ativo</span>')
        +   '</div>'
        + '</div>'
        + '<div class="analyst-card-stats">'
        +   '<div><div class="analyst-stat-num">'+cardCount+'</div><div class="analyst-stat-lbl">Clientes</div></div>'
        +   '<div><div class="analyst-stat-num">'+scheds.length+'</div><div class="analyst-stat-lbl">Sessões</div></div>'
        +   '<div><div class="analyst-stat-num">'+minToHM(totalMin)+'</div><div class="analyst-stat-lbl">Horas</div></div>'
        + '</div>'
        + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  }

  if(ui.reportsTab==='prazo'){ html += renderPrazoReport(); }

  if(ui.reportsTab==='distribuicao'){
  html += '<div class="report-section">';
  html += '<div class="report-section-head">'
    + '<div class="report-section-icon" style="background:#EDE7F6;color:#7B4B94;">🔗</div>'
    + '<div style="flex:1;">'
    +   '<h2 class="report-section-title">Distribuição Analista × Clientes</h2>'
    +   '<p class="report-section-desc">Em qual estágio cada cliente está no quadro do analista responsável.</p>'
    + '</div>'
    + '</div>';
  if(!state.analysts.length){
    html += '<div class="report-empty">Nenhum analista cadastrado.</div>';
  } else {
    const distSort = getTableSort('distribuicao', 'analyst', 'asc');
    const distRows = state.analysts.map(a=>{
      const board = boardOfAnalyst(a.id);
      const cards = board ? cardsInBoard(board.id) : [];
      return {a, board, cards};
    });
    const distAccessor = (r,key)=>{
      switch(key){
        case 'analyst': return r.a.name;
        case 'count': return r.cards.length;
        default: return '';
      }
    };
    const sortedDistRows = sortRowsBy(distRows, distSort, distAccessor);
    html += '<div class="report-table-wrap"><table class="report-table">'
      + '<thead><tr>'
      + sortableTh('distribuicao','analyst','Analista',distSort)
      + sortableTh('distribuicao','count','Clientes em implantação',distSort)
      + '</tr></thead><tbody>';
    sortedDistRows.forEach(({a, board, cards})=>{
      const names = cards.map(c=>{
        const cl=getClient(c.clientId); const list = board.lists.find(l=>l.id===c.listId);
        return '<div style="margin:3px 0;"><strong>'+esc(cl?cl.name:'—')+'</strong> <span class="report-tag info">'+esc(list?list.name:'')+'</span></div>';
      });
      html += '<tr'+(a.inactive?' style="opacity:.55;"':'')+'>'
        + '<td><div class="report-client-cell">'
        +   '<div class="analyst-avatar sm" style="background:'+(a.inactive?'#B9CAD5':a.color)+'">'+(a.photo?'<img src="'+esc(a.photo)+'" alt="">':esc(a.name.charAt(0).toUpperCase()))+'</div>'
        +   '<div><div class="report-client-name">'+esc(a.name)+'</div>'
        +   (a.inactive ? '<span class="report-tag">Inativo</span>' : '<span class="report-tag ok">Ativo</span>')
        +   '</div></div></td>'
        + '<td>'+(names.length? names.join('') : '<span style="color:var(--ink-faint);">Nenhum</span>')+'</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  }

  return html;
}

function kpiCard(icon, label, value, sub, accent){
  return '<div class="kpi-card" style="--kpi-accent:'+accent+';">'
    + '<div class="kpi-icon">'+icon+'</div>'
    + '<div class="kpi-body">'
    +   '<div class="kpi-label">'+esc(label)+'</div>'
    +   '<div class="kpi-value">'+esc(value)+'</div>'
    +   '<div class="kpi-sub">'+esc(sub)+'</div>'
    + '</div>'
    + '</div>';
}

/* ============================= CLIENTS VIEW ============================= */
function renderClientsView(){
  let html = '<div class="cal-toolbar" style="margin-bottom:14px;">'
    + '<div class="search-box" style="min-width:260px;"><span>🔎</span><input id="client-search-input" placeholder="Buscar por nome, código, razão social ou CNPJ..." value="'+esc(ui.clientSearch)+'"></div>'
    + '<span class="grow"></span>'
    + '<input type="file" id="import-clients-file" accept=".xlsx,.xls,.csv" style="display:none;">'
    + '<button class="btn btn-sm btn-ghost" data-action="download-client-template">Baixar modelo</button>'
    + '<button class="btn btn-sm" data-action="import-clients-trigger">📥 Importar Excel</button>'
    + '</div>';
  const q = ui.clientSearch.trim().toLowerCase();
  let clients = state.clients;
  if(q){ clients = clients.filter(cl=> clientMatchesQuery(cl, q)); }

  const clientRowData = clients.map(cl=>{
    const cardCount = state.cards.filter(c=>c.clientId===cl.id).length;
    const balHours = clientConsolidatedBalanceHours(cl.id);
    const accountant = cl.accountantId ? getClient(cl.accountantId) : null;
    return { cl, cardCount, balHours, accountant };
  });
  const csort = getTableSort('clients', 'name', 'asc');
  const clientAccessor = (row, key)=>{
    switch(key){
      case 'code': return row.cl.code||'';
      case 'name': return row.cl.name||'';
      case 'companyName': return row.cl.companyName||'';
      case 'cnpj': return row.cl.cnpj||'';
      case 'clientType': return row.cl.clientType||'novo';
      case 'accountant': return row.accountant ? row.accountant.name : '';
      case 'balance': return row.cardCount ? row.balHours : -Infinity;
      case 'city': return row.cl.city||'';
      case 'uf': return row.cl.uf||'';
      case 'cep': return row.cl.cep||'';
      case 'contact': return row.cl.contact||'';
      case 'cardCount': return row.cardCount;
      default: return '';
    }
  };
  const sortedRows = sortRowsBy(clientRowData, csort, clientAccessor);

  html += '<div class="section-card" style="overflow-x:auto;"><table><thead><tr>'
    + sortableTh('clients','code','Código',csort)
    + sortableTh('clients','name','Nome fantasia',csort)
    + sortableTh('clients','companyName','Razão social',csort)
    + sortableTh('clients','cnpj','CNPJ',csort)
    + sortableTh('clients','clientType','Tipo',csort)
    + sortableTh('clients','accountant','Contador',csort)
    + sortableTh('clients','balance','Saldo consolidado',csort)
    + sortableTh('clients','city','Cidade',csort)
    + sortableTh('clients','uf','UF',csort)
    + sortableTh('clients','cep','CEP',csort)
    + sortableTh('clients','contact','Contato',csort)
    + sortableTh('clients','cardCount','Cards',csort)
    + '<th></th></tr></thead><tbody>';
  if(!sortedRows.length) html += '<tr><td colspan="13" class="hint">Nenhum cliente encontrado.</td></tr>';
  sortedRows.forEach(({cl, cardCount, balHours, accountant})=>{
    const ctype = cl.clientType||'novo';
    const typeMeta = ctype==='base' ? {bg:'var(--brand-soft)', color:'var(--brand)', label:'Base'}
      : ctype==='contador' ? {bg:'#EDE7F6', color:'#7B4B94', label:'Contador'}
      : {bg:'var(--gold-soft)', color:'var(--gold)', label:'Novo'};
    const typeBadge = '<span class="badge" style="background:'+typeMeta.bg+';color:'+typeMeta.color+';">'+typeMeta.label+'</span>';
    const hasLinks = cardCount > 0 || schedulesForClient(cl.id).length > 0;
    const balTxt = cardCount ? minToHM(balHours*60) : '—';
    const balColor = balHours < 0 ? 'var(--danger)' : 'var(--ok)';
    const accTxt = (ctype==='contador')
      ? '<span class="hint">—</span>'
      : (accountant ? esc(accountant.name) : '<span style="color:var(--ink-faint);">—</span>');
    html += '<tr><td>'+esc(cl.code||'—')+'</td><td style="font-weight:700;">'+esc(cl.name)+'</td><td>'+esc(cl.companyName||'—')+'</td><td>'+esc(cl.cnpj||'—')+'</td><td>'+typeBadge+'</td>'
      + '<td>'+accTxt+'</td>'
      + '<td>'+(cardCount? '<span style="color:'+balColor+';font-weight:700;">'+balTxt+'</span>' : '<span class="hint">—</span>')+'</td>'
      + '<td>'+esc(cl.city||'—')+'</td><td>'+esc(cl.uf||'—')+'</td><td>'+esc(cl.cep||'—')+'</td><td>'+esc(cl.contact||'—')+'</td><td>'+cardCount+'</td>'
      + '<td><div class="row-actions"><button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="client-view" data-id="'+cl.id+'">Visualizar</button><button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="client-edit" data-id="'+cl.id+'">Editar</button>'
      + '<button class="btn btn-sm btn-danger" data-action="delete-client" data-id="'+cl.id+'" '+(hasLinks?'disabled title="Não é possível excluir: há vínculos."':'')+'>Excluir</button></div></td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

/* ============================= SETTINGS VIEW ============================= */
function switchCell(kind, id, inactive, labelOn, labelOff){
  return '<label class="switch" title="'+(inactive? 'Inativo — clique para ativar':'Ativo — clique para inativar')+'">'
    + '<input type="checkbox" data-action="toggle-entity-active" data-kind="'+kind+'" data-id="'+id+'" '+(inactive?'':'checked')+'>'
    + '<span class="slider"></span></label>'
    + '<span class="status-label '+(inactive?'inactive':'active')+'">'+(inactive? (labelOff||'Inativo') : (labelOn||'Ativo'))+'</span>';
}

function renderSettingsView(){
  const admin = isAdminUser();
  const allTabs = [
    {k:'analistas', l:'Analistas', adminOnly:true},
    {k:'produtos',  l:'Produtos',  adminOnly:false},
    {k:'modulos',   l:'Módulos do sistema', adminOnly:false},

      + sortableTh('cfg-analistas','profile','Perfil',analSort)
      + sortableTh('cfg-analistas','status','Situação',analSort)
      + '<th></th></tr></thead><tbody>';
    sortedAnalysts.forEach(a=>{
      const board = boardOfAnalyst(a.id);
      const linkedScheds = schedulesForAnalyst(a.id).length;
      const canDelete = !a.isAdmin && linkedScheds === 0 && !(board && cardsInBoard(board.id).length);
      const blockTitle = a.isAdmin ? 'Administrador não pode ser excluído.' : (linkedScheds ? 'Há '+linkedScheds+' agendamento(s).' : (board && cardsInBoard(board.id).length ? 'Há cards vinculados.' : ''));
      html += '<tr'+(a.inactive?' class="row-inactive"':'')+'>'

        + '<td>'+(a.username? '<code style="font-size:12px;background:var(--surface-2);padding:2px 6px;border-radius:5px;">'+esc(a.username)+'</code>' : '<span class="hint">—</span>')+'</td>'
        + '<td>'+esc(board?board.name:'—')+'</td>'
        + '<td><span style="display:inline-flex;align-items:center;gap:6px;"><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:'+a.color+';border:1px solid rgba(0,0,0,.15);"></span><code style="font-size:11.5px;background:var(--surface-2);padding:2px 6px;border-radius:5px;">'+a.color+'</code></span></td>'

          + '</div></td></tr>';

    html += '</tbody></table><div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="analyst-new">+ Novo analista</button></div></div>';

        + '<th></th></tr></thead><tbody>';

          + '<td><div class="row-actions"><button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="product-edit" data-id="'+t.id+'">Editar</button>'

      html += '</tbody></table>';
    }
    html += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="product-new">+ Novo produto</button></div></div>';
  } else if(ui.settingsTab==='modulos'){
    html += '<div class="section-card"><h3>Módulos do sistema — cadastro</h3>';
    if(!state.modules.length){ html += '<p class="hint">Nenhum módulo cadastrado ainda.</p>'; }
    else {
      const modSort = getTableSort('cfg-modulos', 'name', 'asc');
      const modRows = state.modules.map(m=>{
        const linked = schedulesUsingModule(m.name);
        const products = moduleProductIds(m).map(pid=>byId(state.productTags, pid)).filter(Boolean);
        return {m, linked, linkedScreens: screensForModule(m.id), products};
      });
      const modAccessor = (r,key)=>{
        switch(key){
          case 'name': return r.m.name;
          case 'product': return r.products.map(p=>p.name).join(', ');
          case 'linked': return r.linked.length;
          case 'status': return r.m.inactive?1:0;
          default: return '';
        }
      };
      const sortedModRows = sortRowsBy(modRows, modSort, modAccessor);
      html += '<table><thead><tr>'
        + sortableTh('cfg-modulos','name','Módulo',modSort)
        + sortableTh('cfg-modulos','product','Produtos',modSort)
        + sortableTh('cfg-modulos','linked','Agendamentos vinculados',modSort)
        + sortableTh('cfg-modulos','status','Situação',modSort)
        + '<th></th></tr></thead><tbody>';
      sortedModRows.forEach(({m, linked, linkedScreens, products})=>{
        const clientNames = clientNamesForSchedules(linked);
        const canDelete = linked.length===0 && linkedScreens.length===0;
        const productChips = products.length
          ? products.map(p=>'<span class="chip" style="background:'+p.color+';">'+esc(p.name)+'</span>').join(' ')
          : '<span class="hint">— Nenhum —</span>';
        html += '<tr'+(m.inactive?' class="row-inactive"':'')+'><td style="font-weight:700;">'+esc(m.name)+'</td>'
          + '<td>'+productChips+'</td>'
          + '<td>'+(linked.length ? (linked.length+' agendamento(s)'+(clientNames.length? ' — '+clientNames.map(esc).join(', '):'')) : '<span class="hint">Nenhum</span>')+'</td>'
          + '<td>'+switchCell('module', m.id, m.inactive, 'Ativo', 'Inativo')+'</td>'
          + '<td><div class="row-actions"><button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="module-edit" data-id="'+m.id+'">Editar</button>'
          + '<button class="btn btn-sm btn-danger" data-action="delete-module" data-id="'+m.id+'" '+(canDelete?'':'disabled title="Há vínculos."')+'>Excluir</button></div></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="module-new">+ Novo módulo</button></div></div>';
  } else if(ui.settingsTab==='telas'){
    html += '<div class="section-card"><h3>Telas — cadastro</h3>';
    if(!state.modules.length){ html += '<p class="hint">Cadastre um módulo primeiro.</p>'; }
    else if(!state.screens.length){ html += '<p class="hint">Nenhuma tela cadastrada ainda.</p>'; }
    else {
      const telasSort = getTableSort('cfg-telas', 'name', 'asc');
      const telaRows = state.screens.map(scr=>({scr, mod: byId(state.modules, scr.moduleId), linked: schedulesUsingScreen(scr.name)}));
      const telasAccessor = (r,key)=>{
        switch(key){
          case 'name': return r.scr.name;
          case 'module': return r.mod?r.mod.name:'';
          case 'linked': return r.linked.length;
          case 'status': return r.scr.inactive?1:0;
          default: return '';
        }
      };
      const sortedTelaRows = sortRowsBy(telaRows, telasSort, telasAccessor);
      html += '<table><thead><tr>'
        + sortableTh('cfg-telas','name','Tela',telasSort)
        + sortableTh('cfg-telas','module','Módulo',telasSort)
        + sortableTh('cfg-telas','linked','Agendamentos vinculados',telasSort)
        + sortableTh('cfg-telas','status','Situação',telasSort)
        + '<th></th></tr></thead><tbody>';
      sortedTelaRows.forEach(({scr, mod, linked})=>{
        const canDelete = linked.length===0;
        html += '<tr'+(scr.inactive?' class="row-inactive"':'')+'><td style="font-weight:700;">'+esc(scr.name)+'</td><td>'+esc(mod?mod.name:'—')+'</td>'
          + '<td>'+(linked.length ? (linked.length+' agendamento(s)') : '<span class="hint">Nenhum</span>')+'</td>'
          + '<td>'+switchCell('screen', scr.id, scr.inactive, 'Ativo', 'Inativo')+'</td>'
          + '<td><div class="row-actions"><button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="screen-edit" data-id="'+scr.id+'">Editar</button>'
          + '<button class="btn btn-sm btn-danger" data-action="delete-screen" data-id="'+scr.id+'" '+(canDelete?'':'disabled title="Há agendamentos usando esta tela."')+'>Excluir</button></div></td></tr>';
      });
      html += '</tbody></table>';
    }
    if(state.modules.length){ html += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="screen-new">+ Nova tela</button></div>'; }
    html += '</div>';
  } else if(ui.settingsTab==='tipos'){
    html += '<div class="section-card"><h3>Tipos de agenda — cadastro</h3>';
    if(!state.agendaTypes.length){ html += '<p class="hint">Nenhum tipo cadastrado ainda.</p>'; }
    else {
      const tiposSort = getTableSort('cfg-tipos', 'name', 'asc');
      const tipoRows = state.agendaTypes.map(t=>({t, linked: schedulesUsingType(t.name)}));
      const tiposAccessor = (r,key)=>{
        switch(key){
          case 'name': return r.t.name;
          case 'category': return r.t.isServico ? 'Serviço' : (r.t.isInternal ? 'Interna' : 'Implantação');
          case 'linked': return r.linked.length;
          case 'status': return r.t.inactive?1:0;
          default: return '';
        }
      };
      const sortedTipoRows = sortRowsBy(tipoRows, tiposSort, tiposAccessor);
      html += '<table><thead><tr>'
        + sortableTh('cfg-tipos','name','Tipo',tiposSort)
        + sortableTh('cfg-tipos','category','Categoria',tiposSort)
        + sortableTh('cfg-tipos','linked','Agendamentos vinculados',tiposSort)
        + sortableTh('cfg-tipos','status','Situação',tiposSort)
        + '<th></th></tr></thead><tbody>';
      sortedTipoRows.forEach(({t, linked})=>{
        const canDelete = linked.length===0;
        const catLabel = t.isServico ? 'Serviço' : (t.isInternal ? 'Interna' : 'Implantação');
        const catBg = t.isServico ? '#EDE7F6' : (t.isInternal?'var(--gold-soft)':'var(--brand-soft)');
        const catColor = t.isServico ? '#7B4B94' : (t.isInternal?'var(--gold)':'var(--brand)');
        html += '<tr'+(t.inactive?' class="row-inactive"':'')+'><td style="font-weight:700;">'+esc(t.name)+'</td>'
          + '<td><span class="badge" style="background:'+catBg+';color:'+catColor+';">'+catLabel+'</span></td>'
          + '<td>'+(linked.length ? (linked.length+' agendamento(s)') : '<span class="hint">Nenhum</span>')+'</td>'
          + '<td>'+switchCell('type', t.id, t.inactive, 'Ativo', 'Inativo')+'</td>'
          + '<td><div class="row-actions"><button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="type-edit" data-id="'+t.id+'">Editar</button>'
          + '<button class="btn btn-sm btn-danger" data-action="delete-type" data-id="'+t.id+'" '+(canDelete?'':'disabled title="Há agendamentos usando este tipo."')+'>Excluir</button></div></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="type-new">+ Novo tipo</button></div></div>';
  } else if(ui.settingsTab==='acesso' && admin){
    const meAnalyst = currentUser && currentUser.analystId ? getAnalyst(currentUser.analystId) : null;
    html += '<div class="section-card"><h3>Credenciais de acesso</h3>';
    if(!state.analysts.length){ html += '<p class="hint">Nenhum analista cadastrado.</p>'; }
    else {
      html += '<table><thead><tr><th>Nome</th><th>Usuário</th><th>Senha</th><th>Perfil</th><th>Situação</th><th></th></tr></thead><tbody>';
      state.analysts.forEach(a=>{
        html += '<tr'+(a.inactive?' class="row-inactive"':'')+'>'
          + '<td style="font-weight:700;">'+esc(a.name)+(a.isAdmin?' <span class="badge" style="background:var(--gold-soft);color:var(--gold);">ADMIN</span>':'')+'</td>'
          + '<td>'+(a.username? '<code style="font-size:12px;background:var(--surface-2);padding:2px 6px;border-radius:5px;">'+esc(a.username)+'</code>' : '<span class="hint">—</span>')+'</td>'
          + '<td>'+(a.password? '•••••••• <button class="btn btn-sm btn-ghost" data-action="toggle-show-pass" data-id="'+a.id+'" style="font-size:11px;">👁 ver</button>' : '<span class="hint">—</span>')+'</td>'
          + '<td>'+(a.isAdmin?'Administrador':'Analista')+'</td>'
          + '<td>'+(a.inactive? '<span class="badge" style="background:#B9CAD5;color:#fff;">Inativo</span>' : '<span class="badge" style="background:var(--ok-soft);color:var(--ok);">Ativo</span>')+'</td>'
          + '<td><button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="analyst-edit" data-id="'+a.id+'">Editar</button></td>'
          + '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    if(meAnalyst){
      html += '<div class="section-card"><h3>Trocar minha senha</h3>'
        + '<form data-form="change-password" data-id="'+meAnalyst.id+'">'
        + '<div class="field-row">'
        + '<div class="field"><label>Senha atual</label><input type="password" name="currentPassword" required></div>'
        + '<div class="field"><label>Nova senha</label><input type="password" name="newPassword" minlength="4" required></div>'
        + '<div class="field"><label>Confirmar nova senha</label><input type="password" name="confirmPassword" minlength="4" required></div>'
        + '</div>'
        + '<div class="form-actions"><button type="submit" class="btn btn-primary">Alterar senha</button></div>'
        + '</form></div>';
    }
    html += '<div class="section-card"><h3>Conta mestra de emergência</h3>'
      + '<table><thead><tr><th>Usuário</th><th>Senha</th></tr></thead><tbody>'
      + '<tr><td><code style="background:var(--surface-2);padding:2px 6px;border-radius:5px;">'+MASTER_USER+'</code></td>'
      + '<td><code style="background:var(--surface-2);padding:2px 6px;border-radius:5px;">'+MASTER_PASS+'</code></td></tr>'
      + '</tbody></table></div>';
  } else if(ui.settingsTab==='nuvem' && admin){
    html += '<div class="section-card"><h3>Sincronização na nuvem</h3>';
    const hasDefault = !!(DEFAULT_CLOUD_CONFIG.url && DEFAULT_CLOUD_CONFIG.anonKey);
    if(cloudStatus==='connected'){
      html += '<p class="hint">☁ Conectado'+(usingDefaultCloud?' à nuvem padrão deste site':' a uma nuvem configurada manualmente')+'.</p>'
        + '<button class="btn btn-danger btn-sm" data-action="cloud-disconnect">Desconectar</button>';
    } else {
      if(cloudStatus==='error') html += '<div class="error-msg">'+esc(cloudErrorMsg)+'</div>';
      if(hasDefault){
        html += '<p class="hint">Este navegador está configurado para salvar só localmente.</p>'
          + '<button class="btn btn-primary btn-sm" data-action="cloud-reconnect-default" style="margin-bottom:16px;">Reconectar à nuvem deste site</button>';
      }
      html += '<form data-form="cloud-config">'
        + '<div class="field"><label>Project URL</label><input type="text" name="url" value="'+esc(cloudConfig?cloudConfig.url:'')+'" required></div>'
        + '<div class="field"><label>Anon public key</label><input type="text" name="anonKey" value="'+esc(cloudConfig?cloudConfig.anonKey:'')+'" required></div>'
        + '<div class="form-actions"><span style="flex:1;"></span><button type="submit" class="btn btn-primary">Conectar</button></div>'
        + '</form>';
    }
    html += '</div>';
  }
  return html;
}

/* ============================= MODALS ============================= */
function renderModal(){
  const m = ui.modal;
  let inner = '';
  if(m.type==='analyst-new' || m.type==='analyst-edit'){
    if(!isAdminUser()){ return '<div class="overlay"><div class="modal"><p>Sem permissão.</p></div></div>'; }
    const a = m.type==='analyst-edit' ? getAnalyst(m.id) : null;
    const isSelf = a && currentUser && currentUser.analystId===a.id;
    const editingAdmin = a && a.isAdmin;
    const canToggleAdmin = isAdminUser() && !editingAdmin;
    inner = '<div class="modal-header"><h3>'+(a?'Editar analista':'Novo analista')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="analyst" data-id="'+(a?a.id:'')+'">'
      + '<div class="field"><label>Nome</label><input type="text" name="name" value="'+esc(a?a.name:'')+'" required></div>'
      + '<div class="field-row">'
      + '<div class="field"><label>Usuário (login)</label><input type="text" name="username" value="'+esc(a?a.username:'')+'" required autocomplete="off"></div>'
      + '<div class="field"><label>Cor</label><input type="color" name="color" value="'+(a?a.color:colorForIndex(state.analysts.length))+'"></div>'
      + '</div>'
      + '<div class="field"><label>Foto do analista</label><div class="photo-field">'
      +   (a ? analystAvatar(a,56) : '<span class="av" style="width:56px;height:56px;font-size:24px;background:#B9CAD5;">?</span>')
      +   '<div style="flex:1;min-width:0;"><input type="file" name="photo" accept="image/*">'
      +   (a && a.photo ? '<label class="check-pill" style="width:fit-content;margin-top:6px;"><input type="checkbox" name="removePhoto"> Remover foto atual</label>' : '')
      +   '</div></div></div>'
      + '<div class="field-row">'
      + '<div class="field"><label>'+(a?'Nova senha (em branco mantém)':'Senha')+'</label><input type="password" name="password" '+(a?'':'required')+' minlength="4" autocomplete="new-password"></div>'
      + '<div class="field"><label>Confirmar senha</label><input type="password" name="passwordConfirm" '+(a?'':'required')+' minlength="4" autocomplete="new-password"></div>'
      + '</div>'
      + (canToggleAdmin ? '<div class="field"><label class="check-pill" style="width:fit-content;"><input type="checkbox" name="isAdmin"> Conceder perfil de administrador</label></div>' : '')
      + (isSelf ? '<div class="hint">Você está editando seu próprio usuário.</div>' : '')
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='client-new' || m.type==='client-edit'){
    const c = m.type==='client-edit' ? getClient(m.id) : null;
    const draft = m.values || null;
    const eff = {
      code: draft ? (draft.code||'') : (c?c.code:''),
      clientType: draft ? (draft.clientType||'novo') : (c ? (c.clientType||'novo') : 'novo'),
      name: draft ? (draft.name||'') : (c?c.name:''),
      companyName: draft ? (draft.companyName||'') : (c?c.companyName:''),
      cnpj: draft ? (draft.cnpj||'') : (c?c.cnpj:''),
      ie: draft ? (draft.ie||'') : (c?c.ie:''),
      segment: draft ? (draft.segment||'') : (c?c.segment:''),
      city: draft ? (draft.city||'') : (c?c.city:''),
      uf: draft ? (draft.uf||'') : (c?(c.uf||''):''),
      cep: draft ? (draft.cep||'') : (c?(c.cep||''):''),
      contact: draft ? (draft.contact||'') : (c?c.contact:''),
      email: draft ? (draft.email||'') : (c?c.email:''),
      phone: draft ? (draft.phone||'') : (c?c.phone:''),
      crc: draft ? (draft.crc||'') : (c?(c.crc||''):''),
      ownerCpf: draft ? (draft.ownerCpf||'') : (c?(c.ownerCpf||''):''),
      accountantId: draft ? (draft.accountantId||'') : (c?(c.accountantId||''):'')
    };
    const ctype = eff.clientType;
    /* Lista dos contadores disponíveis para vinculação (excluindo o próprio
       cliente que está sendo editado e contadores inativos). */
    const accountantOptions = state.clients.filter(cl =>
      cl.clientType==='contador' && cl.id !== (c?c.id:'')
    );
    inner = '<div class="modal-header"><h3>'+(c?'Editar cliente':'Novo cliente')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="client" data-id="'+(c?c.id:'')+'">'
      + '<div class="field-row"><div class="field"><label>Código</label><input type="text" name="code" value="'+esc(eff.code)+'"></div><div class="field"><label>Tipo</label><select name="clientType">'
        + '<option value="novo" '+(ctype==='novo'?'selected':'')+'>Novo</option>'
        + '<option value="base" '+(ctype==='base'?'selected':'')+'>Base</option>'
        + '<option value="contador" '+(ctype==='contador'?'selected':'')+'>Contador</option>'
      + '</select></div></div>'
      + '<div class="field"><label>Nome fantasia</label><input type="text" name="name" value="'+esc(eff.name)+'" required></div>'
      + '<div class="field"><label>Razão social</label><input type="text" name="companyName" value="'+esc(eff.companyName)+'"></div>'
      + '<div class="field-row"><div class="field"><label>CNPJ</label><input type="text" name="cnpj" value="'+esc(eff.cnpj)+'"></div><div class="field"><label>IE</label><input type="text" name="ie" value="'+esc(eff.ie)+'"></div></div>'
      + (ctype==='contador' ? '<div class="field-row"><div class="field"><label>CRC</label><input type="text" name="crc" value="'+esc(eff.crc)+'" placeholder="Ex: 1SP123456/O-0"></div><div class="field"><label>CPF do proprietário</label><input type="text" name="ownerCpf" value="'+esc(eff.ownerCpf)+'" placeholder="000.000.000-00"></div></div>' : '')
      /* Vínculo com contador: só aparece para clientes que não são contador. */
      + (ctype!=='contador' ? (accountantOptions.length
          ? '<div class="field"><label>Contador responsável</label><select name="accountantId">'
            + '<option value="">— Nenhum —</option>'
            + accountantOptions.map(acc => '<option value="'+acc.id+'" '+(eff.accountantId===acc.id?'selected':'')+'>'+esc(acc.name)+(acc.cnpj?' — '+esc(acc.cnpj):'')+'</option>').join('')
            + '</select><div class="hint" style="margin-top:2px;">Cadastre um cliente do tipo "Contador" para que ele apareça aqui.</div></div>'
          : '<div class="hint" style="margin:0 0 13px;">Nenhum contador cadastrado ainda. Cadastre um cliente do tipo "Contador" para poder vinculá-lo.</div>')
        : '')
      + '<div class="field-row"><div class="field"><label>Segmento</label><input type="text" name="segment" value="'+esc(eff.segment)+'"></div><div class="field"><label>Cidade</label><input type="text" name="city" value="'+esc(eff.city)+'"></div></div>'
      + '<div class="field-row"><div class="field"><label>UF</label><input type="text" name="uf" maxlength="2" value="'+esc(eff.uf)+'" placeholder="Ex: PR" style="text-transform:uppercase;"></div><div class="field"><label>CEP</label><input type="text" name="cep" value="'+esc(eff.cep)+'" placeholder="00000-000"></div></div>'
      + '<div class="field"><label>Contato</label><input type="text" name="contact" value="'+esc(eff.contact)+'"></div>'
      + '<div class="field-row"><div class="field"><label>E-mail</label><input type="email" name="email" value="'+esc(eff.email)+'"></div><div class="field"><label>Telefone</label><input type="tel" name="phone" value="'+esc(eff.phone)+'"></div></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='client-view'){
    const c = getClient(m.id);
    if(!c){ inner = '<div class="modal-header"><h3>Cliente não encontrado</h3><button class="modal-close" data-action="close-modal">✕</button></div>'; }
    else {
      const ctype = c.clientType||'novo';
      const ctypeLabel = ctype==='novo' ? 'Novo' : (ctype==='base' ? 'Base' : 'Contador');
      const accountant = c.accountantId ? getClient(c.accountantId) : null;
      inner = '<div class="modal-header"><h3>Visualizar cliente</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
        + '<div class="hint" style="margin:0 0 14px;">Modo somente visualização. Os dados não podem ser alterados nesta tela.</div>'
        + '<div class="field-row"><div class="field"><label>Código</label><input type="text" value="'+esc(c.code||'')+'" disabled></div><div class="field"><label>Tipo</label><input type="text" value="'+esc(ctypeLabel)+'" disabled></div></div>'
        + '<div class="field"><label>Nome fantasia</label><input type="text" value="'+esc(c.name||'')+'" disabled></div>'
        + '<div class="field"><label>Razão social</label><input type="text" value="'+esc(c.companyName||'')+'" disabled></div>'
        + '<div class="field-row"><div class="field"><label>CNPJ</label><input type="text" value="'+esc(c.cnpj||'')+'" disabled></div><div class="field"><label>IE</label><input type="text" value="'+esc(c.ie||'')+'" disabled></div></div>'
        + (ctype==='contador' ? '<div class="field-row"><div class="field"><label>CRC</label><input type="text" value="'+esc(c.crc||'')+'" disabled></div><div class="field"><label>CPF do proprietário</label><input type="text" value="'+esc(c.ownerCpf||'')+'" disabled></div></div>' : '')
        + (ctype!=='contador' && accountant ? '<div class="field"><label>Contador responsável</label><input type="text" value="'+esc(accountant.name)+'" disabled></div>' : '')
        + '<div class="field-row"><div class="field"><label>Segmento</label><input type="text" value="'+esc(c.segment||'')+'" disabled></div><div class="field"><label>Cidade</label><input type="text" value="'+esc(c.city||'')+'" disabled></div></div>'
        + '<div class="field-row"><div class="field"><label>UF</label><input type="text" value="'+esc(c.uf||'')+'" disabled></div><div class="field"><label>CEP</label><input type="text" value="'+esc(c.cep||'')+'" disabled></div></div>'
        + '<div class="field"><label>Contato</label><input type="text" value="'+esc(c.contact||'')+'" disabled></div>'
        + '<div class="field-row"><div class="field"><label>E-mail</label><input type="email" value="'+esc(c.email||'')+'" disabled></div><div class="field"><label>Telefone</label><input type="tel" value="'+esc(c.phone||'')+'" disabled></div></div>'
        + '<div class="form-actions"><button type="button" class="btn btn-primary" data-action="close-modal">Fechar</button></div>';
    }
  } else if(m.type==='product-new' || m.type==='product-edit'){
    const p = m.type==='product-edit' ? byId(state.productTags, m.id) : null;
    inner = '<div class="modal-header"><h3>'+(p?'Editar produto':'Novo produto')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="product" data-id="'+(p?p.id:'')+'">'
      + '<div class="field"><label>Nome</label><input type="text" name="name" value="'+esc(p?p.name:'')+'" required></div>'
      + '<div class="field"><label>Cor</label><input type="color" name="color" value="'+(p?p.color:colorForIndex(state.productTags.length))+'"></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='module-new' || m.type==='module-edit'){

    inner = '<div class="modal-header"><h3>'+(md?'Editar módulo':'Novo módulo')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'

    if(!state.productTags.length){ inner += '<span class="hint">Nenhum produto cadastrado.</span>'; }
    state.productTags.forEach(pt=>{
      const checked = effProductIds.includes(pt.id) ? 'checked' : '';
      inner += '<label class="check-pill" style="border-color:'+pt.color+'55;"><input type="checkbox" name="productIds" value="'+pt.id+'" '+checked+'><span style="color:'+pt.color+';font-weight:700;">'+esc(pt.name)+'</span></label>';
    });
    inner += '</div></div>'

  } else if(m.type==='screen-new' || m.type==='screen-edit'){
    const scr = m.type==='screen-edit' ? byId(state.screens, m.id) : null;
    inner = '<div class="modal-header"><h3>'+(scr?'Editar tela':'Nova tela')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="screen" data-id="'+(scr?scr.id:'')+'">'
      + '<div class="field"><label>Nome da tela</label><input type="text" name="name" value="'+esc(scr?scr.name:'')+'" required></div>'
      + '<div class="field"><label>Módulo</label><select name="moduleId">';
    state.modules.forEach(md=> inner += '<option value="'+md.id+'" '+(scr && scr.moduleId===md.id?'selected':'')+'>'+esc(md.name)+'</option>');
    inner += '</select></div><div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='type-new' || m.type==='type-edit'){
    const tp = m.type==='type-edit' ? byId(state.agendaTypes, m.id) : null;
    const isInt = tp ? !!tp.isInternal : false;
    const isSrv = tp ? !!tp.isServico : false;
    inner = '<div class="modal-header"><h3>'+(tp?'Editar tipo':'Novo tipo')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="agenda-type" data-id="'+(tp?tp.id:'')+'">'
      + '<div class="field"><label>Nome</label><input type="text" name="name" value="'+esc(tp?tp.name:'')+'" required></div>'
      + '<div class="field"><label>Categoria</label><select name="catKind">'
        + '<option value="implantacao" '+(!isInt && !isSrv?'selected':'')+'>Implantação</option>'
        + '<option value="interna" '+(isInt?'selected':'')+'>Interna</option>'
        + '<option value="servico" '+(isSrv?'selected':'')+'>Serviço</option>'
      + '</select></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='list-new'){
    inner = '<div class="modal-header"><h3>Nova lista</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="list-new" data-board="'+m.board+'"><div class="field"><label>Nome da lista</label><input type="text" name="name" required></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Criar</button></div></form>';
  } else if(m.type==='card-new'){
    const board = getBoard(m.board);

    const cnClientId = cdraft.clientId || '';
    const cnHours = cdraft.contractedHours!=null ? cdraft.contractedHours : 0;
    const cnStart = cdraft.startDate || todayISO();
    const cnNewName = cdraft.newClientName || '';
    const cnUseBalance = cdraft.useExistingBalance === 'on' || cdraft.useExistingBalance === true;
    const selClient = cnClientId ? getClient(cnClientId) : null;
    const previousBalance = selClient ? clientConsolidatedBalanceHours(selClient.id) : 0;
    const hasPrevious = selClient ? clientHasPastCards(selClient.id) : false;
    inner = '<div class="modal-header"><h3>Novo cliente no quadro</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="card-new" data-board="'+m.board+'" data-list="'+(m.list||board.lists[0].id)+'">'
      + '<div class="field"><label>Cliente</label>'+renderClientPicker('clientId', cnClientId, m.clientQuery)+'</div>';
    if(!cnClientId){
      inner += '<div class="field"><label>Nome do novo cliente</label><input type="text" name="newClientName" value="'+esc(cnNewName)+'" placeholder="Obrigatório se não selecionar um cliente acima"></div>';
    }
    if(selClient && hasPrevious){
      inner += '<div class="choice-box">'
        + '<div class="choice-title">💡 Cliente já possui histórico</div>'
        + '<div class="choice-desc">Saldo consolidado anterior: <strong>'+minToHM(previousBalance*60)+'</strong> em '+state.cards.filter(c=>c.clientId===selClient.id).length+' card(s).</div>'
        + '<label class="check-pill" style="margin-top:8px;"><input type="checkbox" name="useExistingBalance" '+(cnUseBalance?'checked':'')+'> Importar esse saldo para este novo card</label>'

    inner += '<div class="field-row"><div class="field"><label>Horas contratadas</label><input type="number" min="0" step="0.5" name="contractedHours" value="'+esc(cnHours)+'"></div>'
      + '<div class="field"><label>Início</label><input type="date" name="startDate" value="'+esc(cnStart)+'"></div></div>'
      + '<div class="field"><label>Data do Comercial (envio do contrato)</label><input type="date" name="commercialDate" value="'+esc(cdraft.commercialDate||'')+'"></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Criar card</button></div></form>';
  } else if(m.type==='schedule-new' || m.type==='schedule-edit'){
    inner = renderScheduleForm(m);
  } else if(m.type==='confirm-complete'){
    const s = byId(state.schedules, m.id);
    const dur = scheduleMinutes(s);
    const nAnalysts = scheduleAnalystIds(s).length || 1;
    const perAnalyst = scheduleMinutesPerAnalyst(s);
    const detailMsg = nAnalysts > 1 ? ' (base: '+minToHM(perAnalyst)+' × '+nAnalysts+' analistas)' : '';

      + '<p class="hint">'+(s.title? '<strong>'+esc(s.title)+'</strong> · ':'')+scheduleDateText(s)+' · '+(s.allDay?'Dia todo':s.startTime+'–'+s.endTime)+' · '+esc(s.type)+'</p>'
      + '<form data-form="confirm-complete" data-id="'+s.id+'">'
      + '<div class="field"><label>Minutos a abater'+detailMsg+'</label><input type="number" min="0" name="deductMinutes" value="'+dur+'"></div>'
      + '<div class="field"><label>Observação</label><textarea name="notes">'+esc(s.notes||'')+'</textarea></div>'

    inner = renderScheduleReportContent(m.id);

    inner = renderAgendaPrintReport(m.id);
